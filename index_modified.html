<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Hero Engine</title>
    
    <!-- Vector UI Assets & Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Separate Stylesheet Linking -->
    <link rel="stylesheet" href="style.css">
    <style>
      /* --- UNIVERSAL MASTER SETTINGS --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

:root {
    --bg-dark: #070b16;             /* Absolute Requested Canvas Core */
    --accent-blue: #0052ff;         /* Vibrant Active Button Blue */
    --blue-glow-layer: rgba(0, 82, 255, 0.25);
    --panel-backing: #0c152b;       /* Integrated Deep Blue Container Tint */
    --border-stroke: #16264f;       /* Blueprint Grid Lines */
    --text-pure: #ffffff;           /* Crisp Main Focal Text */
    --text-subdued: #627ba8;       /* Subdued Hardware Info Layers */
    --transition-matrix: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

body {
    background-color: var(--bg-dark);
    color: var(--text-pure);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

/* --- ISOLATED HERO ENGINE STYLING --- */
.premium-hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 0;
    position: relative;
    background: radial-gradient(circle at 80% 30%, rgba(0, 82, 255, 0.06) 0%, rgba(7, 11, 22, 0) 65%);
}

.hero-container {
    width: 90%;
    max-width: 1240px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    align-items: center;
    gap: 72px;
}

/* --- LEFT CONTENT LAYOUT VECTOR --- */
.hero-data-vector {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background-color: rgba(0, 82, 255, 0.08);
    border: 1px solid var(--border-stroke);
    padding: 6px 14px;
    border-radius: 4px;
    margin-bottom: 28px;
}

.status-badge .pulse-dot {
    width: 6px;
    height: 6px;
    background-color: var(--accent-blue);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-blue);
}

.status-badge .badge-txt {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    color: var(--accent-blue);
}

.hero-data-vector h1 {
    font-size: 54px;
    font-weight: bold;
    line-height: 1.15;
    letter-spacing: -1px;
    color: var(--text-pure);
    margin-bottom: 24px;
}

.hero-data-vector p {
    font-size: 17px;
    line-height: 1.6;
    color: var(--text-subdued);
    max-width: 540px;
    margin-bottom: 44px;
}

/* --- BUTTON MATRIX ACTIONS --- */
.action-dock {
    display: flex;
    gap: 16px;
}

.btn {
    padding: 15px 32px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    transition: var(--transition-matrix);
}

.btn-action-primary {
    background-color: var(--accent-blue);
    color: var(--text-pure);
    border: 1px solid var(--accent-blue);
    box-shadow: 0 4px 18px var(--blue-glow-layer);
}

.btn-action-primary:hover {
    transform: translateY(-3px);
    background-color: #0044d4;
    box-shadow: 0 6px 24px rgba(0, 82, 255, 0.4);
}

.btn-action-secondary {
    background-color: transparent;
    color: var(--text-pure);
    border: 1px solid var(--border-stroke);
}

.btn-action-secondary:hover {
    background-color: rgba(0, 82, 255, 0.05);
    border-color: var(--accent-blue);
    transform: translateY(-3px);
}

/* --- RIGHT HARDWARE WINDOW FRAME --- */
.hero-visual-frame {
    display: flex;
    justify-content: center;
    perspective: 1200px; /* Activates 3D structural tracking */
}

.blueprint-window {
    background-color: var(--panel-backing);
    border: 1px solid var(--border-stroke);
    border-radius: 8px;
    padding: 6px;
    width: 100%;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 40px rgba(0, 82, 255, 0.08);
    transform: rotateY(-10deg) rotateX(4deg);
    transition: var(--transition-matrix);
}

.blueprint-window:hover {
    transform: rotateY(0deg) rotateX(0deg);
    border-color: var(--accent-blue);
    box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 50px rgba(0, 82, 255, 0.2);
}

.window-chrome {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px 14px;
    border-bottom: 1px solid var(--border-stroke);
}

.window-controls {
    display: flex;
    gap: 6px;
}

.control-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background-color: var(--border-stroke);
}

.control-dot.close { background-color: #ff4757; }

.window-title-tab {
    font-size: 10px;
    font-weight: bold;
    color: var(--text-subdued);
    letter-spacing: 0.5px;
}

.window-canvas {
    background-color: var(--bg-dark);
    padding: 24px;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.window-canvas img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    border: 1px solid var(--border-stroke);
    filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
}

/* --- MOBILE RESPONSIVE ENGINE --- */
@media (max-width: 992px) {
    .hero-container {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 56px;
    }
    
    .hero-data-vector {
        align-items: center;
    }
    
    .hero-data-vector p {
        margin-left: auto;
        margin-right: auto;
    }
    
    .action-dock {
        justify-content: center;
    }
    
    .blueprint-window {
        transform: none;
        max-width: 80%;
    }
    
    .blueprint-window:hover {
        transform: scale(1.02);
    }
}

@media (max-width: 540px) {
    .premium-hero {
        padding: 60px 0;
    }
    
    .hero-data-vector h1 {
        font-size: 38px;
    }
    
    .action-dock {
        flex-direction: column;
        width: 100%;
    }
    
    .btn {
        width: 100%;
        justify-content: center;
    }
    
    .blueprint-window {
        max-width: 100%;
    }
}

    </style>
</head>
<body>

    <!-- HIGH-PERFORMANCE HERO SECTION ONLY -->
    <section class="premium-hero">
        <div class="hero-container">
            
            <!-- Left Data Column -->
            <div class="hero-data-vector">
                <div class="status-badge">
                    <span class="pulse-dot"></span>
                    <span class="badge-txt">MATRIX COMPILER V4.2 LIVE</span>
                </div>
                
                <h1>Next-gen smartphone data pipelines.</h1>
                <p>Execute real-time phone comparisons, monitor ecosystem market updates, and uncover hidden structural flaws across thousands of modern device configurations.</p>
                
                <div class="action-dock">
                    <a href="#" class="btn btn-action-primary">
                        <i class="fas fa-bolt"></i> Initialize Compare
                    </a>
                    <a href="#" class="btn btn-action-secondary">
                        <i class="fas fa-database"></i> Specs Index
                    </a>
                </div>
            </div>
            
            <!-- Right Interface Mockup Frame -->
            <div class="hero-visual-frame">
                <div class="blueprint-window">
                    <div class="window-chrome">
                        <div class="window-controls">
                            <span class="control-dot close"></span>
                            <span class="control-dot shrink"></span>
                            <span class="control-dot expand"></span>
                        </div>
                        <div class="window-title-tab">TELEMETRY_RENDER_MATRIX</div>
                    </div>
                    
                    <div class="window-canvas">
                        <!-- Replace this with a high-definition image of your flagship phone mockup -->
                        <img src="https://unsplash.com" alt="Premium Smartphone Platform Architecture Mockup">
                    </div>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
