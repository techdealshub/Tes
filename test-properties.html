<b id="properties">0</b>
Properties
</div>

Tests
</div>

Supported
</div>

Changed
</div>

Static
</div>

<b id="numeric">0</b>
Numeric
</div>

Functions

<b id="invalid">0</b>
Invalid
</div>

<div id="results"></div>

<div id="target">CSS TEST TARGET</div>

<script>
"use strict";

/* =========================================================
   PART 1
   VARIABLES + UI
========================================================= */

const $ = id => document.getElementById(id);

const fileInput = $("file");
const loadButton = $("load");
const startButton = $("start");
const stopButton = $("stop");
const exportSuccessButton = $("exportSuccess");
const exportAllButton = $("exportAll");

const statusBox = $("status");
const currentBox = $("current");
const syntaxBox = $("syntax");
const resultsBox = $("results");
const progressBar = $("progressBar");

const target = $("target");

let cssData = null;
let properties = [];
let definitions = {};
let allStrings = new Set();
let staticValues = new Set();
let functionsFromJSON = new Set();

let results = [];
let successful = [];

let running = false;
let stopRequested = false;

let numericRange = 10;


/* =========================================================
   STATUS
========================================================= */

function status(text){
    statusBox.textContent = text;
    console.log(text);
}


/* =========================================================
   NORMALIZE
========================================================= */

function norm(v){
    return String(v ?? "")
        .replace(/\s+/g," ")
        .trim();
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function esc(v){
    return String(v)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   RANGE
========================================================= */

$("range").addEventListener("input",e=>{
    numericRange = Number(e.target.value);
    $("rangeValue").textContent = numericRange;
});


/* =========================================================
   RESET TARGET
========================================================= */

function resetTarget(){

    target.style.cssText = "";

    target.style.position = "absolute";
    target.style.left = "-10000px";
    target.style.top = "-10000px";

    target.style.width = "200px";
    target.style.height = "100px";

    target.style.padding = "10px";
    target.style.border = "2px solid white";

    target.style.background = "#1e293b";
    target.style.color = "white";

    target.style.boxSizing = "border-box";
}


/* =========================================================
   FILE LOAD
========================================================= */

fileInput.addEventListener("change",()=>{

    if(fileInput.files.length){

        status(
            "Selected: " +
            fileInput.files[0].name
        );

    }

});


/* =========================================================
   PROPERTY NAME
========================================================= */

function isPropertyName(name){

    return typeof name === "string" &&
        /^-?[a-zA-Z][a-zA-Z0-9_-]*$/.test(name) &&
        !name.startsWith("--");

}


/* =========================================================
   BASIC STATS
========================================================= */

function updateStats(){

    $("properties").textContent = properties.length;

    $("tests").textContent = results.length;

    $("supported").textContent =
        results.filter(x=>x.supported).length;

    $("changed").textContent =
        results.filter(x=>x.changed).length;

    $("static").textContent =
        results.filter(x=>x.kind==="static").length;

    $("numeric").textContent =
        results.filter(x=>x.kind==="numeric").length;

    $("functions").textContent =
        results.filter(x=>x.kind==="function").length;

    $("invalid").textContent =
        results.filter(x=>!x.supported).length;
}
  /* =========================================================
   PART 2
   READ ALL-CSS.JSON
========================================================= */


/* =========================================================
   RECURSIVE WALK
========================================================= */

function walk(value, callback, seen=new WeakSet()){

    if(value === null || value === undefined)
        return;

    if(typeof value !== "object")
        return;

    if(seen.has(value))
        return;

    seen.add(value);

    callback(value);

    if(Array.isArray(value)){

        for(const item of value)
            walk(item,callback,seen);

        return;
    }

    for(const key of Object.keys(value))
        walk(value[key],callback,seen);
}


/* =========================================================
   COLLECT STRINGS
========================================================= */

function collectEverything(data){

    allStrings = new Set();
    functionsFromJSON = new Set();

    walk(data,obj=>{

        if(Array.isArray(obj))
            return;

        for(const [key,value] of Object.entries(obj)){

            if(typeof value !== "string")
                continue;

            const s = norm(value);

            if(!s || s.length > 500)
                continue;

            allStrings.add(s);

            /*
               Function names occurring anywhere
               in all-css.json.
            */

            const matches =
                s.match(
                    /[a-zA-Z][a-zA-Z0-9-]*\s*\(/g
                );

            if(matches){

                for(let m of matches){

                    m = m
                        .replace(/\s*\($/,"")
                        .toLowerCase();

                    if(m)
                        functionsFromJSON.add(m);

                }

            }

        }

    });

    console.log(
        "ALL STRINGS:",
        allStrings.size
    );

    console.log(
        "FUNCTION NAMES:",
        functionsFromJSON.size
    );
}


/* =========================================================
   LOAD PROPERTIES
========================================================= */

function loadProperties(){

    properties = [];
    definitions = {};

    /*
       Expected format:

       {
          properties:[
             {
                name:"width",
                syntax:"..."
             }
          ]
       }
    */

    if(Array.isArray(cssData?.properties)){

        for(const item of cssData.properties){

            if(!item || typeof item !== "object")
                continue;

            const name = norm(item.name);

            if(!isPropertyName(name))
                continue;

            if(definitions[name])
                continue;

            definitions[name] = item;
            properties.push(name);
        }

    }

    /*
       Also support object format:

       {
          properties:{
             width:{syntax:"..."}
          }
       }
    */

    else if(
        cssData?.properties &&
        typeof cssData.properties === "object"
    ){

        for(const [name,item] of
            Object.entries(cssData.properties)){

            if(!isPropertyName(name))
                continue;

            if(item && typeof item === "object"){

                definitions[name] = {
                    ...item,
                    name
                };

            }
            else{

                definitions[name] = {
                    name,
                    syntax:String(item ?? "")
                };

            }

            properties.push(name);
        }

    }


    /*
       Remove duplicates.
    */

    properties = [...new Set(properties)];

    properties.sort();

    $("properties").textContent =
        properties.length;

    startButton.disabled =
        properties.length === 0;

    console.log(
        "TOTAL PROPERTIES:",
        properties.length
    );

    if(properties.length){

        showProperty(properties[0]);

    }

    return properties.length > 0;
}


/* =========================================================
   GET SYNTAX
========================================================= */

function getSyntax(property){

    const d = definitions[property];

    if(!d)
        return "";

    if(typeof d === "string")
        return norm(d);

    return norm(
        d.syntax ||
        d.value ||
        d.values ||
        ""
    );
}


/* =========================================================
   SHOW PROPERTY
========================================================= */

function showProperty(property){

    currentBox.textContent = property;

    syntaxBox.textContent =
        getSyntax(property) || "No syntax";
}


/* =========================================================
   FIND STATIC VALUES
========================================================= */

function isStaticCandidate(s){

    s = norm(s);

    if(!s)
        return false;

    if(s.length > 100)
        return false;

    /*
       Exclude URLs, syntax grammar,
       descriptions and sentences.
    */

    if(/^https?:\/\//i.test(s))
        return false;

    if(/[{};]/.test(s))
        return false;

    if(
        /<[^>]+>/.test(s) &&
        !/^<[^>]+>$/.test(s)
    )
        return false;

    /*
       Plain keyword.
    */

    if(
        /^-?[a-zA-Z_][a-zA-Z0-9_-]*$/.test(s)
    )
        return true;

    /*
       Numeric CSS value.
    */

    if(
        /^[-+]?(?:\d+|\d*\.\d+)(?:[a-zA-Z%]+)?$/.test(s)
    )
        return true;

    /*
       Color.
    */

    if(/^#[0-9a-fA-F]{3,8}$/.test(s))
        return true;

    return false;
}


/* =========================================================
   BUILD STATIC VALUE SET
========================================================= */

function buildStaticValues(){

    staticValues = new Set();

    for(const s of allStrings){

        if(isStaticCandidate(s))
            staticValues.add(s);

    }


    /*
       Important CSS globals.
    */

    const common = [

        "auto",
        "none",
        "normal",
        "initial",
        "inherit",
        "unset",
        "revert",
        "revert-layer",

        "block",
        "inline",
        "inline-block",
        "flex",
        "grid",

        "visible",
        "hidden",
        "collapse",

        "solid",
        "dashed",
        "dotted",

        "start",
        "end",
        "center",

        "left",
        "right",

        "top",
        "bottom",

        "baseline",
        "stretch",

        "min-content",
        "max-content",
        "fit-content",

        "content-box",
        "border-box",

        "row",
        "column",

        "wrap",
        "nowrap",

        "ltr",
        "rtl",

        "forwards",
        "backwards",
        "both",

        "ease",
        "ease-in",
        "ease-out",
        "ease-in-out",
        "linear"

    ];

    for(const x of common)
        staticValues.add(x);


    console.log(
        "STATIC VALUES:",
        staticValues.size
    );
}


/* =========================================================
   LOAD JSON BUTTON
========================================================= */

loadButton.addEventListener("click",async()=>{

    if(!fileInput.files.length){

        status("Choose all-css.json first.");
        return;

    }

    try{

        status("Loading all-css.json...");

        const text =
            await fileInput.files[0].text();

        cssData = JSON.parse(text);

        collectEverything(cssData);

        if(!loadProperties()){

            status(
                "JSON loaded but properties were not found."
            );

            return;
        }

        buildStaticValues();

        status(
            "LOADED ✓\n" +
            "Properties: " +
            properties.length +
            "\nStatic values: " +
            staticValues.size +
            "\nFunctions: " +
            functionsFromJSON.size
        );

    }
    catch(error){

        console.error(error);

        status(
            "JSON ERROR: " +
            error.message
        );

    }

});
  /* =========================================================
   PART 3
   SYNTAX TYPES + NUMERIC VALUES
========================================================= */


/* =========================================================
   EXTRACT TYPES FROM SYNTAX
========================================================= */

function getTypes(syntax){

    const types = new Set();

    const matches =
        syntax.match(/<[^>]+>/g) || [];

    for(const x of matches){

        const t =
            x.toLowerCase();

        types.add(t);
    }

    return types;
}


/* =========================================================
   TYPE DETECTION
========================================================= */

function hasType(types,...names){

    for(const name of names){

        if(types.has(name))
            return true;

    }

    return false;
}


/* =========================================================
   SELECTED UNITS
========================================================= */

function selectedUnits(){

    return [
        ...document.querySelectorAll(".unit:checked")
    ].map(x=>x.value);
}


/* =========================================================
   NUMERIC LENGTHS
========================================================= */

function generateNumericValues(types){

    const out = new Set();

    const max = numericRange;

    /*
       length
    */

    if(
        hasType(
            types,
            "<length>",
            "<length-percentage>",
            "<dimension>"
        )
    ){

        const units =
            selectedUnits().filter(
                u => u !== "%"
            );

        for(const unit of units){

            for(let n=0;n<=max;n++){

                out.add(n + unit);

            }

        }

    }


    /*
       percentage
    */

    if(
        hasType(
            types,
            "<percentage>",
            "<length-percentage>"
        )
    ){

        for(let n=0;n<=max;n++)
            out.add(n + "%");

    }


    /*
       number
    */

    if(
        hasType(
            types,
            "<number>",
            "<number-token>"
        )
    ){

        for(let n=0;n<=max;n++)
            out.add(String(n));

        /*
           Useful decimal values.
        */

        out.add("0.1");
        out.add("0.25");
        out.add("0.5");
        out.add("0.75");

    }


    /*
       integer
    */

    if(
        hasType(types,"<integer>")
    ){

        for(let n=0;n<=max;n++)
            out.add(String(n));

        for(let n=1;n<=max;n++)
            out.add("-" + n);

    }


    /*
       angle
    */

    if(
        hasType(types,"<angle>")
    ){

        const units = [
            "deg",
            "rad",
            "grad",
            "turn"
        ];

        for(const unit of units){

            for(let n=0;n<=max;n++)
                out.add(n + unit);

        }

    }


    /*
       time
    */

    if(
        hasType(types,"<time>")
    ){

        for(let n=0;n<=max;n++){

            out.add(n + "ms");

            out.add(n + "s");

        }

    }


    /*
       resolution
    */

    if(
        hasType(types,"<resolution>")
    ){

        for(const unit of ["dpi","dpcm","dppx"]){

            for(let n=1;n<=max;n++)
                out.add(n + unit);

        }

    }


    /*
       frequency
    */

    if(
        hasType(types,"<frequency>")
    ){

        for(const unit of ["Hz","kHz"]){

            for(let n=1;n<=max;n++)
                out.add(n + unit);

        }

    }


    /*
       flex
    */

    if(
        hasType(types,"<flex>")
    ){

        for(let n=0;n<=max;n++)
            out.add(n + "fr");

    }


    return out;
}


/* =========================================================
   COLOR VALUES
========================================================= */

function generateColors(types){

    const out = new Set();

    if(
        !hasType(
            types,
            "<color>",
            "<color-base>"
        )
    )
        return out;

    [
        "red",
        "green",
        "blue",
        "black",
        "white",
        "transparent",
        "#000",
        "#fff",
        "#f00",
        "#00f",
        "rgb(0 0 0)",
        "rgb(255 0 0)",
        "rgba(0,0,0,.5)",
        "hsl(0 100% 50%)"
    ].forEach(x=>out.add(x));

    return out;
}


/* =========================================================
   OTHER NUMERIC TYPES
========================================================= */

function generateSpecialNumeric(types){

    const out = new Set();

    if(hasType(types,"<opacity-value>")){

        for(let i=0;i<=10;i++)
            out.add(String(i/10));

    }

    if(hasType(types,"<alpha-value>")){

        for(let i=0;i<=10;i++)
            out.add(String(i/10));

    }

    return out;
}


/* =========================================================
   GET KEYWORDS FROM SYNTAX
========================================================= */

function syntaxKeywords(syntax){

    const out = new Set();

    /*
       Remove <types>.
    */

    let s =
        syntax.replace(
            /<[^>]+>/g,
            " "
        );

    /*
       Remove function grammar.
    */

    s =
        s.replace(
            /[a-zA-Z-]+\([^)]*\)/g,
            " "
        );

    /*
       Words.
    */

    const words =
        s.match(
            /(?<![-\w])[a-zA-Z][a-zA-Z0-9-]*(?![-\w])/g
        ) || [];

    for(const w of words){

        if(
            ![
                "none",
                "auto"
            ].includes(w)
        )
            out.add(w);

    }

    return out;
}


/* =========================================================
   FILTER STATIC VALUES BY SYNTAX
========================================================= */

function staticCandidates(property){

    const syntax =
        getSyntax(property);

    const types =
        getTypes(syntax);

    const keywords =
        syntaxKeywords(syntax);

    const out = new Set();

    /*
       First take explicit syntax keywords.
    */

    for(const value of staticValues){

        if(keywords.has(value))
            out.add(value);

    }

    /*
       Global keywords can apply to
       almost every normal property.
    */

    for(const value of [
        "initial",
        "inherit",
        "unset",
        "revert",
        "revert-layer"
    ])
        out.add(value);


    /*
       If syntax has no useful explicit
       keyword, still allow static values.
       CSS.supports will be the final filter.
    */

    if(
        keywords.size === 0 ||
        syntax === ""
    ){

        for(const value of staticValues)
            out.add(value);

    }


    return out;
}


/* =========================================================
   ALL NUMERIC CANDIDATES
========================================================= */

function numericCandidates(property){

    const syntax =
        getSyntax(property);

    const types =
        getTypes(syntax);

    const out = new Set();

    for(const x of generateNumericValues(types))
        out.add(x);

    for(const x of generateColors(types))
        out.add(x);

    for(const x of generateSpecialNumeric(types))
        out.add(x);

    return out;
}
  /* =========================================================
   PART 4
   FUNCTIONS FROM ALL-CSS.JSON
========================================================= */


/* =========================================================
   FUNCTION GENERATOR
========================================================= */

function functionValuesForTypes(types){

    const out = new Set();

    /*
       Generic CSS functions.
       Only added when the property's syntax
       can reasonably accept the corresponding
       value type.
    */

    const hasLength =
        hasType(
            types,
            "<length>",
            "<length-percentage>",
            "<dimension>"
        );

    const hasPercentage =
        hasType(
            types,
            "<percentage>",
            "<length-percentage>"
        );

    const hasNumber =
        hasType(
            types,
            "<number>",
            "<integer>",
            "<number-token>"
        );

    const hasColor =
        hasType(
            types,
            "<color>",
            "<color-base>"
        );

    const hasAngle =
        hasType(types,"<angle>");

    const hasTime =
        hasType(types,"<time>");

    /*
       calc
    */

    if(
        hasLength ||
        hasPercentage ||
        hasNumber ||
        hasAngle ||
        hasTime
    ){

        out.add("calc(1px + 1px)");
        out.add("calc(100px - 20px)");
        out.add("calc(50% + 10px)");
        out.add("calc(100% - 10px)");
        out.add("calc(2 * 10px)");
        out.add("calc(100px / 2)");

    }


    /*
       min / max
    */

    if(hasLength || hasPercentage){

        out.add("min(100px,50%)");
        out.add("max(100px,50%)");

    }

    if(hasNumber){

        out.add("min(1,2)");
        out.add("max(1,2)");

    }


    /*
       clamp
    */

    if(hasLength || hasPercentage){

        out.add(
            "clamp(10px,50%,300px)"
        );

    }

    if(hasNumber){

        out.add(
            "clamp(0,50%,100)"
        );

    }


    /*
       fit-content
    */

    if(hasLength || hasPercentage){

        out.add(
            "fit-content(100px)"
        );

        out.add(
            "fit-content(50%)"
        );

    }


    /*
       calc-size
    */

    if(hasLength || hasPercentage){

        out.add(
            "calc-size(auto,size)"
        );

        out.add(
            "calc-size(min-content,size)"
        );

        out.add(
            "calc-size(max-content,size)"
        );

        out.add(
            "calc-size(auto,size + 10px)"
        );

    }


    /*
       Color functions.
    */

    if(hasColor){

        out.add("rgb(0 0 0)");
        out.add("rgb(255 0 0)");
        out.add("rgba(0,0,0,.5)");
        out.add("hsl(0 100% 50%)");
        out.add("hwb(0 0% 0%)");
        out.add("lab(50% 0 0)");
        out.add("oklab(50% 0 0)");

    }


    /*
       Angle functions.
    */

    if(hasAngle){

        out.add("calc(45deg + 10deg)");

    }


    /*
       Time functions.
    */

    if(hasTime){

        out.add("calc(1s + 100ms)");

    }


    /*
       Functions actually found inside
       all-css.json.

       If the JSON contains calc(), min(),
       color(), etc. we retain the name.
    */

    for(const name of functionsFromJSON){

        /*
           Do not generate random functions
           with no meaningful argument.
        */

        if(
            name === "calc" &&
            (hasLength || hasPercentage || hasNumber)
        )
            out.add("calc(1px + 1px)");

        else if(
            name === "min" &&
            (hasLength || hasPercentage || hasNumber)
        )
            out.add("min(100px,50%)");

        else if(
            name === "max" &&
            (hasLength || hasPercentage || hasNumber)
        )
            out.add("max(100px,50%)");

        else if(
            name === "clamp" &&
            (hasLength || hasPercentage || hasNumber)
        )
            out.add("clamp(10px,50%,300px)");

        else if(
            name === "fit-content" &&
            (hasLength || hasPercentage)
        )
            out.add("fit-content(100px)");

        else if(
            name === "calc-size" &&
            (hasLength || hasPercentage)
        )
            out.add("calc-size(auto,size)");

        /*
           Color function names from JSON.
        */

        else if(
            hasColor &&
            [
                "rgb",
                "rgba",
                "hsl",
                "hsla",
                "hwb",
                "lab",
                "lch",
                "oklab",
                "oklch",
                "color"
            ].includes(name)
        ){

            out.add(
                makeColorFunction(name)
            );

        }

    }

    return out;
}


/* =========================================================
   COLOR FUNCTION BUILDER
========================================================= */

function makeColorFunction(name){

    switch(name){

        case "rgb":
            return "rgb(255 0 0)";

        case "rgba":
            return "rgba(255,0,0,.5)";

        case "hsl":
            return "hsl(0 100% 50%)";

        case "hsla":
            return "hsla(0,100%,50%,.5)";

        case "hwb":
            return "hwb(0 0% 0%)";

        case "lab":
            return "lab(50% 0 0)";

        case "lch":
            return "lch(50% 0 0)";

        case "oklab":
            return "oklab(50% 0 0)";

        case "oklch":
            return "oklch(50% 0 0)";

        case "color":
            return "color(srgb 1 0 0)";

        default:
            return name + "(0)";

    }

}


/* =========================================================
   PROPERTY FUNCTION CANDIDATES
========================================================= */

function functionCandidates(property){

    const syntax =
        getSyntax(property);

    const types =
        getTypes(syntax);

    return functionValuesForTypes(types);
}


/* =========================================================
   BUILD PROPERTY CANDIDATES
========================================================= */

function buildCandidates(property){

    const groups = {

        static:new Set(),
        numeric:new Set(),
        function:new Set()

    };


    /*
       STATIC
    */

    for(
        const value of
        staticCandidates(property)
    ){

        groups.static.add(value);

    }


    /*
       NUMERIC
    */

    for(
        const value of
        numericCandidates(property)
    ){

        groups.numeric.add(value);

    }


    /*
       FUNCTIONS
    */

    for(
        const value of
        functionCandidates(property)
    ){

        groups.function.add(value);

    }


    /*
       Remove duplicates between groups.
       Function has priority over numeric,
       numeric over static.
    */

    for(const value of groups.function)
        groups.numeric.delete(value);

    for(const value of groups.function)
        groups.static.delete(value);

    for(const value of groups.numeric)
        groups.static.delete(value);


    return groups;
}


/* =========================================================
   CSS SUPPORTS
========================================================= */

function supports(property,value){

    try{

        return CSS.supports(
            property,
            value
        );

    }
    catch{

        return false;

    }
}
  /* =========================================================
   PART 5
   TEST ENGINE
========================================================= */


/* =========================================================
   SNAPSHOT
========================================================= */

function snapshot(property){

    const r =
        target.getBoundingClientRect();

    const c =
        getComputedStyle(target);

    return {

        width:r.width,
        height:r.height,
        left:r.left,
        top:r.top,

        computed:
            c.getPropertyValue(property).trim(),

        display:c.display,
        position:c.position,
        opacity:c.opacity,
        visibility:c.visibility

    };
}


/* =========================================================
   APPLY + TEST
========================================================= */

function testValue(property,value,kind){

    resetTarget();

    const before =
        snapshot(property);


    /*
       CSS.supports is the first filter.
    */

    let supported = false;

    try{

        supported =
            CSS.supports(
                property,
                value
            );

    }
    catch{

        supported = false;

    }


    if(!supported){

        return {

            property,
            value,
            kind,
            supported:false,
            applied:false,
            changed:false,
            computed:""

        };

    }


    /*
       Apply.
    */

    let applied = false;

    try{

        target.style.setProperty(
            property,
            value
        );

        /*
           Verify that browser actually
           accepted the declaration.
        */

        applied =
            target.style.getPropertyValue(
                property
            ).trim() !== "";

    }
    catch{

        applied = false;

    }


    if(!applied){

        return {

            property,
            value,
            kind,
            supported:true,
            applied:false,
            changed:false,
            computed:""

        };

    }


    const after =
        snapshot(property);


    /*
       Geometry change.
    */

    const geometryChanged =
        Math.abs(
            after.width-before.width
        ) > .01 ||

        Math.abs(
            after.height-before.height
        ) > .01 ||

        Math.abs(
            after.left-before.left
        ) > .01 ||

        Math.abs(
            after.top-before.top
        ) > .01;


    /*
       Computed change.
    */

    const computedChanged =
        before.computed !==
        after.computed;


    const changed =
        geometryChanged ||
        computedChanged;


    return {

        property,
        value,
        kind,

        supported:true,
        applied:true,

        changed,

        geometryChanged,
        computedChanged,

        computed:
            after.computed,

        before,
        after

    };
}


/* =========================================================
   SHOW RESULT
========================================================= */

function showResult(r){

    if(!r.supported)
        return;

    const div =
        document.createElement("div");

    div.className =
        "result " +
        (
            r.kind === "function"
                ? "function"
                : r.kind === "numeric"
                    ? "numeric"
                    : "static"
        );

    div.innerHTML = `

        <b>${esc(r.property)}</b>

        <div>
            Value:
            <b>${esc(r.value)}</b>
        </div>

        <div>
            Type:
            ${esc(r.kind)}
        </div>

        <div>
            CSS.supports:
            <b>true</b>
        </div>

        <div>
            Changed:
            <b>${r.changed}</b>
        </div>

        <div class="small">
            Computed:
            ${esc(r.computed || "-")}
        </div>

    `;

    resultsBox.appendChild(div);
}


/* =========================================================
   TEST ONE GROUP
========================================================= */

async function testGroup(
    property,
    values,
    kind
){

    for(const value of values){

        if(stopRequested)
            return;

        /*
           CSS.supports before touching DOM.
        */

        if(!supports(property,value))
            continue;


        const result =
            testValue(
                property,
                value,
                kind
            );


        results.push(result);


        if(result.supported){

            successful.push(result);

            showResult(result);

        }


        updateStats();


        /*
           Critical for Android.
           Yield frequently.
        */

        if(results.length % 20 === 0){

            await new Promise(
                resolve =>
                    setTimeout(resolve,0)
            );

        }

    }
}


/* =========================================================
   SAVE PROPERTY RESULT
========================================================= */

function propertySummary(property){

    return {

        property,

        syntax:
            getSyntax(property),

        values:
            successful
                .filter(
                    x =>
                        x.property === property
                )
                .map(x=>({

                    value:x.value,

                    type:x.kind,

                    computed:x.computed,

                    changed:x.changed

                }))

    };
}


/* =========================================================
   START ENGINE
========================================================= */

async function startEngine(){

    if(running)
        return;

    if(!cssData){

        status(
            "Load all-css.json first."
        );

        return;

    }

    if(!properties.length){

        status(
            "No properties."
        );

        return;

    }


    running = true;
    stopRequested = false;

    startButton.disabled = true;
    stopButton.disabled = false;

    exportSuccessButton.disabled = true;
    exportAllButton.disabled = true;

    results = [];
    successful = [];

    resultsBox.innerHTML = "";

    updateStats();


    try{

        for(
            let i=0;
            i<properties.length;
            i++
        ){

            if(stopRequested)
                break;


            const property =
                properties[i];

            showProperty(property);


            const percent =
                ((i / properties.length) * 100)
                    .toFixed(1);

            progressBar.style.width =
                percent + "%";


            status(
                "Testing property " +
                (i+1) +
                " / " +
                properties.length +
                "\n" +
                property
            );


            const groups =
                buildCandidates(property);


            console.log(
                "PROPERTY:",
                property
            );

            console.log(
                "STATIC:",
                groups.static.size,
                "NUMERIC:",
                groups.numeric.size,
                "FUNCTION:",
                groups.function.size
            );


            /*
               Static first.
            */

            await testGroup(
                property,
                groups.static,
                "static"
            );


            /*
               Numeric second.
            */

            await testGroup(
                property,
                groups.numeric,
                "numeric"
            );


            /*
               Functions third.
            */

            await testGroup(
                property,
                groups.function,
                "function"
            );


            /*
               Allow Android UI to breathe
               after EVERY property.
            */

            await new Promise(
                resolve =>
                    setTimeout(resolve,0)
            );

        }


        progressBar.style.width =
            "100%";


        if(stopRequested){

            status(
                "STOPPED\n" +
                "Properties reached: " +
                results.length
            );

        }
        else{

            status(
                "FINISHED ✓\n" +
                "Properties: " +
                properties.length +
                "\nSupported: " +
                successful.length
            );

        }

    }
    catch(error){

        console.error(error);

        status(
            "ENGINE ERROR: " +
            error.message
        );

    }
    finally{

        running = false;

        startButton.disabled = false;
        stopButton.disabled = true;

        exportSuccessButton.disabled =
            successful.length === 0;

        exportAllButton.disabled =
            results.length === 0;

        updateStats();

    }

}


/* =========================================================
   STOP
========================================================= */

stopButton.addEventListener("click",()=>{

    stopRequested = true;

    status("Stopping after current test...");

});


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
    "click",
    startEngine
);
  /* =========================================================
   PART 6
   EXPORT + INITIALIZE
========================================================= */


/* =========================================================
   DOWNLOAD JSON
========================================================= */

function downloadJSON(filename,data){

    const json =
        JSON.stringify(
            data,
            null,
            2
        );

    const blob =
        new Blob(
            [json],
            {
                type:"application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        ()=>URL.revokeObjectURL(url),
        1000
    );
}


/* =========================================================
   EXPORT SUCCESSFUL VALUES
========================================================= */

exportSuccessButton.addEventListener(
    "click",
    ()=>{

        const output = {

            generatedAt:
                new Date().toISOString(),

            propertyCount:
                properties.length,

            successfulCount:
                successful.length,

            properties:
                properties.map(
                    property =>
                        propertySummary(property)
                )

        };


        downloadJSON(
            "css-successful-values.json",
            output
        );

    }
);


/* =========================================================
   EXPORT ALL RESULTS
========================================================= */

exportAllButton.addEventListener(
    "click",
    ()=>{

        const output = {

            generatedAt:
                new Date().toISOString(),

            propertyCount:
                properties.length,

            testCount:
                results.length,

            supportedCount:
                successful.length,

            results

        };


        downloadJSON(
            "css-all-test-results.json",
            output
        );

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

resetTarget();

stopButton.disabled = true;

exportSuccessButton.disabled = true;
exportAllButton.disabled = true;

status(
    "Ready. Choose all-css.json."
);

console.log(
    "================================"
);

console.log(
    "CSS PROPERTY TEST ENGINE"
);

console.log(
    "READY"
);

console.log(
    "================================"
);

</script>
