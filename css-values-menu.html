<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Property Tester</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, sans-serif;
    background: #050505;
    color: #fff;
}

#app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   TOP 50%
========================================================= */

#cssPanel {
    width: 100%;
    height: 50%;
    min-height: 0;

    display: flex;
    flex-direction: column;

    background: #080808;
    border-bottom: 2px solid #222;
}


/* =========================================================
   HEADER
========================================================= */

#header {
    height: 55px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    background: #0d0d0d;
    border-bottom: 1px solid #222;
}

#header h1 {
    font-size: 18px;
    color: #ff5e00;
}

#search {
    width: 220px;
    height: 34px;

    padding: 0 12px;

    background: #111;
    color: white;

    border: 1px solid #333;
    border-radius: 6px;

    outline: none;
}

#search:focus {
    border-color: #ff5e00;
}


/* =========================================================
   CATEGORIES
========================================================= */

#categories {
    flex: 1;
    min-height: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 10px;
}


/* =========================================================
   CATEGORY
========================================================= */

.category {
    margin-bottom: 8px;

    background: #0d0d0d;

    border: 1px solid #222;
    border-radius: 7px;

    overflow: hidden;
}

.category-title {
    width: 100%;
    min-height: 42px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 13px;

    cursor: pointer;

    background: #111;
    color: #fff;

    font-size: 14px;
    font-weight: bold;
}

.category-title:hover {
    background: #181818;
}

.category-title .arrow {
    color: #777;
    transition: transform .2s;
  
    
}

.category.open .category-title .arrow {
    transform: rotate(90deg);
}

.category-content {
    display: none;

    padding: 10px;

    background: #090909;

    border-top: 1px solid #222;
}

.category.open .category-content {
    display: block;
}


/* =========================================================
   GROUP HEADING
========================================================= */

.group-heading {
    width: 100%;
    min-height: 40px;
    margin: 10px 0 7px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0b0b0b;
    border: 1px solid #292929;
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
}

.group-heading:hover {
    background: #151515;
}

.group-heading .group-arrow {
    color: #fff;
    transition: transform .2s;
}

.group-heading.open .group-arrow {
    transform: rotate(90deg);
}

.group-content {
    display: none;
    padding: 0 0 4px;
}

.group-content.open {
    display: block;
}

/* =========================================================
   PROPERTY
========================================================= */

.property {
    margin-bottom: 8px;

    padding: 10px;

    background: #101010;

    border: 1px solid #222;
    border-radius: 6px;
}

.property-name {
    font-size: 13px;
    font-weight: bold;

    color: #ff8a4c;

    margin-bottom: 5px;
}

.property-description {
    font-size: 11px;
    line-height: 1.5;

    color: #888;

    margin-bottom: 8px;
}


/* =========================================================
   CONTROLS
========================================================= */

.property-control {
    width: 100%;
}


/* =========================================================
   SELECT
========================================================= */

.property-control select {
    width: 100%;
    height: 34px;

    padding: 0 8px;

    background: #080808;
    color: white;

    border: 1px solid #333;
    border-radius: 5px;

    outline: none;
}


/* =========================================================
   NUMERIC CONTROL
========================================================= */

.numeric-control {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 7px;
}

.numeric-control input[type="range"] {
    flex: 1;

    width: 100%;
    height: 6px;

    accent-color: #ff5e00;

    cursor: pointer;
}

.numeric-control input[type="number"] {
    width: 75px;
    height: 32px;

    padding: 0 7px;

    background: #080808;
    color: white;

    border: 1px solid #333;
    border-radius: 5px;

    outline: none;

    text-align: center;
}

.numeric-control select {
    width: 75px;
    height: 32px;

    padding: 0 5px;

    background: #080808;
    color: white;

    border: 1px solid #333;
    border-radius: 5px;

    outline: none;
}


/* =========================================================
   FUNCTION CONTROL
========================================================= */

.function-select {
    width: 100%;
    height: 34px;

    margin-top: 7px;

    padding: 0 8px;

    background: #080808;
    color: white;

    border: 1px solid #333;
    border-radius: 5px;

    outline: none;
}

.function-select:focus {
    border-color: #ff5e00;
}

.function-builder {
    margin-top: 8px;

    padding: 8px;

    background: #0b0b0b;

    border: 1px solid #292929;
    border-radius: 6px;
}

.function-value {
    width: 100%;

    margin-bottom: 7px;
}

.function-row {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 7px;
}

.function-row input[type="range"] {
    flex: 1;

    width: 100%;
    height: 6px;

    accent-color: #ff5e00;

    cursor: pointer;
}

.function-row input[type="number"] {
    width: 75px;
    height: 32px;

    padding: 0 7px;

    background: #080808;
    color: white;

    border: 1px solid #333;
    border-radius: 5px;

    outline: none;

    text-align: center;
}

.function-row select {
    width: 75px;
    height: 32px;

    padding: 0 5px;

    background: #080808;
    color: white;

    border: 1px solid #333;
    border-radius: 5px;

    outline: none;
}

.function-row select:focus,
.function-row input:focus {
    border-color: #ff5e00;
}


/* OPERATOR */

.function-operator {
    width: 55px !important;
    flex-shrink: 0;
}


/* REMOVE */

.remove-function-value {
    width: 32px;
    height: 32px;

    flex-shrink: 0;

    background: #151515;
    color: #aaa;

    border: 1px solid #333;
    border-radius: 5px;

    cursor: pointer;

    font-size: 16px;
}

.remove-function-value:hover {
    color: white;
    border-color: #ff5e00;
}


/* ADD */

.add-function-value {
    width: 100%;
    height: 31px;

    margin-top: 2px;

    background: #151515;
    color: #aaa;

    border: 1px dashed #444;
    border-radius: 5px;

    cursor: pointer;
}

.add-function-value:hover {
    color: white;
    border-color: #ff5e00;
}


/* FUNCTION RESULT */

.function-result {
    margin-top: 8px;

    padding: 7px 8px;

    background: #050505;

    border: 1px solid #292929;
    border-radius: 5px;

    color: #ff8a4c;

    font-family: monospace;
    font-size: 11px;

    word-break: break-all;
}


/* =========================================================
   TEXT CONTROL
========================================================= */

.text-control {
    width: 100%;
    height: 34px;

    padding: 0 8px;

    background: #080808;
    color: white;

    border: 1px solid #333;
    border-radius: 5px;

    outline: none;
}

.text-control:focus {
    border-color: #ff5e00;
}


/* =========================================================
   BOTTOM 50%
========================================================= */

#previewPanel {
    width: 100%;
    height: 50%;
    min-height: 0;

    display: flex;
    flex-direction: column;

    background: #050505;
    
}


/* =========================================================
   PREVIEW HEADER
========================================================= */

#previewHeader {
    height: 50px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    background: #0d0d0d;
    border-bottom: 1px solid #222;
}

#previewHeader strong {
    color: #ff5e00;
}

#resetButton {
    height: 30px;

    padding: 0 12px;

    background: #151515;
    color: #aaa;

    border: 1px solid #333;
    border-radius: 5px;

    cursor: pointer;
}

#resetButton:hover {
    color: white;
    border-color: #ff5e00;
}


/* =========================================================
   PREVIEW
========================================================= */

#preview {
    flex: 1;
    min-height: 0;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        linear-gradient(#151515 1px, transparent 1px),
        linear-gradient(90deg, #151515 1px, transparent 1px);

    background-size: 20px 20px;
  
}


/* =========================================================
   TEST AREA
========================================================= */

#testArea {
    position: relative;
    width: 90%;
    height: 80%;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   TEST DIV
========================================================= */

#testDiv {
    width: 150px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    
    background: #ff5e00;
    color: white;
    border-radius: 8px;
    font-weight: bold;
    position: relative;
    
  
    transition: all .15s ease;
}


/* =========================================================
   AXIS
========================================================= */

.axis-x,
.axis-y {
    position: absolute;
    background: #333;
}

.axis-x {
    width: 100%;
    height: 1px;

    top: 50%;
    left: 0;
}

.axis-y {
    width: 1px;
    height: 100%;

    left: 50%;
    top: 0;
}


/* =========================================================
   CURRENT PROPERTY
========================================================= */

#currentProperty {
    position: absolute;

    left: 10px;
    bottom: 10px;

    max-width: calc(100% - 20px);

    padding: 6px 9px;

    background: #111;

    border: 1px solid #333;
    border-radius: 5px;

    color: #aaa;

    font-size: 11px;

    font-family: monospace;
}


/* =========================================================
   ERROR
========================================================= */

#error {
    display: none;

    padding: 15px;

    background: #200;

    color: #ff7777;

    border: 1px solid #500;

    border-radius: 6px;

    margin: 10px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    #header h1 {
        font-size: 15px;
    }

    #search {
        width: 150px;
    }

    .category-title {
        font-size: 13px;
    }

    .numeric-control input[type="number"] {
        width: 65px;
    }

    .numeric-control select {
        width: 65px;
    }

    .function-row input[type="number"] {
        width: 60px;
    }

    .function-row select {
        width: 60px;
    }

    .function-operator {
        width: 48px !important;
    }
}

</style>

</head>

<body>

<div id="app">


<!-- =====================================================
     TOP 50%
====================================================== -->

<section id="cssPanel">

        </h1>

        </button>

    <div id="preview">

        <div id="testArea">

            <div class="axis-x"></div>
            <div class="axis-y"></div>

            <div id="testDiv">
                TEST DIV
            </div>

        </div>

        <div id="currentProperty">
            No property selected
        </div>

    </div>

</section>


</div>

        "position-try-order":
            "Controls the order of position fallback options.",

        offset:
            "Defines the motion path, distance, rotation and anchor in one shorthand property.",

        "offset-position":
            "Defines the starting position of an element before motion along an offset path.",

        "offset-path":
            "Defines the path along which the element moves.",

        "offset-distance":
            "Defines how far the element is positioned along the offset path.",

        "offset-rotate":
            "Defines the rotation of the element while moving along the offset path.",

        "offset-anchor":
            "Defines the point inside the element that is attached to the offset path."
    };

    return descriptions[property] || "";
}


/* =========================================================
   RENDER CATEGORIES
========================================================= */

function renderCategories(data) {

    categories.innerHTML = "";

    const categoryElement =
        document.createElement("div");

    categoryElement.className =
        "category";


    categoryElement.innerHTML = `

        <div class="category-title">

            <span>
                ${data.category}
            </span>

            <span class="arrow">
                ›
            </span>

        </div>

        <div class="category-content"></div>
    `;


    const title =
        categoryElement.querySelector(
            ".category-title"
        );

    const content =
        categoryElement.querySelector(
            ".category-content"
        );


    title.addEventListener(
        "click",
        () => {

            categoryElement.classList.toggle(
                "open"
            );
        }
    );


    /* POSITION */

    if (data.groups.position) {

        content.appendChild(

            createProperty({

                name: "position",

                type: "select",

                values:
                    data.groups.position.values,

                description:
                    getDescription("position")
            })
        );
    }


    /* INSETS */

    if (
        data.groups.insets &&
        data.groups.insets.properties
    ) {

        Object.entries(
            data.groups.insets.properties
        ).forEach(
            ([name, config]) => {

                content.appendChild(

                    createProperty({

                        name: name,

                        type:
                            config.type,

                        valueSet:
                            config.valueSet,

                        description:
                            getDescription(name)
                    })
                );
            }
        );
    }


    /* Z-INDEX */

    if (data.groups["z-index"]) {

        const z =
            data.groups["z-index"];

        content.appendChild(

            createProperty({

                name: "z-index",

                type: "range",

                min: z.min,

                max: z.max,

                step: z.step,

                defaultValue:
                    z.default,

                extraValues:
                    z.extraValues,

                description:
                    getDescription("z-index")
            })
        );
    }


    /* ANCHOR POSITIONING */

    if (
        data.groups["anchor-positioning"] &&
        data.groups["anchor-positioning"].properties
    ) {

        const heading = document.createElement("div");
        heading.className = "group-heading";
        heading.textContent = "Anchor Positioning";
        content.appendChild(heading);

        Object.entries(
            data.groups["anchor-positioning"].properties
        ).forEach(
            ([name, config]) => {

                content.appendChild(

                    createProperty({

                        name: name,

                        type:
                            config.type,

                        valueSet:
                            config.valueSet,

                        description:
                            getDescription(name)
                    })
                );
            }
        );
    }


    /* =========================================================
       OFFSET MOTION
    ========================================================= */

    if (
        data.groups["offset-motion"] &&
        data.groups["offset-motion"].properties
    ) {

        const heading = document.createElement("div");
        heading.className = "group-heading";
        heading.innerHTML = `
            <span>Offset Motion</span>
            <span class="group-arrow">›</span>
        `;

        const groupContent = document.createElement("div");
        groupContent.className = "group-content";

        heading.addEventListener("click", () => {
            heading.classList.toggle("open");
            groupContent.classList.toggle("open");
        });

        Object.entries(
            data.groups["offset-motion"].properties
        ).forEach(
            ([name, config]) => {
                groupContent.appendChild(
                    createProperty({
                        name: name,
                        type: config.type,
                        valueSet: config.valueSet,
                        description: getDescription(name)
                    })
                );
            }
        );

        content.appendChild(heading);
        content.appendChild(groupContent);
    }

    categories.appendChild(
        categoryElement
    );
}


/* =========================================================
   CREATE PROPERTY
========================================================= */

function createProperty(property) {

    const element =
        document.createElement("div");

    element.className =
        "property";


    const name =
        document.createElement("div");

    name.className =
        "property-name";

    name.textContent =
        property.name;


    const description =
        document.createElement("div");

    description.className =
        "property-description";

    description.textContent =
        property.description || "";


    const control =
        document.createElement("div");

    control.className =
        "property-control";


    /* SELECT */

    if (property.type === "select") {

        const select =
            document.createElement("select");


        property.values.forEach(
            value => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    value;

                option.textContent =
                    value;

                select.appendChild(
                    option
                );
            }
        );


        select.addEventListener(
            "change",
            () => {

                applyProperty(
                    property.name,
                    select.value
                );
            }
        );


        control.appendChild(select);
    }


    /* VALUE CONTROL */

    else if (
        property.type === "value-control"
    ) {

        control.appendChild(

            createValueControl(
                property.name,
                property.valueSet
            )
        );
    }


    /* RANGE */

    else if (
        property.type === "range"
    ) {

        control.appendChild(

            createNumericControl({

                property:
                    property.name,

                min:
                    property.min,

                max:
                    property.max,

                step:
                    property.step,

                defaultValue:
                    property.defaultValue,

                units: [""],

                extraValues:
                    property.extraValues || []
            })
        );
    }


    /* TEXT */

    else {

        const input =
            document.createElement("input");

        input.type =
            "text";

        input.className =
            "text-control";

        input.placeholder =
            "Enter value...";


        input.addEventListener(
            "input",
            () => {

                applyProperty(
                    property.name,
                    input.value
                );
            }
        );


        control.appendChild(input);
    }


    element.appendChild(name);
    element.appendChild(description);
    element.appendChild(control);


    return element;
}


/* =========================================================
   VALUE CONTROL
========================================================= */

function createValueControl(
    property,
    valueSetName
) {

    const wrapper =
        document.createElement("div");


    const valueSet =
        cssData.valueSets[
            valueSetName
        ];


    /* =====================================================
       OFFSET-ROTATE
       Always provide a real angle range. Keywords are separate.
    ===================================================== */

    if (property === "offset-rotate" && valueSet && valueSet.angleRange) {

        const angle = valueSet.angleRange;

        wrapper.appendChild(
            createNumericControl({
                property: property,
                min: angle.min,
                max: angle.max,
                step: angle.step,
                defaultValue: angle.default,
                units: valueSet.units || ["deg", "grad", "rad", "turn"],
                angle: true
            })
        );

        const keywordSelect = document.createElement("select");
        keywordSelect.className = "property-control";

        const normal = document.createElement("option");
        normal.value = "__angle__";
        normal.textContent = "Angle (range)";
        normal.selected = true;
        keywordSelect.appendChild(normal);

        (valueSet.values || []).filter(v => v === "auto" || v === "reverse" || /^(inherit|initial|revert|revert-layer|unset)$/.test(v)).forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            keywordSelect.appendChild(option);
        });

        keywordSelect.addEventListener("change", () => {
            if (keywordSelect.value !== "__angle__") {
                applyProperty(property, keywordSelect.value);
            }
        });

        wrapper.appendChild(keywordSelect);
        return wrapper;
    }


    /* =====================================================
       ANGLE VALUE SET
    ===================================================== */

    if (valueSet && valueSet.type === "angle" && valueSet.angleRange) {
        const select = document.createElement("select");
        select.className = "property-control";

        valueSet.values.forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            select.appendChild(option);
        });

        select.addEventListener("change", () => {
            applyProperty(property, select.value);
        });

        wrapper.appendChild(select);

        const angle = valueSet.angleRange;
        wrapper.appendChild(createNumericControl({
            property: property,
            min: angle.min,
            max: angle.max,
            step: angle.step,
            defaultValue: angle.default,
            units: valueSet.units || ["deg", "grad", "rad", "turn"],
            extraValues: [],
            angle: true
        }));

        return wrapper;
    }


    /* =====================================================
       KEYWORD VALUE SET
    ===================================================== */

    if (
        valueSet &&
        valueSet.type === "keyword"
    ) {

        const select =
            document.createElement("select");

        select.className =
            "property-control";


        valueSet.values.forEach(
            value => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    value;

                option.textContent =
                    value;

                select.appendChild(
                    option
                );
            }
        );


        select.addEventListener(
            "change",
            () => {

                applyProperty(
                    property,
                    select.value
                );
            }
        );


        wrapper.appendChild(
            select
        );

        return wrapper;
    }


    /* =====================================================
       OFFSET-POSITION
       Keywords are standalone. Numeric position is available only
       after explicitly choosing Custom length / %.
    ===================================================== */

    if (property === "offset-position" && valueSet) {
        const select = document.createElement("select");
        select.className = "property-control";

        const choose = document.createElement("option");
        choose.value = "";
        choose.textContent = "Choose value";
        choose.selected = true;
        select.appendChild(choose);

        (valueSet.values || []).forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            select.appendChild(option);
        });

        const numericWrap = document.createElement("div");
        numericWrap.style.display = "none";
        numericWrap.style.marginTop = "7px";

        const custom = document.createElement("option");
        custom.value = "__custom__";
        custom.textContent = "Custom length / %";
        select.appendChild(custom);

        numericWrap.appendChild(createNumericControl({
            property: property,
            min: -1000,
            max: 1000,
            step: 1,
            defaultValue: 0,
            units: valueSet.units || POSITION_UNITS,
            extraValues: []
        }));

        select.addEventListener("change", () => {
            if (select.value === "__custom__") {
                numericWrap.style.display = "block";
                return;
            }
            numericWrap.style.display = "none";
            if (select.value) applyProperty(property, select.value);
        });

        wrapper.appendChild(select);
        wrapper.appendChild(numericWrap);
        return wrapper;
    }


    /* =====================================================
       MIXED VALUE SET
       Keywords are standalone. A length/% value is optional.
    ===================================================== */

    if (valueSet && valueSet.type === "mixed" && Array.isArray(valueSet.values) && property !== "offset-path") {
        const select = document.createElement("select");
        select.className = "property-control";

        const choose = document.createElement("option");
        choose.value = "";
        choose.textContent = "Choose value";
        select.appendChild(choose);

        valueSet.values.forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            select.appendChild(option);
        });

        const hasUnits = Array.isArray(valueSet.units) && valueSet.units.length > 0;
        const numericWrap = document.createElement("div");
        numericWrap.style.display = "none";
        numericWrap.style.marginTop = "7px";

        if (hasUnits) {
            const custom = document.createElement("option");
            custom.value = "__custom__";
            custom.textContent = "Custom length / %";
            select.appendChild(custom);

            numericWrap.appendChild(createNumericControl({
                property: property, min: -1000, max: 1000, step: 1,
                defaultValue: 0, units: valueSet.units, extraValues: []
            }));
        }

        select.addEventListener("change", () => {
            if (select.value === "__custom__") {
                numericWrap.style.display = "block";
                return;
            }
            numericWrap.style.display = "none";
            if (select.value) applyProperty(property, select.value);
        });

        wrapper.appendChild(select);
        wrapper.appendChild(numericWrap);

        if (property !== "offset-path") return wrapper;
    }


    /* =====================================================
       FUNCTION LIST VALUE SET (e.g. offset-path)
    ===================================================== */

    if (
        valueSet &&
        Array.isArray(valueSet.functions)
    ) {
        const functionSelect = document.createElement("select");
        functionSelect.className = "property-control";

        const normalOption = document.createElement("option");
        normalOption.value = "none";
        normalOption.textContent = "Choose function";
        functionSelect.appendChild(normalOption);

        valueSet.functions.forEach(fn => {
            const option = document.createElement("option");
            option.value = fn;
            option.textContent = fn;
            functionSelect.appendChild(option);
        });

        const functionInput = document.createElement("input");
        functionInput.type = "text";
        functionInput.className = "text-control";
        functionInput.style.marginTop = "7px";
        functionInput.placeholder = "Enter function value...";
        functionInput.style.display = "none";

        const updateFunction = () => {
            if (!functionSelect.value || functionSelect.value === "none") return;
            const raw = functionInput.value.trim();
            if (!raw) return;
            applyProperty(
                property,
                functionSelect.value.replace(/\(\)$/, "") + "(" + raw + ")"
            );
        };

        functionSelect.addEventListener("change", () => {
            if (functionSelect.value === "none") {
                functionInput.style.display = "none";
                return;
            }
            functionInput.style.display = "block";
            functionInput.value = "";
            functionInput.focus();
        });

        functionInput.addEventListener("input", updateFunction);

        wrapper.appendChild(functionSelect);
        wrapper.appendChild(functionInput);
        return wrapper;
    }


    /* =====================================================
       NUMERIC VALUE
       offset-path is not numeric; it is handled by its function
       builder below.
    ===================================================== */

    const range =
        valueSet &&
        valueSet.range
        ? valueSet.range
        : {
            min: -1000,
            max: 1000,
            step: 1,
            default: 0
        };


    const units =
        valueSet &&
        valueSet.units
        ? valueSet.units
        : POSITION_UNITS;


    if (property !== "offset-path") {
        wrapper.appendChild(

            createNumericControl({

                property:
                    property,

                min:
                    range.min,

                max:
                    range.max,

                step:
                    range.step,

                defaultValue:
                    range.default,

                units:
                    units,

                extraValues:
                    valueSet &&
                    valueSet.specialValues
                    ? valueSet.specialValues
                    : []
            })
        );
    }


    /* =====================================================
       FUNCTION SELECT
    ===================================================== */

    if (
        valueSet &&
        valueSet.functions
    ) {

        const functionSelect =
            document.createElement("select");

        functionSelect.className =
            "function-select";


        const normalOption =
            document.createElement("option");

        normalOption.value =
            "normal";

        normalOption.textContent =
            "Normal value";

        functionSelect.appendChild(
            normalOption
        );


        Object.keys(
            valueSet.functions
        ).forEach(
            functionName => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    functionName;

                option.textContent =
                    functionName + "()";

                functionSelect.appendChild(
                    option
                );
            }
        );


        wrapper.appendChild(
            functionSelect
        );


        const functionBuilder =
            document.createElement("div");

        functionBuilder.className =
            "function-builder";

        functionBuilder.style.display =
            "none";


        wrapper.appendChild(
            functionBuilder
        );


        functionSelect.addEventListener(
            "change",
            () => {

                if (
                    functionSelect.value ===
                    "normal"
                ) {

                    functionBuilder.style.display =
                        "none";

                    return;
                }


                functionBuilder.style.display =
                    "block";

                const functionConfig =
                    valueSet.functions[functionSelect.value];

                functionBuilder.innerHTML = "";

                if (
                    functionConfig &&
                    functionConfig.type === "text"
                ) {
                    const input = document.createElement("input");
                    input.type = "text";
                    input.className = "text-control";
                    input.placeholder = functionConfig.placeholder || "Enter function arguments...";

                    const update = () => {
                        const raw = input.value.trim();
                        if (raw) {
                            applyProperty(
                                property,
                                functionSelect.value + "(" + raw.replace(/^\w+\(/, "").replace(/\)$/, "") + ")"
                            );
                        }
                    };

                    input.addEventListener("input", update);
                    functionBuilder.appendChild(input);
                } else {
                    buildFunction(
                        functionBuilder,
                        functionSelect.value,
                        property,
                        units,
                        range
                    );
                }
            }
        );
    }


    return wrapper;
}


/* =========================================================
   NUMERIC CONTROL
========================================================= */

function createNumericControl(options) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "numeric-control";


    const range =
        document.createElement("input");

    range.type =
        "range";

    range.min =
        options.min;

    range.max =
        options.max;

    range.step =
        options.step;

    range.value =
        options.defaultValue;


    const number =
        document.createElement("input");

    number.type =
        "number";

    number.min =
        options.min;

    number.max =
        options.max;

    number.step =
        options.step;

    number.value =
        options.defaultValue;


    const unitSelect =
        document.createElement("select");


    options.units.forEach(
        unit => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                unit;

            option.textContent =
                unit || "—";

            unitSelect.appendChild(
                option
            );
        }
    );


    function update() {

        let value =
            Number(number.value);


        if (
            Number.isNaN(value)
        ) {

            return;
        }


        const unit =
            unitSelect.value;


        if (
            options.property ===
            "z-index"
        ) {

            applyProperty(
                options.property,
                String(value)
            );

            return;
        }


        if (value === 0) {

            applyProperty(
                options.property,
                options.angle ? ("0" + unit) : "0"
            );

            return;
        }


        applyProperty(
            options.property,
            value + unit
        );
    }


    range.addEventListener(
        "input",
        () => {

            number.value =
                range.value;

            update();
        }
    );


    number.addEventListener(
        "input",
        () => {

            let value =
                Number(number.value);


            if (
                value <
                Number(options.min)
            ) {

                value =
                    Number(options.min);

                number.value =
                    value;
            }


            if (
                value >
                Number(options.max)
            ) {

                value =
                    Number(options.max);

                number.value =
                    value;
            }


            range.value =
                value;

            update();
        }
    );


    unitSelect.addEventListener(
        "change",
        update
    );


    wrapper.appendChild(range);
    wrapper.appendChild(number);
    wrapper.appendChild(unitSelect);


    return wrapper;
}


/* =========================================================
   FUNCTION BUILDER
========================================================= */

function buildFunction(
    container,
    functionName,
    property,
    units,
    rangeOptions
) {

    container.innerHTML = "";


    let values = [];


    if (
        functionName === "clamp"
    ) {

        values = [

            {
                value: 10,
                unit: "px"
            },

            {
                value: 50,
                unit: "%"
            },

            {
                value: 100,
                unit: "px"
            }
        ];
    }

    else {

        values = [

            {
                value: 50,
                unit: "%"
            },

            {
                value: 20,
                unit: "px"
            }
        ];
    }


    values.forEach(
        (item, index) => {

            item.operator =
                index === 0
                ? "-"
                : "+";
        }
    );


    function render() {

        container.innerHTML = "";


        values.forEach(
            (item, index) => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "function-value";


                const controls =
                    document.createElement(
                        "div"
                    );

                controls.className =
                    "function-row";


                /* RANGE */

                const range =
                    document.createElement(
                        "input"
                    );

                range.type =
                    "range";

                range.min =
                    rangeOptions.min;

                range.max =
                    rangeOptions.max;

                range.step =
                    rangeOptions.step;

                range.value =
                    item.value;


                /* NUMBER */

                const number =
                    document.createElement(
                        "input"
                    );

                number.type =
                    "number";

                number.min =
                    rangeOptions.min;

                number.max =
                    rangeOptions.max;

                number.step =
                    rangeOptions.step;

                number.value =
                    item.value;


                /* UNIT */

                const unit =
                    document.createElement(
                        "select"
                    );


                units.forEach(
                    unitName => {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            unitName;

                        option.textContent =
                            unitName;

                        unit.appendChild(
                            option
                        );
                    }
                );


                unit.value =
                    item.unit;


                function updateValue() {

                    item.value =
                        Number(number.value);

                    item.unit =
                        unit.value;

                    updateFunction();
                }


                range.addEventListener(
                    "input",
                    () => {

                        number.value =
                            range.value;

                        updateValue();
                    }
                );


                number.addEventListener(
                    "input",
                    () => {

                        let value =
                            Number(number.value);


                        if (
                            value <
                            rangeOptions.min
                        ) {

                            value =
                                rangeOptions.min;

                            number.value =
                                value;
                        }


                        if (
                            value >
                            rangeOptions.max
                        ) {

                            value =
                                rangeOptions.max;

                            number.value =
                                value;
                        }


                        range.value =
                            value;

                        updateValue();
                    }
                );


                unit.addEventListener(
                    "change",
                    updateValue
                );


                controls.appendChild(
                    range
                );

                controls.appendChild(
                    number
                );

                controls.appendChild(
                    unit
                );


                /* OPERATOR */

                if (
                    functionName === "calc" &&
                    index > 0
                ) {

                    const operator =
                        document.createElement(
                            "select"
                        );

                    operator.className =
                        "function-operator";


                    [
                        "+",
                        "-",
                        "*",
                        "/"
                    ].forEach(
                        op => {

                            const option =
                                document.createElement(
                                    "option"
                                );

                            option.value =
                                op;

                            option.textContent =
                                op;

                            operator.appendChild(
                                option
                            );
                        }
                    );


                    operator.value =
                        item.operator;


                    operator.addEventListener(
                        "change",
                        () => {

                            item.operator =
                                operator.value;

                            updateFunction();
                        }
                    );


                    controls.appendChild(
                        operator
                    );
                }


                /* REMOVE */

                if (
                    functionName !== "clamp" &&
                    values.length > 2
                ) {

                    const remove =
                        document.createElement(
                            "button"
                        );

                    remove.type =
                        "button";

                    remove.className =
                        "remove-function-value";

                    remove.textContent =
                        "×";


                    remove.addEventListener(
                        "click",
                        () => {

                            values.splice(
                                index,
                                1
                            );

                            render();

                            updateFunction();
                        }
                    );


                    controls.appendChild(
                        remove
                    );
                }


                row.appendChild(
                    controls
                );

                container.appendChild(
                    row
                );
            }
        );


        /* ADD VALUE */

        if (
            functionName === "calc" ||
            functionName === "min" ||
            functionName === "max"
        ) {

            const add =
                document.createElement(
                    "button"
                );

            add.type =
                "button";

            add.className =
                "add-function-value";

            add.textContent =
                "+ Add value";


            add.addEventListener(
                "click",
                () => {

                    values.push({

                        value:
                            10,

                        unit:
                            units[0] || "px",

                        operator:
                            "+"
                    });


                    render();

                    updateFunction();
                }
            );


            container.appendChild(
                add
            );
        }


        /* RESULT */

        const result =
            document.createElement(
                "div"
            );

        result.className =
            "function-result";

        container.appendChild(
            result
        );


        updateFunction();
    }


    function updateFunction() {

        let expression =
            "";


        values.forEach(
            (item, index) => {

                const value =
                    item.value === 0
                    ? "0"
                    : `${item.value}${item.unit}`;


                if (
                    functionName === "clamp"
                ) {

                    if (index > 0) {

                        expression +=
                            ", ";
                    }

                    expression +=
                        value;

                    return;
                }


                if (index > 0) {

                    expression +=
                        ` ${item.operator} `;
                }


                expression +=
                    value;
            }
        );


        const finalValue =
            `${functionName}(${expression})`;


        const result =
            container.querySelector(
                ".function-result"
            );


        if (result) {

            result.textContent =
                finalValue;
        }


        applyProperty(
            property,
            finalValue
        );
    }


    render();
}


/* =========================================================
   OFFSET PREVIEW BASELINE
========================================================= */

function ensureOffsetPreviewPath() {
    const computed = getComputedStyle(testDiv);
    if (computed.offsetPath === "none") {
        testDiv.style.setProperty(
            "offset-path",
            'path("M -150 0 C -90 -110 90 110 150 0")'
        );
    }
}

function resetOffsetPreview() {
    testDiv.style.setProperty(
        "offset-path",
        'path("M -150 0 C -90 -110 90 110 150 0")'
    );
    testDiv.style.setProperty("offset-distance", "50%");
    testDiv.style.setProperty("offset-rotate", "0deg");
    testDiv.style.setProperty("offset-anchor", "50% 50%");
}


/* =========================================================
   APPLY PROPERTY
========================================================= */

function applyProperty(
    property,
    value
) {

    if (!value) {
        return;
    }


    /* Offset Motion is previewed on a real motion path.
       The path is only a fallback for the Live Preview; if the user
       explicitly edits offset-path, that value remains authoritative. */
    if (property !== "offset-path" && property.indexOf("offset") === 0) {
        ensureOffsetPreviewPath();
    }

    testDiv.style.setProperty(
        property,
        value
    );

    /* A shorthand can reset the motion path. Keep a visible baseline
       for the other Offset controls so their changes can be observed. */
    if (property === "offset" && getComputedStyle(testDiv).offsetPath === "none") {
        ensureOffsetPreviewPath();
    }

    currentProperty.textContent =
        `${property}: ${value}`;
}


/* =========================================================
   RESET
========================================================= */

resetButton.addEventListener(
    "click",
    () => {

        testDiv.removeAttribute(
            "style"
        );

        resetOffsetPreview();

        currentProperty.textContent =
            "No property selected";


        document
            .querySelectorAll(
                '.numeric-control input[type="range"]'
            )
            .forEach(
                input => {

                    input.value =
                        0;
                }
            );


        document
            .querySelectorAll(
                '.numeric-control input[type="number"]'
            )
            .forEach(
                input => {

                    input.value =
                        0;
                }
            );


        document
            .querySelectorAll(
                ".function-select"
            )
            .forEach(
                select => {

                    select.value =
                        "normal";

                    select.dispatchEvent(
                        new Event("change")
                    );
                }
            );
    }
);


/* =========================================================
   SEARCH
========================================================= */

search.addEventListener(
    "input",
    () => {

        const query =
            search.value
                .toLowerCase()
                .trim();


        document
            .querySelectorAll(
                ".category"
            )
            .forEach(
                category => {

                    const properties =
                        category.querySelectorAll(
                            ".property"
                        );


                    let found =
                        false;


                    properties.forEach(
                        property => {

                            const name =
                                property
                                    .querySelector(
                                        ".property-name"
                                    )
                                    .textContent
                                    .toLowerCase();


                            if (
                                name.includes(query)
                            ) {

                                property.style.display =
                                    "block";

                                found =
                                    true;
                            }

                            else {

                                property.style.display =
                                    "none";
                            }
                        }
                    );


                    if (
                        query &&
                        found
                    ) {

                        category.classList.add(
                            "open"
                        );

                        category.style.display =
                            "block";
                    }

                    else if (
                        query &&
                        !found
                    ) {

                        category.style.display =
                            "none";
                    }

                    else {

                        category.style.display =
                            "block";


                        properties.forEach(
                            property => {

                                property.style.display =
                                    "block";
                            }
                        );
                    }
                }
            );
    }
);


/* =========================================================
   START
========================================================= */

try {

    renderCategories(
        cssData
    );

    resetOffsetPreview();

}

catch (error) {

    console.error(error);

    errorBox.style.display =
        "block";

    errorBox.textContent =
        error.message;
}

</script>
