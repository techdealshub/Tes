<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>CSS Property Tester</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #050505;
    color: #eee;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    max-width: 700px;
    min-height: 100vh;
    margin: auto;

    display: flex;
    flex-direction: column;

    background: #080808;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    flex: 0 0 auto;

    padding: 16px 14px 12px;

    border-bottom: 1px solid #222;

    background:
        linear-gradient(
            180deg,
            #111,
            #090909
        );
  
}

.logo {
    text-align: center;

    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;

    color: #fff;
}

.logo span {
    color: #ff5e00;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box {
    position: relative;

    margin-top: 12px;
  
}

.search-box input {
    width: 100%;

    height: 34px;

    padding: 0 32px 0 32px;

    border: 1px solid #292929;
    border-radius: 12px;

    outline: none;

    background: #101010;
    color: #fff;

    font-size: 12px;

    transition:
        border-color .2s,
        box-shadow .2s;
}

.search-box input:focus {
    border-color: #ff5e00;

    box-shadow:
        0 0 0 2px
        rgba(255, 94, 0, .10);
}

.search-icon {
    position: absolute;

    left: 14px;
    top: 50%;

    transform: translateY(-50%);

    color: #888;

    pointer-events: none;
}

.clear-search {
    position: absolute;

    right: 12px;
    top: 50%;

    transform: translateY(-50%);

    border: 0;
    background: none;

    color: #777;

    font-size: 18px;

    cursor: pointer;

    display: none;
}


/* =========================================================
   MENU HEADER
========================================================= */

.menu-title {
    padding: 12px 14px 8px;

    color: #888;

    font-size: 11px;
    font-weight: 700;

    letter-spacing: 1px;
    text-transform: uppercase;
   
}


/* =========================================================
   PROPERTY MENU
   ~ نصف شاشة الهاتف
========================================================= */

.property-menu {
    flex: 0 0 46vh;

    min-height: 300px;
    max-height: 500px;

    overflow-y: auto;

    padding: 0 10px 10px;

    overscroll-behavior: contain;

    scrollbar-width: thin;
    scrollbar-color: #444 transparent;
}

.property-menu::-webkit-scrollbar {
    width: 5px;
}

.property-menu::-webkit-scrollbar-track {
    background: transparent;
}

.property-menu::-webkit-scrollbar-thumb {
    background: #333;
    border-radius: 20px;
}

.property-menu::-webkit-scrollbar-thumb:hover {
    background: #555;
}


/* =========================================================
   CATEGORY
========================================================= */

.category {
    margin-bottom: 4px;

    border: 1px solid transparent;

    border-radius: 10px;

    overflow: hidden;

    transition:
        background .2s,
        border-color .2s;
}

.category.open {
    background: #0d0d0d;
    border-color: #202020;
}


/* =========================================================
   CATEGORY TITLE
========================================================= */

.category-header {
    width: 100%;

    min-height: 42px;

    padding: 0 12px;

    display: flex;
    align-items: center;
    gap: 8px;

    border: 0;

    background: transparent;
    color: #ddd;

    text-align: left;

    cursor: pointer;

    font-size: 13px;
    font-weight: 700;
}

.category-header:hover {
    background: #151515;
}

.category-arrow {
    width: 14px;

    color: #777;

    font-size: 11px;

    transition: transform .2s;
}

.category.open .category-arrow {
    transform: rotate(90deg);
}

.category-name {
    flex: 1;
}

.category-count {
    color: #555;

    font-size: 10px;
}


/* =========================================================
   PROPERTY LIST
========================================================= */

.property-list {
    display: none;

    padding: 2px 8px 9px 28px;
}

.category.open .property-list {
    display: block;
}


/* =========================================================
   PROPERTY ITEM
========================================================= */

.property-item {
    position: relative;

    display: flex;
    align-items: center;

    min-height: 34px;

    padding: 4px 8px;

    border-radius: 7px;

    cursor: pointer;

    color: #aaa;

    font-size: 12px;

    transition:
        background .15s,
        color .15s;
}

.property-item:hover {
    background: #171717;
    color: #fff;
}

.property-item.selected {
    background:
        rgba(255, 94, 0, .08);

    color: #ff8a4d;
}


/* =========================================================
   CHECKBOX
========================================================= */

.property-item input {
    width: 15px;
    height: 15px;

    margin-right: 9px;

    accent-color: #ff5e00;

    cursor: pointer;
}

.property-name {
    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;
}


/* =========================================================
   NO RESULTS
========================================================= */

.no-results {
    display: none;

    padding: 30px 10px;

    text-align: center;

    color: #666;

    font-size: 13px;
}


/* =========================================================
   SELECTED PROPERTY
========================================================= */

.property-info {
    flex: 0 0 auto;

    padding: 14px;

    border-top: 1px solid #222;
    border-bottom: 1px solid #222;

    background: #0a0a0a;
}

.info-label {
    margin-bottom: 6px;

    color: #666;

    font-size: 10px;
    font-weight: 700;

    letter-spacing: 1px;
    text-transform: uppercase;
}

.selected-property {
    margin-bottom: 10px;

    color: #ff5e00;

    font-size: 17px;
    font-weight: 800;
}

.property-description {
    color: #999;

    font-size: 12px;
    line-height: 1.6;
}


/* =========================================================
   VALUE CONTROL
========================================================= */

.value-area {
    margin-top: 12px;
}

.value-row {
    display: flex;
    gap: 8px;
}

.value-input,
.value-select {
    width: 100%;

    min-height: 40px;

    padding: 0 11px;

    border: 1px solid #292929;
    border-radius: 9px;

    outline: none;

    background: #111;
    color: #fff;

    font-size: 12px;
}

.value-input:focus,
.value-select:focus {
    border-color: #ff5e00;
}


/* =========================================================
   LIVE PREVIEW
========================================================= */

.preview-section {
    flex: 1 1 auto;

    padding: 14px;
}

.preview-title {
    margin-bottom: 10px;

    color: #888;

    font-size: 11px;
    font-weight: 700;

    letter-spacing: 1px;
}

.preview {
    position: relative;

    width: 100%;
    min-height: 190px;

    padding: 20px;

    overflow: hidden;

    border: 1px solid #292929;
    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #111,
            #090909
        );
}

.preview-grid {
    position: absolute;
    inset: 0;

    opacity: .35;

    background-image:
        linear-gradient(#222 1px, transparent 1px),
        linear-gradient(90deg, #222 1px, transparent 1px);

    background-size: 20px 20px;

    pointer-events: none;
}

#testArea {
    position: relative;

    width: 100%;
    height: 150px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px dashed #333;
}

#testDiv {
    position: relative;

    width: 80px;
    height: 80px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid #ff5e00;
    border-radius: 10px;

    background: #171717;

    color: #fff;

    font-size: 11px;
    font-weight: 700;

    text-align: center;

    transition: all .25s ease;
}

.preview-label {
    position: absolute;

    bottom: 8px;
    left: 10px;

    color: #555;

    font-size: 9px;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {
    flex: 0 0 auto;

    padding: 10px 14px 16px;

    border-top: 1px solid #222;

    background: #090909;
}

.control-row {
    display: flex;
    gap: 8px;
}

.btn {
    flex: 1;

    min-height: 42px;

    border: 1px solid #292929;
    border-radius: 9px;

    background: #111;
    color: #aaa;

    font-size: 11px;
    font-weight: 700;

    cursor: pointer;

    transition:
        background .2s,
        color .2s,
        border-color .2s;
}

.btn:hover {
    background: #181818;
    color: #fff;
}

.btn-test {
    width: 100%;

    margin-top: 8px;

    border-color: #ff5e00;

    background: #ff5e00;
    color: #fff;

    font-size: 12px;
}

.btn-test:hover {
    background: #ff741f;
    border-color: #ff741f;
}


/* =========================================================
   STATUS
========================================================= */

.status {
    min-height: 18px;

    margin-top: 7px;

    text-align: center;

    color: #666;

    font-size: 10px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

    .header {
        padding-top: 13px;
    }

    .logo {
        font-size: 17px;
    }

    .property-menu {
        flex-basis: 45vh;
        min-height: 280px;
    }

    .preview {
        min-height: 180px;
    }

    #testArea {
        height: 140px;
    }

}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 701px) {

    body {
        padding: 20px;
    }

    .app {
        min-height: calc(100vh - 40px);

        border:
            1px solid #222;

        border-radius: 18px;

        overflow: hidden;

        box-shadow:
            0 20px 70px
            rgba(0,0,0,.5);
    }

}
</style>
</head>


<body>

<div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="logo">
            CSS <span>PROPERTY TESTER</span>
        </div>

        <div class="search-box">

            <span class="search-icon">🔍</span>

            <input
                id="searchInput"
                type="search"
                autocomplete="off"
                placeholder="Search properties..."
            >

            <button
                id="clearSearch"
                class="clear-search"
                type="button"
            >×</button>

        </div>

    </header>


    <!-- =====================================================
         MENU TITLE
    ====================================================== -->

    <div class="menu-title">

    </div>


    <!-- =====================================================

    ====================================================== -->

        id="propertyMenu"

    >

        <div

        ></div>

        <div

        </div>

    <!-- =====================================================

    ====================================================== -->

    <section class="property-info">

        <div

            its description and test it in Live Preview.
        </div>

        >

                    id="valueInput"

                <div id="testDiv">

    ====================================================== -->

        <div class="control-row">

            <button
                id="selectAll"

                SELECT ALL
            </button>

                id="clearAll"
                class="btn"
                type="button"

                CLEAR
            </button>

        </div>

        <button
            id="testSelected"
            class="btn btn-test"
            type="button"
        >
            ▶ TEST SELECTED
        </button>

        <div
            id="status"
            class="status"
        >
            Loading CSS properties...
        </div>

    </section>

</div>


<script>

/* =========================================================
   CSS PROPERTY TESTER
========================================================= */

const state = {

    allProperties: [],

    categories: {},

    selected: new Set(),

    activeProperty: null

};


/* =========================================================
   CATEGORY ORDER
========================================================= */

const CATEGORY_ORDER = [

    "Layout",

    "Position",

    "Flexbox",

    "Grid",

    "Box Model",

    "Sizing",

    "Margin",

    "Padding",

    "Gap",

    "Border",

    "Transform",

    "Motion",

    "Transition",

    "Animation",

    "Overflow & Scroll",

    "Background",

    "Color",

    "Shadow & Filter",

    "Mask & Clip",

    "Typography",

    "Text",

    "Text Decoration",

    "List",

    "Table",

    "Columns",

    "Float & Flow",

    "Content & Counters",

    "Interaction",

    "Visibility & Containment",

    "Object & Image",

    "SVG / Graphics",

    "Writing Direction",

    "Container",

    "Scrollbar",

    "Timeline",

    "Navigation",

    "Print / Page",

    "Ruby / Math / Speech",

    "WebKit",

    "Other"

];


/* =========================================================
   ELEMENTS
========================================================= */

const categoriesContainer =
    document.getElementById(
        "categoriesContainer"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const clearSearch =
    document.getElementById(
        "clearSearch"
    );

const noResults =
    document.getElementById(
        "noResults"
    );

const selectedProperty =
    document.getElementById(
        "selectedProperty"
    );

const propertyDescription =
    document.getElementById(
        "propertyDescription"
    );

const valueArea =
    document.getElementById(
        "valueArea"
    );

const valueInput =
    document.getElementById(
        "valueInput"
    );

const testDiv =
    document.getElementById(
        "testDiv"
    );

const status =
    document.getElementById(
        "status"
    );

const selectAllBtn =
    document.getElementById(
        "selectAll"
    );

const clearAllBtn =
    document.getElementById(
        "clearAll"
    );

const testSelectedBtn =
    document.getElementById(
        "testSelected"
    );

/* =========================================================
   LOAD ALL CSS PROPERTIES
   all-css.json structure:

   {
       "properties": [
           {
               "name": "width",
               "syntax": "...",
               "initial": "...",
               ...
           }
       ]
   }
========================================================= */

async function loadCSSProperties() {

    try {

        const response =
            await fetch("all-css.json", {
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        /* ---------------------------------------------
           التأكد من وجود properties
        --------------------------------------------- */

        if (
            !data ||
            !Array.isArray(data.properties)
        ) {

            throw new Error(
                "all-css.json must contain a properties array."
            );

        }


        /* ---------------------------------------------
           تحويل الخصائص
        --------------------------------------------- */

        state.allProperties =
            data.properties

                .filter(item =>
                    item &&
                    typeof item.name === "string" &&
                    item.name.trim() !== ""
                )

                .map(item => ({

                    name:
                        item.name.trim(),

                    syntax:
                        item.syntax ?? null,

                    initial:
                        item.initial ?? null,

                    appliesTo:
                        item.appliesTo ?? null,

                    inherited:
                        item.inherited ?? null,

                    percentages:
                        item.percentages ?? null,

                    computedValue:
                        item.computedValue ?? null,

                    animationType:
                        item.animationType ?? null,

                    canonicalOrder:
                        item.canonicalOrder ?? null,

                    href:
                        item.href ?? null,

                    category:
                        null,

                    description:
                        ""

                }));


        /* ---------------------------------------------
           إزالة التكرار
        --------------------------------------------- */

        const unique =
            new Map();


        state.allProperties.forEach(
            property => {

                const key =
                    property.name
                        .toLowerCase();


                if (!unique.has(key)) {

                    unique.set(
                        key,
                        property
                    );

                }

            }
        );


        state.allProperties =
            Array.from(
                unique.values()
            );


        /* ---------------------------------------------
           بناء الأقسام
        --------------------------------------------- */

        buildCategories();


        /* ---------------------------------------------
           عرض القائمة
        --------------------------------------------- */

        renderCategories();


        /* ---------------------------------------------
           تحديث الحالة
        --------------------------------------------- */

        updateStatus();


        console.log(
            "CSS properties loaded:",
            state.allProperties.length
        );


        console.log(
            "Categories:",
            state.categories
        );

    }

    catch (error) {

        console.error(
            "Failed to load all-css.json:",
            error
        );


        categoriesContainer.innerHTML = `

            <div class="json-error">

                <strong>⚠ CSS JSON Error</strong>

                <p>
                    Could not load
                    <b>all-css.json</b>
                </p>

                <small>
                    ${error.message}
                </small>

            </div>

        `;

    }

}

/* =========================================================
   NORMALIZE JSON
   Supports several common JSON structures
========================================================= */

function normalizeJSON(data) {

    let output = [];

    if (Array.isArray(data)) {

        data.forEach(item => {

            if (typeof item === "string") {

                output.push({
                    name: item,
                    description: "",
                    category: null
                });

            }

            else if (
                item &&
                typeof item === "object"
            ) {

                const name =
                    item.name ||
                    item.property ||
                    item.css ||
                    item.propertyName;

                if (name) {

                    output.push({

                        name: String(name)
                            .trim()
                            .replace(/^--/, "--"),

                        description:
                            item.description ||
                            item.desc ||
                            item.info ||
                            "",

                        category:
                            item.category ||
                            item.group ||
                            item.section ||
                            null

                    });

                }

            }

        });

    }

        else if (
        data &&
        typeof data === "object"
    ) {

        /*
         * Example:
         *
         * {
         *   "position": {...},
         *   "top": {...}
         * }
         */

        Object.entries(data).forEach(
            ([key, value]) => {

                if (
                    value &&
                    typeof value === "object" &&
                    !Array.isArray(value)
                ) {

                    output.push({

                        name: key,

                        description:
                            value.description ||
                            value.desc ||
                            value.info ||
                            "",

                        category:
                            value.category ||
                            value.group ||
                            value.section ||
                            null

                    });

                }

                else {

                    output.push({

                        name: key,

                        description: "",

                        category: null

                    });

                }

            }
        );

    }


    /* =====================================================
       REMOVE DUPLICATES
    ===================================================== */

    const seen = new Set();

    output =
        output.filter(item => {

            const key =
                item.name
                    .toLowerCase()
                    .trim();

            if (seen.has(key)) {
                return false;
            }

            seen.add(key);

            return true;

        });


    return output;

}


/* =========================================================
   BUILD CATEGORIES
========================================================= */

function buildCategories() {

    state.categories = {};


    CATEGORY_ORDER.forEach(
        category => {

            state.categories[category] = [];

        }
    );


    state.allProperties.forEach(
        property => {

            let category =
                property.category;


            /* ---------------------------------------------
               JSON يحتوي على Category
            --------------------------------------------- */

            if (
                category &&
                state.categories[category]
            ) {

                state.categories[category]
                    .push(property);

                return;

            }


            /* ---------------------------------------------
               التصنيف التلقائي
            --------------------------------------------- */

            category =
                detectCategory(
                    property.name
                );


            if (
                !state.categories[category]
            ) {

                category = "Other";

            }


            state.categories[category]
                .push(property);

        }
    );

}

function detectCategory(property) {

    const p =
        property
            .toLowerCase()
            .trim();


    /* =====================================================
       WEBKIT
       يجب فحصه أولاً
    ===================================================== */

    if (
        p.startsWith("-webkit-")
    ) {

        return "WebKit";

    }


    /* =====================================================
       POSITION
    ===================================================== */

  if (
    [
        "position",
        "top",
        "right",
        "bottom",
        "left",
        "inset",
        "inset-block",
        "inset-block-start",
        "inset-block-end",
        "inset-inline",
        "inset-inline-start",
        "inset-inline-end",
        "z-index",

        "anchor-name",
        "anchor-scope",
        "position-anchor",
        "position-area",
        "position-try",
        "position-try-fallbacks",
        "position-try-order",
        "position-visibility",

        "inset-area",
        "position-fallbacks"
    ].includes(p)
) {

        return "Position";

    }


    /* =====================================================
       FLEXBOX
    ===================================================== */

    if (
        p === "display" ||
        p === "flex" ||
        p.startsWith("flex-") ||
        p === "justify-content" ||
        p === "justify-items" ||
        p === "justify-self" ||
        p === "align-content" ||
        p === "align-items" ||
        p === "align-self" ||
        p === "place-content" ||
        p === "place-items" ||
        p === "place-self" ||
        p === "order"
    ) {

        return "Flexbox";

    }


    /* =====================================================
       GRID
    ===================================================== */

    if (
        p === "grid" ||
        p.startsWith("grid-")
    ) {

        return "Grid";

    }


    /* =====================================================
       SIZING
    ===================================================== */

    if (
        p === "width" ||
        p === "height" ||
        p === "min-width" ||
        p === "max-width" ||
        p === "min-height" ||
        p === "max-height" ||
        p === "inline-size" ||
        p === "block-size" ||
        p === "min-inline-size" ||
        p === "max-inline-size" ||
        p === "min-block-size" ||
        p === "max-block-size" ||
        p === "aspect-ratio"
    ) {

        return "Sizing";

    }


    /* =====================================================
       MARGIN
    ===================================================== */

    if (
        p === "margin" ||
        p.startsWith("margin-")
    ) {

        return "Margin";

    }


    /* =====================================================
       PADDING
    ===================================================== */

    if (
        p === "padding" ||
        p.startsWith("padding-")
    ) {

        return "Padding";

    }


    /* =====================================================
       GAP
    ===================================================== */

    if (
        p === "gap" ||
        p === "row-gap" ||
        p === "column-gap"
    ) {

        return "Gap";

    }


    /* =====================================================
       BORDER
    ===================================================== */

    if (
        p === "border" ||
        p.startsWith("border-")
    ) {

        return "Border";

    }


    /* =====================================================
       TRANSFORM
    ===================================================== */

    if (
        p === "transform" ||
        p.startsWith("transform-") ||
        p === "perspective" ||
        p === "perspective-origin" ||
        p === "backface-visibility"
    ) {

        return "Transform";

    }


    /* =====================================================
       MOTION
    ===================================================== */

    if (
        p === "offset" ||
        p.startsWith("offset-")
    ) {

        return "Motion";

    }


    /* =====================================================
       TRANSITION
    ===================================================== */

    if (
        p === "transition" ||
        p.startsWith("transition-")
    ) {

        return "Transition";

    }


    /* =====================================================
       ANIMATION
    ===================================================== */

    if (
        p === "animation" ||
        p.startsWith("animation-")
    ) {

        return "Animation";

    }


    /* =====================================================
       OVERFLOW & SCROLL
    ===================================================== */

    if (
        p === "overflow" ||
        p.startsWith("overflow-") ||
        p.startsWith("overscroll-") ||
        p === "scroll-behavior" ||
        p.startsWith("scroll-snap-") ||
        p === "scroll-margin" ||
        p.startsWith("scroll-margin-") ||
        p === "scroll-padding" ||
        p.startsWith("scroll-padding-")
    ) {

        return "Overflow & Scroll";

    }


    /* =====================================================
       BACKGROUND
    ===================================================== */

    if (
        p === "background" ||
        p.startsWith("background-")
    ) {

        return "Background";

    }


    /* =====================================================
       COLOR
    ===================================================== */

    if (
        p === "color" ||
        p === "accent-color" ||
        p === "caret-color" ||
        p === "color-scheme" ||
        p === "forced-color-adjust"
    ) {

        return "Color";

    }


    /* =====================================================
       SHADOW & FILTER
    ===================================================== */

    if (
        p === "box-shadow" ||
        p === "text-shadow" ||
        p === "filter" ||
        p === "backdrop-filter"
    ) {

        return "Shadow & Filter";

    }


    /* =====================================================
       MASK & CLIP
    ===================================================== */

    if (
        p === "clip" ||
        p === "clip-path" ||
        p.startsWith("mask-") ||
        p === "mask"
    ) {

        return "Mask & Clip";

    }


    /* =====================================================
       TYPOGRAPHY
    ===================================================== */

    if (
        p === "font" ||
        p.startsWith("font-") ||
        p === "line-height" ||
        p === "letter-spacing" ||
        p === "word-spacing" ||
        p === "white-space" ||
        p === "tab-size"
    ) {

        return "Typography";

    }


    /* =====================================================
       TEXT
    ===================================================== */

    if (
        p.startsWith("text-") ||
        p === "word-break" ||
        p === "overflow-wrap" ||
        p === "hyphens" ||
        p === "line-break"
    ) {

        return "Text";

    }


    /* =====================================================
       TEXT DECORATION
    ===================================================== */

    if (
        p === "text-decoration" ||
        p.startsWith("text-decoration-") ||
        p === "text-underline-offset" ||
        p === "text-underline-position" ||
        p === "text-emphasis" ||
        p.startsWith("text-emphasis-")
    ) {

        return "Text Decoration";

    }


    /* =====================================================
       LIST
    ===================================================== */

    if (
        p === "list-style" ||
        p.startsWith("list-style-")
    ) {

        return "List";

    }


    /* =====================================================
       TABLE
    ===================================================== */

    if (
        p === "border-collapse" ||
        p === "border-spacing" ||
        p === "caption-side" ||
        p === "empty-cells" ||
        p === "table-layout"
    ) {

        return "Table";

    }


    /* =====================================================
       COLUMNS
    ===================================================== */

    if (
        p === "columns" ||
        p.startsWith("column-")
    ) {

        return "Columns";

    }


    /* =====================================================
       FLOAT & FLOW
    ===================================================== */

    if (
        p === "float" ||
        p === "clear" ||
        p.startsWith("shape-")
    ) {

        return "Float & Flow";

    }


    /* =====================================================
       CONTENT & COUNTERS
    ===================================================== */

    if (
        p === "content" ||
        p.startsWith("counter-") ||
        p === "quotes"
    ) {

        return "Content & Counters";

    }


    /* =====================================================
       INTERACTION
    ===================================================== */

    if (
        p === "cursor" ||
        p === "pointer-events" ||
        p === "user-select" ||
        p === "touch-action" ||
        p === "resize"
    ) {

        return "Interaction";

    }


    /* =====================================================
       VISIBILITY & CONTAINMENT
    ===================================================== */

    if (
        p === "visibility" ||
        p === "content-visibility" ||
        p === "contain" ||
        p.startsWith("contain-") ||
        p === "isolation"
    ) {

        return "Visibility & Containment";

    }


    /* =====================================================
       OBJECT & IMAGE
    ===================================================== */

    if (
        p.startsWith("object-") ||
        p.startsWith("image-")
    ) {

        return "Object & Image";

    }


    /* =====================================================
       SVG / GRAPHICS
    ===================================================== */

    if (
        p === "fill" ||
        p.startsWith("fill-") ||
        p === "stroke" ||
        p.startsWith("stroke-") ||
        p === "paint-order" ||
        p === "vector-effect" ||
        p.startsWith("stop-")
    ) {

        return "SVG / Graphics";

    }


    /* =====================================================
       WRITING DIRECTION
    ===================================================== */

    if (
        p === "direction" ||
        p === "writing-mode" ||
        p === "text-orientation" ||
        p === "unicode-bidi"
    ) {

        return "Writing Direction";

    }


    /* =====================================================
       CONTAINER
    ===================================================== */

    if (
        p === "container" ||
        p.startsWith("container-")
    ) {

        return "Container";

    }


    /* =====================================================
       SCROLLBAR
    ===================================================== */

    if (
        p === "scrollbar-width" ||
        p === "scrollbar-color" ||
        p === "scrollbar-gutter"
    ) {

        return "Scrollbar";

    }


    /* =====================================================
       TIMELINE
    ===================================================== */

    if (
        p === "animation-timeline" ||
        p.startsWith("animation-range") ||
        p.startsWith("scroll-timeline") ||
        p.startsWith("view-timeline")
    ) {

        return "Timeline";

    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    if (
        p === "nav-index" ||
        p === "nav-up" ||
        p === "nav-right" ||
        p === "nav-down" ||
        p === "nav-left"
    ) {

        return "Navigation";

    }


    /* =====================================================
       PRINT / PAGE
    ===================================================== */

    if (
        p.startsWith("page-") ||
        p.startsWith("break-") ||
        p === "orphans" ||
        p === "widows"
    ) {

        return "Print / Page";

    }


    /* =====================================================
       RUBY / MATH / SPEECH
    ===================================================== */

    if (
        p.startsWith("ruby-") ||
        p.startsWith("math-") ||
        p.startsWith("speak") ||
        p === "voice-family"
    ) {

        return "Ruby / Math / Speech";

    }


    return "Other";

}

/* =========================================================
   RENDER CATEGORIES
========================================================= */

function renderCategories(
    filter = ""
) {

    categoriesContainer.innerHTML = "";

    let visibleProperties = 0;


    CATEGORY_ORDER.forEach(
        categoryName => {

            const properties =
                state.categories[categoryName] || [];


            const filtered =
                properties.filter(
                    property =>
                        property.name
                            .toLowerCase()
                            .includes(
                                filter.toLowerCase()
                            )
                );


            if (!filtered.length) {
                return;
            }


            visibleProperties +=
                filtered.length;


            const category =
                document.createElement("div");

            category.className =
                "category";


            /*
             * Position مفتوح عند البداية
             */

            if (
                categoryName === "Position" &&
                !filter
            ) {

                category.classList.add("open");

            }


            /*
             * أثناء البحث افتح الأقسام
             * التي تحتوي على نتائج
             */

            if (filter) {

                category.classList.add("open");

            }


            const header =
                document.createElement("button");

            header.className =
                "category-header";

            header.type = "button";


            const arrow =
                document.createElement("span");

            arrow.className =
                "category-arrow";

            arrow.textContent =
                "▶";


            const name =
                document.createElement("span");

            name.className =
                "category-name";

            name.textContent =
                categoryName;


            const count =
                document.createElement("span");

            count.className =
                "category-count";

            count.textContent =
                filtered.length;


            header.append(
                arrow,
                name,
                count
            );


            const list =
                document.createElement("div");

            list.className =
                "property-list";


            filtered.forEach(
                property => {

                    const label =
                        document.createElement("label");

                    label.className =
                        "property-item";


                    if (
                        state.selected.has(
                            property.name
                        )
                    ) {

                        label.classList.add(
                            "selected"
                        );

                    }


                    const checkbox =
                        document.createElement(
                            "input"
                        );

                    checkbox.type =
                        "checkbox";

                    checkbox.checked =
                        state.selected.has(
                            property.name
                        );


                    checkbox.addEventListener(
                        "change",
                        event => {

                            if (
                                event.target.checked
                            ) {

                                state.selected.add(
                                    property.name
                                );

                                label.classList.add(
                                    "selected"
                                );

                            }

                            else {

                                state.selected.delete(
                                    property.name
                                );

                                label.classList.remove(
                                    "selected"
                                );

                            }


                            selectProperty(
                                property
                            );

                            updateStatus();

                        }
                    );


                    const propertyName =
                        document.createElement(
                            "span"
                        );

                    propertyName.className =
                        "property-name";

                    propertyName.textContent =
                        property.name;


                    label.append(
                        checkbox,
                        propertyName
                    );


                    list.appendChild(label);

                }
            );


            header.addEventListener(
                "click",
                () => {

                    category.classList.toggle(
                        "open"
                    );

                }
            );


            category.append(
                header,
                list
            );


            categoriesContainer.appendChild(
                category
            );

        }
    );


    noResults.style.display =
        visibleProperties === 0
            ? "block"
            : "none";

}


/* =========================================================
   SELECT PROPERTY
========================================================= */

function selectProperty(property) {

    state.activeProperty =
        property;


    selectedProperty.textContent =
        property.name;


    propertyDescription.textContent =
        property.description ||
        getDefaultDescription(
            property.name
        );


    valueArea.style.display =
        "block";


    valueInput.value =
        getDefaultValue(
            property.name
        );


    if (
        valueInput.value
    ) {

        applySingleProperty(
            property.name,
            valueInput.value
        );

    }

}


/* =========================================================
   DEFAULT DESCRIPTION
========================================================= */

function getDefaultDescription(
    property
) {

    const descriptions = {

        position:
            "Specifies how an element is positioned in the document.",

        top:
            "Specifies the top offset of a positioned element.",

        right:
            "Specifies the right offset of a positioned element.",

        bottom:
            "Specifies the bottom offset of a positioned element.",

        left:
            "Specifies the left offset of a positioned element.",

        inset:
            "A shorthand property for top, right, bottom and left.",

        "z-index":
            "Controls the stacking order of positioned elements.",

        display:
            "Specifies how an element is displayed.",

        width:
            "Specifies the width of an element.",

        height:
            "Specifies the height of an element.",

        margin:
            "Specifies the outer margin of an element.",

        padding:
            "Specifies the inner padding of an element.",

        color:
            "Specifies the text color of an element.",

        background:
            "A shorthand property for background styling.",

        transform:
            "Applies a two-dimensional or three-dimensional transformation."

    };


    return descriptions[property] ||
        "CSS property available for testing in the Live Preview.";

}


/* =========================================================
   DEFAULT TEST VALUES
========================================================= */

function getDefaultValue(
    property
) {

    const values = {

        position: "relative",

        top: "20px",

        right: "20px",

        bottom: "20px",

        left: "20px",

        inset: "10px",

        "z-index": "10",

        display: "block",

        width: "150px",

        height: "100px",

        margin: "20px",

        padding: "20px",

        color: "#ff5e00",

        background: "#222",

        opacity: "0.8",

        transform:
            "translateX(20px)",

        "border-radius":
            "25px",

        "border-width":
            "5px",

        "border-style":
            "solid",

        "border-color":
            "#ff5e00"

    };


    return values[property] || "";

}


/* =========================================================
   APPLY PROPERTY
========================================================= */

function applySingleProperty(
    property,
    value
) {

    if (!property) {
        return;
    }


    if (
        !value ||
        !value.trim()
    ) {
        return;
    }


    try {

        testDiv.style.setProperty(
            property,
            value
        );

    }

    catch (error) {

        console.warn(
            "CSS property error:",
            property,
            error
        );

    }

}


/* =========================================================
   VALUE INPUT
========================================================= */

valueInput.addEventListener(
    "input",
    () => {

        if (
            state.activeProperty
        ) {

            applySingleProperty(
                state.activeProperty.name,
                valueInput.value
            );

        }

    }
);


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    () => {

        const query =
            searchInput.value.trim();


        clearSearch.style.display =
            query
                ? "block"
                : "none";


        renderCategories(
            query
        );

    }
);


/* =========================================================
   CLEAR SEARCH
========================================================= */

clearSearch.addEventListener(
    "click",
    () => {

        searchInput.value = "";

        clearSearch.style.display =
            "none";

        renderCategories();

        searchInput.focus();

    }
);


/* =========================================================
   SELECT ALL
========================================================= */

selectAllBtn.addEventListener(
    "click",
    () => {

        state.allProperties.forEach(
            property => {

                state.selected.add(
                    property.name
                );

            }
        );


        renderCategories(
            searchInput.value
        );


        updateStatus();

    }
);


/* =========================================================
   CLEAR
========================================================= */

clearAllBtn.addEventListener(
    "click",
    () => {

        state.selected.clear();


        testDiv.removeAttribute(
            "style"
        );


        state.activeProperty =
            null;


        selectedProperty.textContent =
            "No property selected";


        propertyDescription.textContent =
            "Select a CSS property from the menu to see its description and test it in Live Preview.";


        valueArea.style.display =
            "none";


        renderCategories(
            searchInput.value
        );


        updateStatus();

    }
);


/* =========================================================
   TEST SELECTED
========================================================= */

testSelectedBtn.addEventListener(
    "click",
    () => {

        if (
            state.selected.size === 0
        ) {

            status.textContent =
                "⚠ Select at least one property.";

            return;

        }


        if (
            state.activeProperty &&
            valueInput.value.trim()
        ) {

            applySingleProperty(
                state.activeProperty.name,
                valueInput.value.trim()
            );

        }


        let tested = 0;


        state.selected.forEach(
            property => {

                if (
                    state.activeProperty &&
                    property ===
                    state.activeProperty.name
                ) {

                    tested++;

                    return;

                }


                const value =
                    getDefaultValue(
                        property
                    );


                if (value) {

                    applySingleProperty(
                        property,
                        value
                    );

                    tested++;

                }

            }
        );


        status.textContent =
            `✓ ${tested} selected properties tested`;

    }
);


/* =========================================================
   STATUS
========================================================= */

function updateStatus() {

    status.textContent =
        `${state.selected.size} properties selected`;

}


/* =========================================================
   START
========================================================= */

loadCSSProperties();

</script>
