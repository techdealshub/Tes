<!-- =====================================

<!-- =====================================

===================================== -->

<section>

    <h3>

    </h3>

<!-- =====================================

===================================== -->

<section>

    <h3>

    </h3>

        id="funcs-count"
        class="counter">
    </div>

        id="funcs-grid"

<script>
  /* =========================================================
   CSS SMART VALUE ANALYZER
   ========================================================= */

const TYPES = new Map();
const FUNCTIONS = new Map();

let CSS_PROPERTIES = [];


/* =========================================================
   تجاهل
   ========================================================= */

const ignored = new Set([
    "name",
    "property",
    "title",
    "id",
    "appliesTo",
    "inherited",
    "percentages",
    "computedValue",
    "animationType",
    "canonicalOrder",
    "media",
    "initial",
    "inherit",
    "unset",
    "revert",
    "revert-layer",
    "N/A"
]);


/* =========================================================
   أدوات
   ========================================================= */

function clean(value){

    if(typeof value !== "string")
        return null;

    value = value.trim();

    if(!value)
        return null;

    if(value === "[object Object]")
        return null;

    if(value.length > 200)
        return null;

    if(ignored.has(value))
        return null;

    return value;
}


/* =========================================================
   حماية HTML
   ========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   اسم العنصر
   ========================================================= */

function getName(item){

    if(typeof item === "string")
        return item;

    if(!item)
        return "مجهول";

    return (
        item.name ||
        item.property ||
        item.title ||
        Object.keys(item)[0] ||
        "مجهول"
    );

}


/* =========================================================
   Syntax
   ========================================================= */

function getSyntax(item){

    if(!item || typeof item !== "object")
        return "";

    return (
        item.syntax ||
        item.value ||
        item.grammar ||
        ""
    );

}


/* =========================================================
   استخراج Types من Syntax
   ========================================================= */

function findTypes(syntax){

    if(typeof syntax !== "string")
        return [];

    const matches =
        syntax.match(
            /<([a-zA-Z0-9-]+)(?:\s[^>]*)?>/g
        ) || [];

    const result = new Set();

    matches.forEach(x => {

        const m =
            x.match(
                /^<([a-zA-Z0-9-]+)/
            );

        if(m)
            result.add(
                "<" + m[1] + ">"
            );

    });

    return [...result];

}


/* =========================================================
   استخراج Functions من Syntax
   ========================================================= */

function findFunctions(syntax){

    if(typeof syntax !== "string")
        return [];

    const matches =
        syntax.match(
            /(?:--)?[a-zA-Z][a-zA-Z0-9-]*\s*\(/g
        ) || [];

    return [
        ...new Set(
            matches.map(
                x =>
                    x
                    .replace(/\s*\($/,"")
            )
        )
    ];

}


/* =========================================================
   استخراج الكلمات المباشرة
   ========================================================= */

function directValues(syntax){

    const result = new Set();

    if(typeof syntax !== "string")
        return result;


    let text =
        syntax
        .replace(
            /<[^>]+>/g,
            " "
        )
        .replace(
            /[()[\]{}|#,>+*]/g,
            " "
        );


    text
        .split(/\s+/)
        .forEach(value => {

            value = clean(value);

            if(!value)
                return;

            if(
                value.includes("(") ||
                value.includes(")")
            )
                return;

            if(
                value === "and" ||
                value === "or"
            )
                return;

            result.add(value);

        });


    return result;

}


/* =========================================================
   فهرسة Types و Functions الموجودة في الملف
   ========================================================= */

function indexDefinitions(items,map){

    if(!Array.isArray(items))
        return;


    items.forEach(item => {

        const name =
            getName(item);

        if(!name)
            return;

        map.set(
            name,
            getSyntax(item)
        );

    });

}


/* =========================================================
   البحث عن Type داخل Types الموجودة
   ========================================================= */

function resolveType(
    type,
    visited = new Set()
){

    if(visited.has(type))
        return new Set();

    visited.add(type);


    const result =
        new Set();


    /*
       Syntax الخاص بهذا Type
    */

    const syntax =
        TYPES.get(type);


    if(!syntax)
        return result;


    /*
       القيم المباشرة
    */

    directValues(syntax)
        .forEach(
            value =>
                result.add(value)
        );


    /*
       Types داخله
    */

    findTypes(syntax)
        .forEach(child => {

            resolveType(
                child,
                new Set(visited)
            )
            .forEach(
                value =>
                    result.add(value)
            );

        });


    return result;

}


/* =========================================================
   هل Type رقمي؟
   ========================================================= */

function numericType(type){

    const numeric = new Set([

        "<length>",
        "<percentage>",
        "<length-percentage>",

        "<number>",
        "<integer>",

        "<angle>",
        "<time>",

        "<frequency>",
        "<resolution>"

    ]);

    return numeric.has(type);

}


/* =========================================================
   توليد القيم الرقمية
   ========================================================= */

function generateNumericValues(
    type,
    number,
    unit
){

    const result = [];


    switch(type){

        /* ---------------------------------
           Length
        --------------------------------- */

        case "<length>":

            result.push(
                number + unit
            );

            break;


        /* ---------------------------------
           Percentage
        --------------------------------- */

        case "<percentage>":

            result.push(
                number + "%"
            );

            break;


        /* ---------------------------------
           Length + Percentage
        --------------------------------- */

        case "<length-percentage>":

            result.push(
                number + unit
            );

            result.push(
                number + "%"
            );

            break;


        /* ---------------------------------
           Number
        --------------------------------- */

        case "<number>":

            result.push(
                String(number)
            );

            break;


        /* ---------------------------------
           Integer
        --------------------------------- */

        case "<integer>":

            result.push(
                String(
                    Math.trunc(number)
                )
            );

            break;


        /* ---------------------------------
           Angle
        --------------------------------- */

        case "<angle>":

            result.push(
                number + "deg"
            );

            result.push(
                number + "rad"
            );

            result.push(
                number + "grad"
            );

            result.push(
                number + "turn"
            );

            break;


        /* ---------------------------------
           Time
        --------------------------------- */

        case "<time>":

            result.push(
                number + "s"
            );

            result.push(
                number + "ms"
            );

            break;


        /* ---------------------------------
           Frequency
        --------------------------------- */

        case "<frequency>":

            result.push(
                number + "Hz"
            );

            result.push(
                number + "kHz"
            );

            break;


        /* ---------------------------------
           Resolution
        --------------------------------- */

        case "<resolution>":

            result.push(
                number + "dpi"
            );

            result.push(
                number + "dpcm"
            );

            result.push(
                number + "dppx"
            );

            break;

    }


    return result;

}


/* =========================================================
   CSS.supports
   ========================================================= */

function supports(
    property,
    value
){

    try{

        return CSS.supports(
            property,
            value
        );

    }catch(error){

        return false;

    }

}


/* =========================================================
   استخراج كل القيم الرقمية للـ Property
   ========================================================= */

function numericValuesForProperty(
    item,
    number,
    unit
){

    const syntax =
        getSyntax(item);


    const types =
        findTypes(syntax);


    const result =
        new Set();


    types.forEach(type => {

        /*
           Type رقمي مباشر
        */

        if(
            numericType(type)
        ){

            generateNumericValues(
                type,
                number,
                unit
            )
            .forEach(
                value =>
                    result.add(value)
            );

        }


        /*
           Type قد يحتوي Type رقمي
        */

        const typeSyntax =
            TYPES.get(type);


        if(typeSyntax){

            findTypes(typeSyntax)
                .forEach(child => {

                    if(
                        numericType(child)
                    ){

                        generateNumericValues(
                            child,
                            number,
                            unit
                        )
                        .forEach(
                            value =>
                                result.add(value)
                        );

                    }

                });

        }

    });


    return [...result];

}


/* =========================================================
   إنشاء Tag
   ========================================================= */

function addValueTag(
    container,
    value,
    className
){

    const tag =
        document.createElement(
            "span"
        );


    tag.className =
        "value-tag " +
        className;


    tag.textContent =
        value;


    container.appendChild(tag);

}


/* =========================================================
   إنشاء Property Box
   ========================================================= */

function createBox(
    name,
    index
){

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "property-box";


    /*
       مهم جداً
       حتى نجد Property لاحقاً
    */

    box.dataset.property =
        name;


    const header =
        document.createElement(
            "div"
        );


    header.className =
        "prop-title";


    header.innerHTML = `

        <span>
            ${escapeHTML(name)}
        </span>

        <span class="num-badge">
            #${index + 1}
        </span>

    `;


    const values =
        document.createElement(
            "div"
        );


    values.className =
        "values-container";


    values.style.display =
        "none";


    header.onclick = () => {

        values.style.display =
            values.style.display === "none"
                ? "flex"
                : "none";

    };


    box.append(
        header,
        values
    );


    return {
        box,
        values
    };

}


/* =========================================================
   عرض Properties
   ========================================================= */

function renderProperties(items){

    const grid =
        document.getElementById(
            "props-grid"
        );


    const counter =
        document.getElementById(
            "props-count"
        );


    grid.innerHTML = "";


    counter.textContent =
        "📊 " +
        items.length +
        " Properties";


    const jobs = [];


    /*
       إنشاء الواجهة أولاً
    */

    items.forEach(
        (item,index) => {

            const name =
                getName(item);


            const syntax =
                getSyntax(item);


            const ui =
                createBox(
                    name,
                    index
                );


            grid.appendChild(
                ui.box
            );


            /*
               القيم الأصلية
            */

            const original =
                new Set();


            directValues(
                syntax
            )
            .forEach(
                value =>
                    original.add(value)
            );


            /*
               Types الموجودة في Syntax
            */

            findTypes(syntax)
                .forEach(
                    type =>
                        original.add(type)
                );


            /*
               Functions الموجودة
            */

            findFunctions(syntax)
                .forEach(
                    fn =>
                        original.add(
                            fn + "()"
                        )
                );


            /*
               عرض القيم الأصلية
            */

            original.forEach(
                value => {

                    addValueTag(
                        ui.values,
                        value,
                        "original-val"
                    );

                }
            );


            jobs.push({
                item,
                name,
                syntax,
                ui
            });

        }
    );


    /*
       بدء التحليل الرقمي
    */

    runNumericScan(
        jobs
    );

}


/* =========================================================
   التحليل الرقمي
   ========================================================= */

function runNumericScan(jobs){

    let index = 0;


    function batch(){

        const start =
            performance.now();


        while(
            index < jobs.length &&
            performance.now() - start < 10
        ){

            const job =
                jobs[index];


            scanOneProperty(
                job
            );


            index++;

        }


        const counter =
            document.getElementById(
                "props-count"
            );


        counter.textContent =
            "🔎 " +
            index +
            " / " +
            jobs.length;


        if(
            index < jobs.length
        ){

            setTimeout(
                batch,
                0
            );

        }else{

            counter.textContent =
                "✅ " +
                jobs.length +
                " Properties";

        }

    }


    batch();

}


/* =========================================================
   فحص Property واحد
   ========================================================= */

function scanOneProperty(job){

    const range =
        document.getElementById(
            "number-range"
        );


    const unitSelect =
        document.getElementById(
            "unit-select"
        );


    if(!range || !unitSelect)
        return;


    const number =
        Number(range.value);


    const unit =
        unitSelect.value;


    const values =
        numericValuesForProperty(
            job.item,
            number,
            unit
        );


    values.forEach(value => {

        /*
           إذا كانت القيمة مدعومة
        */

        if(
            supports(
                job.name,
                value
            )
        ){

            addValueTag(
                job.ui.values,
                value,
                "added-val numeric-value"
            );

        }

    });

}


/* =========================================================
   إعادة الفحص عند تغيير Range
   ========================================================= */

function testNumericValues(){

    /*
       إزالة القيم الرقمية القديمة
    */

    document
        .querySelectorAll(
            ".numeric-value"
        )
        .forEach(
            element =>
                element.remove()
        );


    /*
       إعادة اختبار كل Properties
    */

    CSS_PROPERTIES.forEach(
        (item,index) => {

            const name =
                getName(item);


            const box =
                document.querySelector(
                    `[data-property="${CSS.escape(name)}"]`
                );


            if(!box)
                return;


            const values =
                box.querySelector(
                    ".values-container"
                );


            if(!values)
                return;


            scanOneProperty({
                item,
                name,
                ui:{
                    values
                }
            });

        }
    );

}


/* =========================================================
   Range Controls
   ========================================================= */

function setupRange(){

    const range =
        document.getElementById(
            "number-range"
        );


    const rangeValue =
        document.getElementById(
            "range-value"
        );


    const unit =
        document.getElementById(
            "unit-select"
        );


    if(!range)
        return;


    /*
       عند تحريك Range
    */

    range.addEventListener(
        "input",
        () => {

            rangeValue.textContent =
                range.value;


            testNumericValues();

        }
    );


    /*
       عند تغيير Unit
    */

    if(unit){

        unit.addEventListener(
            "change",
            () => {

                testNumericValues();

            }
        );

    }

}


/* =========================================================
   عرض Types
   ========================================================= */

function renderTypes(items){

    const grid =
        document.getElementById(
            "types-grid"
        );


    const counter =
        document.getElementById(
            "types-count"
        );


    grid.innerHTML = "";


    counter.textContent =
        "📊 " +
        items.length +
        " Types";


    items.forEach(
        (item,index) => {

            const name =
                getName(item);


            const ui =
                createBox(
                    name,
                    index
                );


            grid.appendChild(
                ui.box
            );


            const syntax =
                getSyntax(item);


            directValues(syntax)
                .forEach(
                    value => {

                        addValueTag(
                            ui.values,
                            value,
                            "original-val"
                        );

                    }
                );


            findTypes(syntax)
                .forEach(
                    type => {

                        addValueTag(
                            ui.values,
                            type,
                            "original-val"
                        );

                    }
                );


            findFunctions(syntax)
                .forEach(
                    fn => {

                        addValueTag(
                            ui.values,
                            fn + "()",
                            "original-val"
                        );

                    }
                );

        }
    );

}


/* =========================================================
   عرض Functions
   ========================================================= */

function renderFunctions(items){

    const grid =
        document.getElementById(
            "funcs-grid"
        );


    const counter =
        document.getElementById(
            "funcs-count"
        );


    grid.innerHTML = "";


    counter.textContent =
        "📊 " +
        items.length +
        " Functions";


    items.forEach(
        (item,index) => {

            const name =
                getName(item);


            const ui =
                createBox(
                    name,
                    index
                );


            grid.appendChild(
                ui.box
            );


            const syntax =
                getSyntax(item);


            directValues(syntax)
                .forEach(
                    value => {

                        addValueTag(
                            ui.values,
                            value,
                            "original-val"
                        );

                    }
                );


            findTypes(syntax)
                .forEach(
                    type => {

                        addValueTag(
                            ui.values,
                            type,
                            "original-val"
                        );

                    }
                );


            findFunctions(syntax)
                .forEach(
                    fn => {

                        addValueTag(
                            ui.values,
                            fn + "()",
                            "original-val"
                        );

                    }
                );

        }
    );

}


/* =========================================================
   تشغيل
   ========================================================= */

fetch("all-css.json")

.then(response => {

    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }

    return response.json();

})


.then(data => {

    /*
       البيانات الأصلية
    */

    CSS_PROPERTIES =
        Array.isArray(
            data.properties
        )
        ? data.properties
        : [];


    const types =
        Array.isArray(
            data.types
        )
        ? data.types
        : [];


    const functions =
        Array.isArray(
            data.functions
        )
        ? data.functions
        : [];


    /*
       Types الجاهزة من الملف
    */

    indexDefinitions(
        types,
        TYPES
    );


    /*
       Functions الجاهزة من الملف
    */

    indexDefinitions(
        functions,
        FUNCTIONS
    );


    console.log(
        "Properties:",
        CSS_PROPERTIES.length
    );


    console.log(
        "Types:",
        types.length
    );


    console.log(
        "Functions:",
        functions.length
    );


    console.log(
        "Indexed Types:",
        TYPES.size
    );


    console.log(
        "Indexed Functions:",
        FUNCTIONS.size
    );


    /*
       إخفاء رسالة التحميل
    */

    const status =
        document.getElementById(
            "status-message"
        );


    if(status)
        status.style.display =
            "none";


    /*
       Properties
    */

    renderProperties(
        CSS_PROPERTIES
    );


    /*
       Types
    */

    renderTypes(
        types
    );


    /*
       Functions
    */

    renderFunctions(
        functions
    );


    /*
       Range
    */

    setupRange();

})


.catch(error => {

    const status =
        document.getElementById(
            "status-message"
        );


    if(status){

        status.style.display =
            "block";


        status.innerHTML = `

            <span style="color:red">

                ❌ خطأ:

                ${escapeHTML(
                    error.message
                )}

            </span>

        `;

    }


    console.error(error);

});
   
</script>
