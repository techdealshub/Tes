<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Property Tester</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, sans-serif;
    background: #050505;
    color: #fff;
}


/* =========================================================
   APP
========================================================= */

#app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   TOP 50%
========================================================= */

#cssPanel {
    width: 100%;
    height: 50%;

    min-height: 0;

    display: flex;
    flex-direction: column;

    background: #080808;

    border-bottom: 2px solid #222;
}


/* =========================================================
   HEADER
========================================================= */

#header {
    height: 55px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    background: #0d0d0d;

    border-bottom: 1px solid #222;
}

#header h1 {
    font-size: 18px;
    color: #ff5e00;
}

#search {
    width: 220px;
    height: 34px;

    padding: 0 12px;

    background: #111;
    color: white;

    border: 1px solid #333;
    border-radius: 6px;

    outline: none;
}

#search:focus {
    border-color: #ff5e00;
}


/* =========================================================
   CATEGORIES
========================================================= */

#categories {
    flex: 1;

    min-height: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 10px;
}


/* =========================================================
   CATEGORY
========================================================= */

.category {
    margin-bottom: 8px;

    background: #0d0d0d;

    border: 1px solid #222;

    border-radius: 7px;

    overflow: hidden;
}

.category-title {
    width: 100%;
    min-height: 42px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 13px;

    cursor: pointer;

    background: #111;
    color: #fff;

    font-size: 14px;
    font-weight: bold;
}

.category-title:hover {
    background: #181818;
}

.category-title .arrow {
    color: #777;

    transition: transform .2s;
}

.category.open .category-title .arrow {
    transform: rotate(90deg);
}


/* =========================================================
   CATEGORY CONTENT
========================================================= */

.category-content {
    display: none;

    padding: 10px;

    background: #090909;

    border-top: 1px solid #222;
}

.category.open .category-content {
    display: block;
}


/* =========================================================
   PROPERTY
========================================================= */

.property {
    margin-bottom: 8px;

    padding: 10px;

    background: #101010;

    border: 1px solid #222;

    border-radius: 6px;
}

.property-name {
    margin-bottom: 5px;

    color: #ff8a4c;

    font-size: 13px;
    font-weight: bold;
}

.property-description {
    margin-bottom: 9px;

    color: #888;

    font-size: 11px;

    line-height: 1.5;
}


/* =========================================================
   CONTROL
========================================================= */

.property-control {
    width: 100%;
}


/* =========================================================
   SELECT / INPUT
========================================================= */

.property-control select,
.property-control input[type="text"] {
    width: 100%;
    height: 34px;

    padding: 0 8px;

    background: #080808;
    color: white;

    border: 1px solid #333;

    border-radius: 5px;

    outline: none;
}

.property-control select:focus,
.property-control input[type="text"]:focus {
    border-color: #ff5e00;
}


/* =========================================================
   RANGE ROW
========================================================= */

.range-row {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 8px;

    margin-bottom: 8px;
}

.range-row input[type="range"] {
    flex: 1;

    min-width: 0;

    accent-color: #ff5e00;

    cursor: pointer;
}

.range-value {
    width: 70px;
    flex-shrink: 0;

    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #080808;

    border: 1px solid #333;
    border-radius: 5px;

    color: #fff;

    font-size: 12px;
}


/* =========================================================
   UNIT ROW
========================================================= */

.unit-row {
    display: flex;
    align-items: center;

    gap: 7px;

    margin-bottom: 8px;
}

.unit-label {
    color: #777;

    font-size: 11px;
}

.unit-select {
    flex: 1;
}


/* =========================================================
   FUNCTION BUTTONS
========================================================= */

.function-title {
    margin-bottom: 5px;

    color: #777;

    font-size: 11px;
}

.function-buttons {
    display: flex;

    flex-wrap: wrap;

    gap: 5px;

    margin-bottom: 8px;
}

.function-button {
    padding: 5px 8px;

    background: #151515;

    color: #aaa;

    border: 1px solid #333;

    border-radius: 4px;

    font-size: 11px;

    cursor: pointer;
}

.function-button:hover {
    color: white;

    border-color: #ff5e00;
}

.function-button.active {
    color: white;

    background: #ff5e00;

    border-color: #ff5e00;
}


/* =========================================================
   FUNCTION INPUT
========================================================= */

.function-input {
    width: 100%;

    height: 34px;

    padding: 0 9px;

    background: #080808;

    color: #fff;

    border: 1px solid #333;

    border-radius: 5px;

    outline: none;

    font-size: 12px;
}

.function-input:focus {
    border-color: #ff5e00;
}


/* =========================================================
   SPECIAL VALUES
========================================================= */

.special-values {
    display: flex;

    flex-wrap: wrap;

    gap: 5px;

    margin-top: 7px;
}

.special-button {
    padding: 5px 8px;

    background: #151515;

    color: #aaa;

    border: 1px solid #333;

    border-radius: 4px;

    font-size: 11px;

    cursor: pointer;
}

.special-button:hover {
    color: white;

    border-color: #ff5e00;
}


/* =========================================================
   Z INDEX
========================================================= */

.zindex-value {
    margin-left: 8px;

    min-width: 55px;

    color: #fff;

    font-size: 12px;

    text-align: center;
}


/* =========================================================
   BOTTOM 50%
========================================================= */

#previewPanel {
    width: 100%;
    height: 50%;

    min-height: 0;

    display: flex;

    flex-direction: column;

    background: #050505;
}


/* =========================================================
   PREVIEW HEADER
========================================================= */

#previewHeader {
    height: 50px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 15px;

    background: #0d0d0d;

    border-bottom: 1px solid #222;
}

#previewHeader strong {
    color: #ff5e00;
}

#resetButton {
    height: 30px;

    padding: 0 12px;

    background: #151515;

    color: #aaa;

    border: 1px solid #333;

    border-radius: 5px;

    cursor: pointer;
}

#resetButton:hover {
    color: white;

    border-color: #ff5e00;
}


/* =========================================================
   PREVIEW
========================================================= */

#preview {
    flex: 1;

    min-height: 0;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    background:
        linear-gradient(#151515 1px, transparent 1px),
        linear-gradient(90deg, #151515 1px, transparent 1px);

    background-size: 20px 20px;
}


/* =========================================================
   TEST AREA
========================================================= */

#testArea {
    position: relative;

    width: 90%;
    height: 80%;

    display: flex;

    align-items: center;

    justify-content: center;

    border: 1px dashed #333;
}


/* =========================================================
   TEST DIV
========================================================= */

#testDiv {
    width: 150px;
    height: 100px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #ff5e00;

    color: white;

    border-radius: 8px;

    font-weight: bold;

    position: relative;

    transition: all .15s ease;
}


/* =========================================================
   AXIS
========================================================= */

.axis-x,
.axis-y {
    position: absolute;

    background: #333;

    pointer-events: none;
}

.axis-x {
    width: 100%;
    height: 1px;

    top: 50%;
    left: 0;
}

.axis-y {
    width: 1px;
    height: 100%;

    left: 50%;
    top: 0;
}


/* =========================================================
   CURRENT PROPERTY
========================================================= */

#currentProperty {
    position: absolute;

    left: 10px;
    bottom: 10px;

    padding: 6px 9px;

    background: #111;

    border: 1px solid #333;

    border-radius: 5px;

    color: #aaa;

    font-size: 11px;
}


/* =========================================================
   ERROR
========================================================= */

#error {
    display: none;

    margin: 15px;

    padding: 12px;

    background: #190909;

    border: 1px solid #5a2222;

    border-radius: 6px;

    color: #ff7777;

    font-size: 12px;

    line-height: 1.5;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 600px) {

    #header h1 {
        font-size: 15px;
    }

    #search {
        width: 150px;
    }

    .category-title {
        font-size: 13px;
    }

}

</style>

</head>


<body>


<div id="app">


    <!-- =====================================================
         TOP 50%
    ====================================================== -->

    <section id="cssPanel">


        <header id="header">

            <h1>
                CSS Property Tester
            </h1>

            <input
                id="search"
                type="search"
                placeholder="Search property..."
            >

        </header>


        <main id="categories">

            <div id="error"></div>

        </main>


    </section>


    <!-- =====================================================
         BOTTOM 50%
    ====================================================== -->

    <section id="previewPanel">


        <header id="previewHeader">

            <strong>
                Live Preview
            </strong>

            <button id="resetButton">
                Reset
            </button>

        </header>


        <div id="preview">


            <div id="testArea">

                <div class="axis-x"></div>

                <div class="axis-y"></div>


                <div id="testDiv">
                    TEST DIV
                </div>

            </div>


            <div id="currentProperty">
                No property selected
            </div>


        </div>


    </section>


</div>


<script>

/* =========================================================
   FILE
========================================================= */

const JSON_FILE = "position-placement.json";


/* =========================================================
   ELEMENTS
========================================================= */

const categories =
    document.getElementById("categories");

const testDiv =
    document.getElementById("testDiv");

const currentProperty =
    document.getElementById("currentProperty");

const search =
    document.getElementById("search");

const resetButton =
    document.getElementById("resetButton");

const errorBox =
    document.getElementById("error");


/* =========================================================
   GLOBAL DATA
========================================================= */

let cssData = null;


/* =========================================================
   LOAD JSON
========================================================= */

async function loadJSON() {

    try {

        const response =
            await fetch(JSON_FILE);

        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        cssData =
            await response.json();


        renderJSON(cssData);


    } catch (error) {

        console.error(error);


        errorBox.style.display =
            "block";


        errorBox.innerHTML = `

            <strong>
                Failed to load ${JSON_FILE}
            </strong>

            <br><br>

            Make sure the JSON file is in
            the same folder as index.html.

            <br><br>

            Error:
            ${error.message}

            <br><br>

            If you opened index.html directly
            with file://, use Live Server.
        `;
    }
}


/* =========================================================
   RENDER JSON
========================================================= */

function renderJSON(data) {

    categories.innerHTML = "";

    errorBox.style.display = "none";


    if (!data || !data.groups) {

        showError(
            "Invalid JSON structure."
        );

        return;
    }


    /* POSITION */

    if (data.groups.position) {

        categories.appendChild(
            createCategory(
                "Position",
                [
                    createSelectProperty(
                        "position",
                        data.groups.position.values
                    )
                ]
            )
        );
    }


    /* INSETS */

    if (
        data.groups.insets &&
        data.groups.insets.properties
    ) {

        const properties = [];

        const insetProperties =
            data.groups.insets.properties;


        Object.entries(
            insetProperties
        ).forEach(
            ([name, property]) => {

                properties.push(
                    createLengthProperty(
                        name,
                        property
                    )
                );

            }
        );


        categories.appendChild(
            createCategory(
                "Insets",
                properties
            )
        );
    }


    /* Z INDEX */

    if (data.groups["z-index"]) {

        categories.appendChild(
            createCategory(
                "Z-Index",
                [
                    createZIndexProperty(
                        data.groups["z-index"]
                    )
                ]
            )
        );
    }


    /* ANCHOR POSITIONING */

    if (
        data.groups["anchor-positioning"]
    ) {

        const anchorProperties = [];


        Object.keys(
            data.groups[
                "anchor-positioning"
            ].properties || {}
        ).forEach(name => {

            anchorProperties.push(
                createTextProperty(
                    name
                )
            );

        });


        categories.appendChild(
            createCategory(
                "Anchor Positioning",
                anchorProperties
            )
        );
    }

}


/* =========================================================
   CREATE CATEGORY
========================================================= */

function createCategory(
    titleText,
    propertyElements
) {

    const category =
        document.createElement("div");

    category.className =
        "category";


    const title =
        document.createElement("div");

    title.className =
        "category-title";


    title.innerHTML = `

        <span>
            ${escapeHTML(titleText)}
        </span>

        <span class="arrow">
            ›
        </span>

    `;


    const content =
        document.createElement("div");

    content.className =
        "category-content";


    propertyElements.forEach(
        element => {

            content.appendChild(
                element
            );

        }
    );


    title.addEventListener(
        "click",
        () => {

            category.classList.toggle(
                "open"
            );

        }
    );


    category.appendChild(title);

    category.appendChild(content);


    return category;
}


/* =========================================================
   SELECT PROPERTY
========================================================= */

function createSelectProperty(
    propertyName,
    values
) {

    const element =
        createPropertyContainer(
            propertyName
        );


    const select =
        document.createElement("select");


    values.forEach(value => {

        const option =
            document.createElement("option");

        option.value = value;

        option.textContent = value;

        select.appendChild(option);

    });


    select.addEventListener(
        "change",
        () => {

            applyProperty(
                propertyName,
                select.value
            );

        }
    );


    element
        .querySelector(
            ".property-control"
        )
        .appendChild(select);


    return element;
}


/* =========================================================
   LENGTH PROPERTY
========================================================= */

function createLengthProperty(
    propertyName,
    property
) {

    const element =
        createPropertyContainer(
            propertyName
        );


    const control =
        element.querySelector(
            ".property-control"
        );


    const valueSet =
        cssData.valueSets[
            property.valueSet
        ];


    if (!valueSet) {

        return element;
    }


    /* =====================================================
       RANGE
    ===================================================== */

    const range =
        document.createElement("input");

    range.type = "range";

    range.min =
        valueSet.range.min;

    range.max =
        valueSet.range.max;

    range.step =
        valueSet.range.step;

    range.value =
        valueSet.range.default;


    /* =====================================================
       RANGE ROW
    ===================================================== */

    const rangeRow =
        document.createElement("div");

    rangeRow.className =
        "range-row";


    const rangeValue =
        document.createElement("div");

    rangeValue.className =
        "range-value";


    rangeValue.textContent =
        valueSet.range.default;


    rangeRow.appendChild(range);

    rangeRow.appendChild(rangeValue);


    control.appendChild(rangeRow);


    /* =====================================================
       UNIT
    ===================================================== */

    const unitRow =
        document.createElement("div");

    unitRow.className =
        "unit-row";


    const unitLabel =
        document.createElement("span");

    unitLabel.className =
        "unit-label";

    unitLabel.textContent =
        "Unit";


    const unitSelect =
        document.createElement("select");

    unitSelect.className =
        "unit-select";


    valueSet.units.forEach(unit => {

        const option =
            document.createElement("option");

        option.value = unit;

        option.textContent = unit;

        unitSelect.appendChild(option);

    });


    unitRow.appendChild(unitLabel);

    unitRow.appendChild(unitSelect);

    control.appendChild(unitRow);


    /* =====================================================
       FUNCTION BUTTONS
    ===================================================== */

    const functionTitle =
        document.createElement("div");

    functionTitle.className =
        "function-title";

    functionTitle.textContent =
        "Functions";


    control.appendChild(
        functionTitle
    );


    const functionButtons =
        document.createElement("div");

    functionButtons.className =
        "function-buttons";


    const functions =
        valueSet.functions || {};


    const functionInput =
        document.createElement("input");

    functionInput.type = "text";

    functionInput.className =
        "function-input";


    functionInput.style.display =
        "none";


    functionInput.placeholder =
        "Function value...";


    let selectedFunction = null;


    Object.entries(functions)
        .forEach(
            ([functionName, functionData]) => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type = "button";

                button.className =
                    "function-button";

                button.textContent =
                    functionName + "()";


                button.addEventListener(
                    "click",
                    () => {

                        const isActive =
                            button.classList.contains(
                                "active"
                            );


                        document
                            .querySelectorAll(
                                ".function-button"
                            )
                            .forEach(btn => {

                                btn.classList.remove(
                                    "active"
                                );

                            });


                        if (isActive) {

                            selectedFunction =
                                null;

                            functionInput.style.display =
                                "none";


                            updateLengthValue();


                            return;
                        }


                        button.classList.add(
                            "active"
                        );


                        selectedFunction =
                            functionName;


                        functionInput.style.display =
                            "block";


                        functionInput.placeholder =
                            functionData.placeholder;


                        functionInput.value =
                            getDefaultFunctionValue(
                                functionData.placeholder
                            );


                        updateLengthValue();

                    }
                );


                functionButtons.appendChild(
                    button
                );

            }
        );


    control.appendChild(
        functionButtons
    );


    /* =====================================================
       FUNCTION INPUT
    ===================================================== */

    control.appendChild(
        functionInput
    );


    /* =====================================================
       SPECIAL VALUES
    ===================================================== */

    const specialValues =
        valueSet.specialValues || [];


    if (specialValues.length) {

        const specialContainer =
            document.createElement("div");

        specialContainer.className =
            "special-values";


        specialValues.forEach(
            specialValue => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type = "button";

                button.className =
                    "special-button";

                button.textContent =
                    specialValue;


                button.addEventListener(
                    "click",
                    () => {

                        selectedFunction =
                            null;


                        document
                            .querySelectorAll(
                                ".function-button"
                            )
                            .forEach(btn => {

                                btn.classList.remove(
                                    "active"
                                );

                            });


                        functionInput.style.display =
                            "none";


                        applyProperty(
                            propertyName,
                            specialValue
                        );


                        rangeValue.textContent =
                            specialValue;

                    }
                );


                specialContainer.appendChild(
                    button
                );

            }
        );


        control.appendChild(
            specialContainer
        );
    }


    /* =====================================================
       UPDATE
    ===================================================== */

    function updateLengthValue() {

        const number =
            range.value;

        rangeValue.textContent =
            number;


        let finalValue =
            number +
            unitSelect.value;


        if (selectedFunction) {

            const data =
                functions[
                    selectedFunction
                ];


            let inside =
                functionInput.value.trim();


            if (!inside) {

                inside =
                    number +
                    unitSelect.value;
            }


            finalValue =
                data.template.replace(
                    "{value}",
                    inside
                );

        }


        applyProperty(
            propertyName,
            finalValue
        );
    }


    /* =====================================================
       EVENTS
    ===================================================== */

    range.addEventListener(
        "input",
        updateLengthValue
    );


    unitSelect.addEventListener(
        "change",
        updateLengthValue
    );


    functionInput.addEventListener(
        "input",
        updateLengthValue
    );


    /* =====================================================
       INITIAL VALUE
    ===================================================== */

    updateLengthValue();


    return element;
}


/* =========================================================
   Z INDEX
========================================================= */

function createZIndexProperty(
    property
) {

    const element =
        createPropertyContainer(
            "z-index"
        );


    const control =
        element.querySelector(
            ".property-control"
        );


    const rangeRow =
        document.createElement("div");

    rangeRow.className =
        "range-row";


    const range =
        document.createElement("input");

    range.type =
        "range";

    range.min =
        property.min;

    range.max =
        property.max;

    range.step =
        property.step;

    range.value =
        property.default ?? 0;


    const value =
        document.createElement("div");

    value.className =
        "range-value";

    value.textContent =
        range.value;


    range.addEventListener(
        "input",
        () => {

            value.textContent =
                range.value;

            applyProperty(
                "z-index",
                range.value
            );

        }
    );


    rangeRow.appendChild(range);

    rangeRow.appendChild(value);

    control.appendChild(rangeRow);


    /* SPECIAL VALUES */

    if (property.extraValues) {

        const container =
            document.createElement(
                "div"
            );

        container.className =
            "special-values";


        property.extraValues.forEach(
            special => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type = "button";

                button.className =
                    "special-button";

                button.textContent =
                    special;


                button.addEventListener(
                    "click",
                    () => {

                        applyProperty(
                            "z-index",
                            special
                        );

                        value.textContent =
                            special;

                    }
                );


                container.appendChild(
                    button
                );

            }
        );


        control.appendChild(
            container
        );
    }


    return element;
}


/* =========================================================
   TEXT PROPERTY
========================================================= */

function createTextProperty(
    propertyName
) {

    const element =
        createPropertyContainer(
            propertyName
        );


    const control =
        element.querySelector(
            ".property-control"
        );


    const input =
        document.createElement("input");

    input.type =
        "text";

    input.placeholder =
        "Enter value...";


    input.addEventListener(
        "input",
        () => {

            applyProperty(
                propertyName,
                input.value
            );

        }
    );


    control.appendChild(input);


    return element;
}


/* =========================================================
   PROPERTY CONTAINER
========================================================= */

function createPropertyContainer(
    propertyName
) {

    const element =
        document.createElement("div");

    element.className =
        "property";


    const name =
        document.createElement("div");

    name.className =
        "property-name";

    name.textContent =
        propertyName;


    const description =
        document.createElement("div");

    description.className =
        "property-description";


    description.textContent =
        getDescription(
            propertyName
        );


    const control =
        document.createElement("div");

    control.className =
        "property-control";


    element.appendChild(name);

    element.appendChild(description);

    element.appendChild(control);


    return element;
}


/* =========================================================
   DESCRIPTIONS
========================================================= */

function getDescription(
    property
) {

    const descriptions = {

        "position":
            "Specifies how an element is positioned.",

        "top":
            "Specifies the top offset of a positioned element.",

        "right":
            "Specifies the right offset of a positioned element.",

        "bottom":
            "Specifies the bottom offset of a positioned element.",

        "left":
            "Specifies the left offset of a positioned element.",

        "inset":
            "Sets top, right, bottom and left simultaneously.",

        "inset-block":
            "Sets the block-start and block-end offsets.",

        "inset-block-start":
            "Specifies the block-start offset.",

        "inset-block-end":
            "Specifies the block-end offset.",

        "inset-inline":
            "Sets the inline-start and inline-end offsets.",

        "inset-inline-start":
            "Specifies the inline-start offset.",

        "inset-inline-end":
            "Specifies the inline-end offset.",

        "z-index":
            "Controls the stacking order of an element.",

        "anchor-name":
            "Defines an anchor name for CSS Anchor Positioning.",

        "anchor-scope":
            "Limits the scope in which anchor names are visible.",

        "position-anchor":
            "Associates a positioned element with an anchor.",

        "position-area":
            "Specifies the position of an element relative to its anchor.",

        "position-try":

        "position-try-fallbacks":
            "Defines fallback positions for anchor positioning.",

        "position-try-order":

    };


    return descriptions[property] || "";
}


/* =========================================================
   APPLY PROPERTY
========================================================= */

function applyProperty(
    property,
    value
) {

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {

        return;
    }


    testDiv.style.setProperty(
        property,
        value
    );


    currentProperty.textContent =
        `${property}: ${value}`;
}

/* =========================================================
   SEARCH
========================================================= */

search.addEventListener(
    "input",
    () => {

        const query =
            search.value
                .toLowerCase()
                .trim();


        document
            .querySelectorAll(
                ".category"
            )
            .forEach(category => {

                const properties =
                    category.querySelectorAll(
                        ".property"
                    );


                let found = false;


                properties.forEach(
                    property => {

                        const name =
                            property
                                .querySelector(
                                    ".property-name"
                                )
                                .textContent
                                .toLowerCase();


                        if (
                            name.includes(query)
                        ) {

                            property.style.display =
                                "block";

                            found = true;

                        } else {

                            property.style.display =
                                "none";

                        }

                    }
                );


                if (
                    query &&
                    found
                ) {

                    category.classList.add(
                        "open"
                    );

                    category.style.display =
                        "block";

                }

                else if (
                    query &&
                    !found
                ) {

                    category.style.display =
                        "none";

                }

                else {

                    category.style.display =
                        "block";

                    properties.forEach(
                        property => {

                            property.style.display =
                                "block";

                        }
                    );

                }

            });

    }
);


/* =========================================================
   FUNCTION HELPER
========================================================= */

function getDefaultFunctionValue(
    placeholder
) {

    if (!placeholder) {
        return "";
    }


    const start =
        placeholder.indexOf("(");

    const end =
        placeholder.lastIndexOf(")");


    if (
        start !== -1 &&
        end !== -1
    ) {

        return placeholder.substring(
            start + 1,
            end
        );

    }


    return "";
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
) {

    errorBox.style.display =
        "block";

    errorBox.textContent =
        message;

    categories.appendChild(
        errorBox
    );
}
