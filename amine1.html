<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CSS Live Effect Laboratory</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:15px;
  background:#07101d;
  color:#e5e7eb;
  font-family:Arial,sans-serif;
}

h1{
  margin:0 0 15px;
  font-size:22px;
}

.panel{
  background:#0d1726;
  border:1px solid #26364d;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

input,
select{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:1px solid #334155;
  border-radius:8px;
  background:#08111f;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#3b82f6;
}

.status{
  padding:12px;
  border-radius:8px;
  margin-top:5px;
  font-weight:bold;
  text-align:center;
}

.status.green{
  background:#064e3b;
  color:#86efac;
  border:1px solid #16a34a;
}

.status.orange{
  background:#7c2d12;
  color:#fdba74;
  border:1px solid #f97316;
}

.preview{
  height:350px;
  position:relative;
  overflow:hidden;
  border:2px dashed #334155;
  border-radius:10px;
  background:
    linear-gradient(45deg,#111827 25%,transparent 25%),
    linear-gradient(-45deg,#111827 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#111827 75%),
    linear-gradient(-45deg,transparent 75%,#111827 75%);
  background-size:30px 30px;
  background-position:0 0,0 15px,15px -15px,-15px 0;
}

#testTarget{
  width:150px;
  height:150px;

  position:relative;

  left:0;
  top:0;

  background:#2563eb;
  color:white;

  border:3px solid #111827;
  padding:10px;

  display:block;

  box-sizing:border-box;

  transition:
    left .15s,
    top .15s,
    width .15s,
    height .15s,
    transform .15s,
    opacity .15s;
}

.targetText{
  font-size:14px;
  font-weight:bold;
  text-align:center;
  margin-top:35px;
}

.info{
  margin-top:12px;
  font-size:13px;
  color:#94a3b8;
  line-height:1.7;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.result{
  margin-top:10px;
  padding:10px;
  background:#020617;
  border-radius:8px;
  font-family:monospace;
  direction:ltr;
  text-align:left;
  font-size:13px;
  overflow:auto;
}

</style>
</head>

<body>

<h1>CSS Real Effect Laboratory</h1>

<div class="panel">

  <label for="property">CSS Property</label>

  <input
    id="property"
    list="propertyList"
    value="left"
    placeholder="مثلاً: left"
    autocomplete="off"
  >

  <datalist id="propertyList">

    <option value="left">
    <option value="right">
    <option value="top">
    <option value="bottom">

    <option value="width">
    <option value="height">

    <option value="margin">
    <option value="margin-left">
    <option value="margin-right">
    <option value="margin-top">
    <option value="margin-bottom">

    <option value="padding">
    <option value="padding-left">
    <option value="padding-right">
    <option value="padding-top">
    <option value="padding-bottom">

    <option value="position">

    <option value="display">
    <option value="visibility">
    <option value="opacity">

    <option value="transform">
    <option value="rotate">
    <option value="scale">

    <option value="background">
    <option value="background-color">
    <option value="color">

    <option value="border">
    <option value="border-width">
    <option value="border-radius">

    <option value="font-size">
    <option value="font-weight">
    <option value="line-height">
    <option value="text-align">

    <option value="overflow">
    <option value="z-index">

    <option value="flex">
    <option value="flex-direction">
    <option value="justify-content">
    <option value="align-items">

    <option value="grid-template-columns">
    <option value="grid-template-rows">
    <option value="grid-column">
    <option value="grid-row">

  </datalist>


  <label for="value">CSS Value</label>

  <input
    id="value"
    value="150px"
    placeholder="مثلاً: 150px"
    autocomplete="off"
  >

  <div id="status" class="status green">
    جاري الاختبار...
  </div>

  <div class="result" id="result">
    property: left
    value: 150px
  </div>

</div>


<div class="panel">

  <div class="preview" id="preview">

    <div id="testTarget">

      <div class="targetText">
        TEST DIV<br>
        150 × 150
      </div>

    </div>

  </div>

  <div class="info">
    غيّر الخاصية أو القيمة وستُطبق مباشرة على العنصر.
    النظام يقارن حالة العنصر قبل وبعد تطبيق CSS لمعرفة هل حدث تأثير.
  </div>

</div>


<script>

const propertyInput =
  document.getElementById("property");

const valueInput =
  document.getElementById("value");

const target =
  document.getElementById("testTarget");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");


/*
=====================================================
  PROPERTIES THAT REQUIRE A CONTEXT
=====================================================
*/

const contextRules = {

  "left": el =>
    getComputedStyle(el).position !== "static",

  "right": el =>
    getComputedStyle(el).position !== "static",

  "top": el =>
    getComputedStyle(el).position !== "static",

  "bottom": el =>
    getComputedStyle(el).position !== "static",

  "z-index": el =>
    getComputedStyle(el).position !== "static",

  "grid-template-columns": el =>
    ["grid","inline-grid"].includes(
      getComputedStyle(el).display
    ),

  "grid-template-rows": el =>
    ["grid","inline-grid"].includes(
      getComputedStyle(el).display
    ),

  "grid-column": el =>
    ["grid","inline-grid"].includes(
      getComputedStyle(el).display
    ),

  "grid-row": el =>
    ["grid","inline-grid"].includes(
      getComputedStyle(el).display
    ),

  "justify-content": el => {

    const display =
      getComputedStyle(el).display;

    return [
      "flex",
      "inline-flex",
      "grid",
      "inline-grid"
    ].includes(display);

  },

  "align-items": el => {

    const display =
      getComputedStyle(el).display;

    return [
      "flex",
      "inline-flex",
      "grid",
      "inline-grid"
    ].includes(display);

  },

  "flex-direction": el => {

    const display =
      getComputedStyle(el).display;

    return [
      "flex",
      "inline-flex"
    ].includes(display);

  }

};


/*
=====================================================
  SAVE INITIAL STATE
=====================================================
*/

const initialStyle = target.getAttribute("style") || "";


/*
=====================================================
  GET GEOMETRY
=====================================================
*/

function getGeometry(){

  const r =
    target.getBoundingClientRect();

  return {

    left:r.left,
    top:r.top,
    width:r.width,
    height:r.height,
    right:r.right,
    bottom:r.bottom

  };

}


/*
=====================================================
  GET COMPUTED STYLE
=====================================================
*/

function getImportantState(){

  const cs =
    getComputedStyle(target);

  return {

    display:cs.display,

    position:cs.position,

    width:cs.width,

    height:cs.height,

    marginTop:cs.marginTop,
    marginRight:cs.marginRight,
    marginBottom:cs.marginBottom,
    marginLeft:cs.marginLeft,

    paddingTop:cs.paddingTop,
    paddingRight:cs.paddingRight,
    paddingBottom:cs.paddingBottom,
    paddingLeft:cs.paddingLeft,

    color:cs.color,

    backgroundColor:
      cs.backgroundColor,

    opacity:cs.opacity,

    transform:cs.transform,

    fontSize:cs.fontSize,

    fontWeight:cs.fontWeight,

    lineHeight:cs.lineHeight,

    visibility:cs.visibility

  };

}


/*
=====================================================
  COMPARE OBJECTS
=====================================================
*/

function objectsDifferent(a,b){

  for(const key in a){

    if(a[key] !== b[key]){
      return true;
    }

  }

  return false;

}


/*
=====================================================
  RESET
=====================================================
*/

function resetTarget(){

  target.setAttribute(
    "style",
    initialStyle
  );

}


/*
=====================================================
  TEST CSS
=====================================================
*/

function testCSS(){

  const property =
    propertyInput.value.trim();

  const value =
    valueInput.value.trim();


  if(!property){

    status.className =
      "status orange";

    status.textContent =
      "اكتب CSS Property";

    return;

  }


  if(!value){

    resetTarget();

    status.className =
      "status orange";

    status.textContent =
      "أدخل قيمة CSS";

    return;

  }


  /*
  ---------------------------------------------
  BEFORE
  ---------------------------------------------
  */

  resetTarget();


  const beforeGeometry =
    getGeometry();

  const beforeStyle =
    getImportantState();


  /*
  ---------------------------------------------
  CONTEXT TEST
  ---------------------------------------------
  */

  const rule =
    contextRules[property];

  let contextValid = true;

  if(rule){

    try{

      contextValid =
        rule(target);

    }catch(e){

      contextValid = true;

    }

  }


  /*
  ---------------------------------------------
  APPLY PROPERTY
  ---------------------------------------------
  */

  target.style.setProperty(
    property,
    value
  );


  /*
  Force browser layout
  */

  void target.offsetWidth;


  /*
  ---------------------------------------------
  AFTER
  ---------------------------------------------
  */

  const afterGeometry =
    getGeometry();

  const afterStyle =
    getImportantState();


  /*
  ---------------------------------------------
  CHECK WHETHER CSS IS VALID
  ---------------------------------------------
  */

  const computed =
    getComputedStyle(target);

  const computedValue =
    computed.getPropertyValue(property);


  const invalidValue =
    computedValue === "";


  /*
  ---------------------------------------------
  GEOMETRY CHANGE
  ---------------------------------------------
  */

  const geometryChanged =

    beforeGeometry.left !== afterGeometry.left ||

    beforeGeometry.top !== afterGeometry.top ||

    beforeGeometry.width !== afterGeometry.width ||

    beforeGeometry.height !== afterGeometry.height ||

    beforeGeometry.right !== afterGeometry.right ||

    beforeGeometry.bottom !== afterGeometry.bottom;


  /*
  ---------------------------------------------
  STYLE CHANGE
  ---------------------------------------------
  */

  const styleChanged =
    objectsDifferent(
      beforeStyle,
      afterStyle
    );


  /*
  ---------------------------------------------
  FINAL RESULT
  ---------------------------------------------
  */

  const effective =

    !invalidValue &&

    contextValid &&

    (
      geometryChanged ||
      styleChanged
    );


  /*
  ---------------------------------------------
  STATUS
  ---------------------------------------------
  */

  if(effective){

    status.className =
      "status green";

    status.textContent =
      "✓ مؤثرة فعلياً على العنصر";

  }else{

    status.className =
      "status orange";

    if(invalidValue){

      status.textContent =
        "✗ القيمة غير صالحة لهذه الخاصية";

    }else if(!contextValid){

      status.textContent =
        "✗ الخاصية لا تعمل في هذا السياق";

    }else{

      status.textContent =
        "✗ لا يوجد تأثير فعلي على العنصر";

    }

  }


  /*
  ---------------------------------------------
  RESULT INFORMATION
  ---------------------------------------------
  */

  result.textContent =

`property: ${property}
value: ${value}
computed: ${computedValue}
geometry changed: ${geometryChanged}
style changed: ${styleChanged}
context valid: ${contextValid}
effective: ${effective}`;


}


/*
=====================================================
  LIVE PREVIEW
=====================================================
*/

propertyInput.addEventListener(
  "input",
  testCSS
);

valueInput.addEventListener(
  "input",
  testCSS
);


/*
=====================================================
  FIRST TEST
=====================================================
*/

testCSS();

</script>

</body>
</html>
