<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSS Value Extractor</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:15px;
    background:#07101d;
    color:#e8eef7;
    font-family:Arial,sans-serif;
}

h2{
    margin:0 0 12px;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 14px;
    margin:3px;
    font-weight:bold;
    cursor:pointer;
}

#loadBtn{background:#2563eb;color:white}
#startBtn{background:#16a34a;color:white}
#stopBtn{background:#dc2626;color:white}
#exportBtn{background:#9333ea;color:white}

#file{
    display:none;
}

.box{
    background:#0d1729;
    border:1px solid #26354d;
    border-radius:10px;
    padding:12px;
    margin-top:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
}

.stat{
    background:#111d31;
    border-radius:8px;
    padding:10px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:20px;
    margin-bottom:3px;
}

#status{
    white-space:pre-wrap;
    line-height:1.5;
    color:#b8c7dc;
}

#output{
    width:100%;
    min-height:400px;
    background:#050b14;
    color:#b9f6ca;
    border:1px solid #26354d;
    border-radius:8px;
    padding:10px;
    font-family:monospace;
    font-size:12px;
}

@media(max-width:600px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<h2>CSS Value Extractor</h2>

<div class="box">

<input
    id="file"
    type="file"
    accept=".json,application/json"
>

<button id="loadBtn">
LOAD JSON
</button>

<button id="startBtn" disabled>
START VALUES
</button>

<button id="stopBtn" disabled>
STOP
</button>

<button id="exportBtn" disabled>
EXPORT
</button>

</div>

<div class="box stats">

<div class="stat">
<b id="properties">0</b>
Properties
</div>

<div class="stat">
<b id="types">0</b>
Types
</div>

<div class="stat">
<b id="functions">0</b>
Functions
</div>

<div class="stat">
<b id="original">0</b>
Original values
</div>

<div class="stat">
<b id="pool">0</b>
Value pool
</div>

<div class="stat">
<b id="tests">0</b>
Tests
</div>

<div class="stat">
<b id="trueCount">0</b>
TRUE
</div>

<div class="stat">
<b id="shown">0</b>
Shown
</div>

</div>

<div class="box">
<div id="status">
اختر all-css.json ثم اضغط LOAD JSON
</div>
</div>

<div class="box">
<textarea
    id="output"
    readonly
    placeholder="النتائج ستظهر هنا..."
></textarea>
</div>

<script>

/* =========================================================
   GLOBAL DATA
========================================================= */

let DATA = null;

let PROPERTIES = [];
let TYPES = {};
let FUNCTIONS = {};

let RESULTS = {};
let VALUE_POOL = new Set();

let stopped = false;
let running = false;

let originalCount = 0;
let testCount = 0;
let trueCount = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const fileInput  = document.getElementById("file");
const loadBtn    = document.getElementById("loadBtn");
const startBtn   = document.getElementById("startBtn");
const stopBtn    = document.getElementById("stopBtn");
const exportBtn  = document.getElementById("exportBtn");

const statusEl   = document.getElementById("status");
const outputEl   = document.getElementById("output");


/* =========================================================
   FILE SELECT
========================================================= */

loadBtn.onclick = () => {
    fileInput.click();
};


/* =========================================================
   LOAD JSON
========================================================= */

fileInput.onchange = async () => {

    const file = fileInput.files[0];

    if(!file){
        return;
    }

    statusEl.textContent =
        "جار تحميل الملف...\n" +
        file.name + "\n" +
        Math.round(file.size / 1024 / 1024 * 100) / 100 +
        " MB";

    try{

        /*
           text() هنا أسرع وأبسط من محاولة
           معالجة الملف أثناء القراءة.
        */

        const text = await file.text();

        statusEl.textContent =
            "تم تحميل النص.\nجار تحليل JSON...";

        /*
           نترك المتصفح يرسم الحالة أولاً
           قبل JSON.parse حتى لا تبدو الصفحة متجمدة.
        */

        await new Promise(r => setTimeout(r,20));

        DATA = JSON.parse(text);

        normalizeData();

        updateStats();

        startBtn.disabled = false;

        statusEl.textContent =
            "تم LOAD بنجاح.\n\n" +
            "Properties: " + PROPERTIES.length + "\n" +
            "Types: " + Object.keys(TYPES).length + "\n" +
            "Functions: " + Object.keys(FUNCTIONS).length +
            "\n\nلم يتم استخراج القيم بعد.\n" +
            "اضغط START VALUES.";

    }catch(err){

        console.error(err);

        statusEl.textContent =
            "خطأ في تحميل JSON:\n" +
            err.message;
    }
};


/* =========================================================
   NORMALIZE DATA
========================================================= */

function normalizeData(){

    PROPERTIES = [];
    TYPES = {};
    FUNCTIONS = {};

    /*
       Properties
    */

    if(Array.isArray(DATA.properties)){
        PROPERTIES = DATA.properties;
    }

    /*
       Types قد تكون:
       array
       object
       أو داخل DATA.types
    */

    if(Array.isArray(DATA.types)){

        for(const t of DATA.types){

            if(!t) continue;

            const name =
                t.name ||
                t.type ||
                t.id;

            if(name){
                TYPES[name] = t;
            }
        }

    }else if(
        DATA.types &&
        typeof DATA.types === "object"
    ){

        for(const [name,t] of Object.entries(DATA.types)){

            TYPES[name] = t;
        }
    }


    /*
       Functions
    */

    if(Array.isArray(DATA.functions)){

        for(const f of DATA.functions){

            if(!f) continue;

            const name =
                f.name ||
                f.function ||
                f.id;

            if(name){
                FUNCTIONS[name] = f;
            }
        }

    }else if(
        DATA.functions &&
        typeof DATA.functions === "object"
    ){

        FUNCTIONS = DATA.functions;
    }
}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    document.getElementById("properties").textContent =
        PROPERTIES.length;

    document.getElementById("types").textContent =
        Object.keys(TYPES).length;

    document.getElementById("functions").textContent =
        Object.keys(FUNCTIONS).length;

    document.getElementById("original").textContent =
        originalCount;

    document.getElementById("pool").textContent =
        VALUE_POOL.size;

    document.getElementById("tests").textContent =
        testCount;

    document.getElementById("trueCount").textContent =
        trueCount;

    document.getElementById("shown").textContent =
        Object.keys(RESULTS).length;
}


/* =========================================================
   STRING HELPERS
========================================================= */

function cleanName(name){

    if(!name) return "";

    return String(name)
        .trim()
        .replace(/^<|>$/g,"");
}


function addValue(set,value){

    if(value === null || value === undefined){
        return;
    }

    value = String(value).trim();

    if(!value){
        return;
    }

    /*
       لا نريد أسماء Types نفسها كقيم.
    */

    if(
        value.startsWith("<") &&
        value.endsWith(">")
    ){
        return;
    }

    /*
       لا نضيف الرموز النحوية.
    */

    if(
        value === "|" ||
        value === "/" ||
        value === "?" ||
        value === "#" ||
        value === "*" ||
        value === "+" ||
        value === "," ||
        value === "["
    ){
        return;
    }

    set.add(value);
}


/* =========================================================
   EXTRACT LITERAL TOKENS
========================================================= */

function extractLiterals(syntax){

    const result = new Set();

    if(!syntax || typeof syntax !== "string"){
        return result;
    }

    /*
       نحذف ranges مثل:
       <integer [1,∞]>
       لكن لا نحذف الـ type نفسه.
    */

    let s = syntax;

    /*
       إزالة comments
    */

    s = s.replace(/\/\*[\s\S]*?\*\//g," ");

    /*
       استخراج الكلمات الموجودة خارج <>
    */

    let inside = false;
    let token = "";

    for(let i=0;i<s.length;i++){

        const ch = s[i];

        if(ch === "<"){
            inside = true;

            if(token.trim()){
                parsePlainTokens(token,result);
            }

            token = "";
            continue;
        }

        if(ch === ">"){
            inside = false;
            token = "";
            continue;
        }

        if(!inside){
            token += ch;
        }
    }

    if(token.trim()){
        parsePlainTokens(token,result);
    }

    return result;
}


/* =========================================================
   PLAIN TOKEN PARSER
========================================================= */

function parsePlainTokens(text,result){

    /*
       الأقواس النحوية ليست قيم.
    */

    text = text
        .replace(/\[/g," ")
        .replace(/\]/g," ")
        .replace(/\(/g," ")
        .replace(/\)/g," ")
        .replace(/\{/g," ")
        .replace(/\}/g," ");

    /*
       فصل | و || والمسافات والفواصل.
    */

    const parts = text.split(
        /\s+|\|\||\||,|\/|#|\?|\+|\*/g
    );

    for(let part of parts){

        part = part.trim();

        if(!part){
            continue;
        }

        /*
           تجاهل أسماء grammar
        */

        if(
            part === "and" ||
            part === "or" ||
            part === "to"
        ){
            continue;
        }

        addValue(result,part);
    }
}


/* =========================================================
   TYPE RESOLUTION
========================================================= */

const resolving = new Set();


function findType(name){

    name = cleanName(name);

    if(!name){
        return null;
    }

    if(TYPES[name]){
        return TYPES[name];
    }

    /*
       بعض الملفات تستخدم الاسم بدون <>
    */

    const variants = [
        "<" + name + ">",
        name.toLowerCase()
    ];

    for(const v of variants){

        if(TYPES[v]){
            return TYPES[v];
        }
    }

    /*
       بحث أخير غير حساس لحالة الأحرف
    */

    const lower = name.toLowerCase();

    for(const key of Object.keys(TYPES)){

        if(
            cleanName(key).toLowerCase() === lower
        ){
            return TYPES[key];
        }
    }

    return null;
}


/* =========================================================
   GET SYNTAX FROM TYPE
========================================================= */

function typeSyntax(type){

    if(!type){
        return "";
    }

    if(typeof type === "string"){
        return type;
    }

    return (
        type.syntax ||
        type.value ||
        type.definition ||
        type.grammar ||
        ""
    );
}


/* =========================================================
   EXTRACT FROM TYPE RECURSIVELY
========================================================= */

function extractType(name,out){

    name = cleanName(name);

    if(!name){
        return;
    }

    /*
       منع recursion لا نهائي
    */

    if(resolving.has(name)){
        return;
    }

    const type = findType(name);

    if(!type){
        return;
    }

    resolving.add(name);

    const syntax = typeSyntax(type);

    if(syntax){

        /*
           1. القيم المباشرة
        */

        for(const value of extractLiterals(syntax)){
            addValue(out,value);
        }

        /*
           2. استخراج كل <type>
           الموجود داخل syntax
        */

        const refs = syntax.match(
            /<[^<>]+>/g
        ) || [];

        for(const ref of refs){

            const refName =
                cleanName(ref);

            /*
               تجاهل الأنواع التي هي
               primitive وليست definitions.
            */

            if(findType(refName)){

                extractType(
                    refName,
                    out
                );
            }
        }
    }

    resolving.delete(name);
}


/* =========================================================
   EXTRACT ALL VALUES FOR PROPERTY
========================================================= */

function extractPropertyValues(property){

    const values = new Set();

    if(!property){
        return values;
    }

    /*
       ======================================================
       1. syntax الخاصية
       ======================================================
    */

    const syntax = property.syntax;

    if(syntax){

        /*
           القيم المباشرة
        */

        for(const value of extractLiterals(syntax)){

            addValue(values,value);
        }

        /*
           Types المشار إليها
        */

        const refs =
            syntax.match(/<[^<>]+>/g) || [];

        for(const ref of refs){

            const name =
                cleanName(ref);

            if(findType(name)){

                extractType(
                    name,
                    values
                );
            }
        }
    }


    /*
       ======================================================
       2. initial
       ======================================================
    */

    if(
        property.initial !== null &&
        property.initial !== undefined
    ){

        if(typeof property.initial === "string"){

            addValue(
                values,
                property.initial
            );
        }
    }


    /*
       ======================================================
       3. computedValue
       ======================================================
    */

    if(
        property.computedValue !== null &&
        property.computedValue !== undefined &&
        typeof property.computedValue === "string"
    ){

        /*
           فقط إذا كان قيمة فعلية
           وليس وصفاً مثل:
           "as specified"
        */

        const cv =
            property.computedValue.trim();

        if(
            cv &&
            !cv.includes("specified") &&
            !cv.includes("individual properties")
        ){

            addValue(values,cv);
        }
    }


    return values;
}


/* =========================================================
   FUNCTION EXTRACTION
   ========================================================= */

function extractFunctionValues(out){

    /*
       لا نقوم بتوليد combinations.
       نأخذ فقط ما هو موجود فعلياً في DATA.functions.
    */

    for(const [name,fn] of Object.entries(FUNCTIONS)){

        if(!fn) continue;

        let syntax = "";

        if(typeof fn === "string"){
            syntax = fn;
        }else{

            syntax =
                fn.syntax ||
                fn.value ||
                fn.definition ||
                fn.grammar ||
                "";
        }

        /*
           اسم function نفسه
        */

        if(name){

            const n = String(name).trim();

            if(
                n.endsWith("()") &&
                n.length > 2
            ){
                addValue(out,n);
            }
        }

        /*
           القيم الحرفية داخل syntax
        */

        if(syntax){

            for(const value of extractLiterals(syntax)){
                addValue(out,value);
            }

            /*
               Types داخل function
            */

            const refs =
                syntax.match(/<[^<>]+>/g) || [];

            for(const ref of refs){

                const typeName =
                    cleanName(ref);

                if(findType(typeName)){

                    extractType(
                        typeName,
                        out
                    );
                }
            }
        }
    }
}


/* =========================================================
   COLLECT GLOBAL VALUE POOL
   ========================================================= */

function buildValuePool(){

    VALUE_POOL.clear();

    /*
       لا نضيف كل شيء بشكل عشوائي.
       الـpool يتكون فقط من القيم التي استخرجناها
       فعلياً من Properties / Types / Functions.
    */

    for(const values of Object.values(RESULTS)){

        for(const value of values){

            VALUE_POOL.add(value);
        }
    }
}


/* =========================================================
   PROCESS ONE PROPERTY
   ========================================================= */

function processProperty(index){

    if(stopped){
        return;
    }

    const property =
        PROPERTIES[index];

    if(!property){
        return;
    }

    const name =
        property.name;

    if(!name){
        return;
    }

    const values =
        extractPropertyValues(property);

    RESULTS[name] =
        Array.from(values);

    /*
       Original values =
       عدد القيم المستخرجة مباشرة من
       تعريفات properties/types/functions.
    */

    originalCount += values.size;

    /*
       pool
    */

    for(const value of values){

        VALUE_POOL.add(value);
    }
}


/* =========================================================
   BATCH PROCESSOR
   ========================================================= */

async function processAllProperties(){

    running = true;
    stopped = false;

    stopBtn.disabled = false;
    startBtn.disabled = true;
    exportBtn.disabled = true;

    RESULTS = {};
    VALUE_POOL.clear();

    originalCount = 0;
    testCount = 0;
    trueCount = 0;

    /*
       أولاً نستخرج القيم من Properties.
    */

    for(
        let i = 0;
        i < PROPERTIES.length;
        i++
    ){

        if(stopped){
            break;
        }

        processProperty(i);

        /*
           تحديث الواجهة كل 10 خصائص
           بدلاً من تحديثها بعد كل قيمة.
        */

        if(
            i % 10 === 0 ||
            i === PROPERTIES.length - 1
        ){

            statusEl.textContent =
                "استخراج القيم...\n\n" +
                "Property: " +
                (i + 1) +
                " / " +
                PROPERTIES.length +
                "\n\n" +
                "Original values: " +
                originalCount +
                "\n" +
                "Value pool: " +
                VALUE_POOL.size;

            updateStats();

            /*
               إعطاء المتصفح فرصة للرسم.
            */

            await new Promise(
                requestAnimationFrame
            );
        }
    }


    /*
       إذا ضغط STOP لا نكمل.
    */

    if(stopped){

        running = false;

        stopBtn.disabled = true;
        startBtn.disabled = false;

        statusEl.textContent =
            "تم إيقاف الاستخراج.\n\n" +
            "تم استخراج: " +
            Object.keys(RESULTS).length +
            " properties.";

        updateStats();

        return;
    }


    /*
       ======================================================
       FUNCTIONS
       ======================================================

       نستخرج معلومات functions إلى
       Value Pool فقط.

       لا يتم توليد:
       ملايين combinations
       ولا Cartesian Product.
       ======================================================
    */

    const functionValues =
        new Set();

    extractFunctionValues(
        functionValues
    );

    for(const value of functionValues){

        VALUE_POOL.add(value);
    }


    updateStats();


    /*
       ======================================================
       FINAL
       ======================================================
    */

    running = false;

    stopBtn.disabled = true;
    startBtn.disabled = false;
    exportBtn.disabled = false;

    statusEl.textContent =
        "اكتمل استخراج القيم.\n\n" +

        "Properties: " +
        PROPERTIES.length +

        "\nTypes: " +
        Object.keys(TYPES).length +

        "\nFunctions: " +
        Object.keys(FUNCTIONS).length +

        "\n\nOriginal values: " +
        originalCount +

        "\nValue pool: " +
        VALUE_POOL.size +

        "\n\nلم يتم توليد combinations.";
    
    updateStats();

    renderResults();
}


/* =========================================================
   START
   ========================================================= */

startBtn.onclick = async () => {

    if(!DATA){
        statusEl.textContent =
            "حمّل all-css.json أولاً.";
        return;
    }

    if(running){
        return;
    }

    await processAllProperties();
};


/* =========================================================
   STOP
   ========================================================= */

stopBtn.onclick = () => {

    if(!running){
        return;
    }

    stopped = true;

    statusEl.textContent +=
        "\n\nإيقاف بعد انتهاء الدفعة الحالية...";
};


/* =========================================================
   RENDER RESULTS
   ========================================================= */

function renderResults(){

    const output = {};

    /*
       نعرض كل Property وقيمها.
    */

    for(const property of PROPERTIES){

        const name =
            property.name;

        if(!name){
            continue;
        }

        output[name] =
            RESULTS[name] || [];
    }

    /*
       JSON جميل ولكن لا نضع ملايين
       النصوص في DOM.
    */

    const json =
        JSON.stringify(
            output,
            null,
            2
        );

    outputEl.value = json;

    /*
       Shown = عدد الخصائص التي ظهرت
    */

    document.getElementById("shown")
        .textContent =
        Object.keys(output).length;

    updateStats();
}


/* =========================================================
   EXPORT JSON
   ========================================================= */

exportBtn.onclick = () => {

    if(
        !RESULTS ||
        Object.keys(RESULTS).length === 0
    ){

        alert(
            "لا توجد نتائج للتصدير."
        );

        return;
    }

    const output = {};

    for(const property of PROPERTIES){

        const name =
            property.name;

        if(!name){
            continue;
        }

        output[name] =
            RESULTS[name] || [];
    }


    /*
       معلومات إضافية في الملف.
    */

    const finalData = {

        meta: {

            properties:
                PROPERTIES.length,

            types:
                Object.keys(TYPES).length,

            functions:
                Object.keys(FUNCTIONS).length,

            originalValues:
                originalCount,

            valuePool:
                VALUE_POOL.size,

            generatedCombinations:
                0,

            generatedMillions:
                false
        },

        properties:
            output
    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    finalData,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "css-values-extracted.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        () => URL.revokeObjectURL(url),
        1000
    );
};


/* =========================================================
   INITIAL UI
   ========================================================= */

updateStats();

</script>

</body>
</html>
