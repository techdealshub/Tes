<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Display Keyword Search</title>

<style>

#found {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    background: black;
    color: lime;
    font-size: 18px;
    font-weight: bold;
    z-index: 999999;
}

#status {
    position: fixed;
    top: 55px;
    left: 0;
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    background: #222;
    color: white;
    z-index: 999998;
}

</style>
</head>

<body>

<div id="found">
    VALID: —
</div>

<div id="status">
    STARTING...
</div>

<script>

const PROPERTY = "display";

const MIN_LENGTH = 3;
const MAX_LENGTH = 18;

const BATCH = 10000;


/* =========================================
   الحروف فقط
========================================= */

const CHARS =
    "abcdefghijklmnopqrstuvwxyz";

const BASE =
    CHARS.length;


/* =========================================
   حالة البحث
========================================= */

let length = MIN_LENGTH;

let mode = 0;

let number = 0;

let tested = 0;

const found =
    new Set();


const foundBox =
    document.getElementById("found");

const statusBox =
    document.getElementById("status");


/* =========================================
   عدد الاحتمالات بدون -
========================================= */

function totalNormal(length) {

    return BASE ** length;

}


/* =========================================
   عدد الاحتمالات بشرطة واحدة
========================================= */

function totalDash(length) {

    let total = 0;

    for (
        let dash = 1;
        dash < length;
        dash++
    ) {

        total +=
            BASE ** (length - 1);
    }

    return total;
}


/* =========================================
   رقم → كلمة بدون -
========================================= */

function makeNormal(
    number,
    length
) {

    let value = "";

    for (
        let i = 0;
        i < length;
        i++
    ) {

        value =
            CHARS[
                number % BASE
            ] +
            value;

        number =
            Math.floor(
                number / BASE
            );
    }

    return value;
}


/* =========================================
   رقم → كلمة بشرطة واحدة
========================================= */

function makeDash(
    number,
    length
) {

    /*
     * اختيار مكان الشرطة
     */

    const combinations =
        BASE ** (length - 1);

    const dashPosition =
        Math.floor(
            number / combinations
        ) + 1;


    number =
        number % combinations;


    let value = "";

    let letters =
        length - 1;


    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (
            i === dashPosition
        ) {

            value += "-";

            continue;
        }


        value =
            CHARS[
                number % BASE
            ] +
            value;

        number =
            Math.floor(
                number / BASE
            );
    }


    /*
     * الطريقة السابقة تبني
     * من اليمين، لذلك نعيد
     * بناء القيمة بشكل مضمون
     */

    value = "";

    let n = number;

    /*
     * نستخدم رقمًا مستقلًا
     * لتوليد الحروف
     */

    const chars = [];

    for (
        let i = 0;
        i < letters;
        i++
    ) {

        chars.unshift(
            CHARS[
                n % BASE
            ]
        );

        n =
            Math.floor(
                n / BASE
            );
    }


    let index = 0;

    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (
            i === dashPosition
        ) {

            value += "-";

        } else {

            value +=
                chars[index++];
        }
    }


    return value;
}


/* =========================================
   اختبار
========================================= */

function test(value) {

    tested++;


    if (
        CSS.supports(
            PROPERTY,
            value
        )
    ) {

        if (
            !found.has(value)
        ) {

            found.add(value);


            console.log(
                "%cVALID DISPLAY → " + value,
                "color:lime;font-size:20px;font-weight:bold"
            );


            foundBox.textContent =
                "VALID DISPLAY → " +
                value;
        }
    }
}


/* =========================================
   البحث
========================================= */

function search() {

    /*
     * -------------------------------------
     * MODE 0
     * بدون شرطة
     * -------------------------------------
     */

    if (
        mode === 0
    ) {

        const total =
            totalNormal(length);


        const end =
            Math.min(
                number + BATCH,
                total
            );


        for (
            ;
            number < end;
            number++
        ) {

            test(
                makeNormal(
                    number,
                    length
                )
            );
        }


        statusBox.textContent =

            "PROPERTY: " +
            PROPERTY +

            " | LENGTH: " +
            length +

            " | MODE: NO -" +

            " | TESTED: " +
            tested.toLocaleString() +

            " | FOUND: " +
            found.size;


        /*
         * ما زال هناك
         * احتمالات
         */

        if (
            number < total
        ) {

            setTimeout(
                search,
                0
            );

            return;
        }


        /*
         * انتهى بدون -
         */

        console.log(
            "FINISHED NO-DASH:",
            length
        );


        /*
         * نبدأ الشرطة الواحدة
         */

        mode = 1;

        number = 0;

        setTimeout(
            search,
            0
        );

        return;
    }


    /*
     * -------------------------------------
     * MODE 1
     * شرطة واحدة
     * -------------------------------------
     */

    const total =
        totalDash(length);


    const end =
        Math.min(
            number + BATCH,
            total
        );


    for (
        ;
        number < end;
        number++
    ) {

        test(
            makeDash(
                number,
                length
            )
        );
    }


    statusBox.textContent =

        "PROPERTY: " +
        PROPERTY +

        " | LENGTH: " +
        length +

        " | MODE: ONE -" +

        " | TESTED: " +
        tested.toLocaleString() +

        " | FOUND: " +
        found.size;


    /*
     * ما زال هناك
     * احتمالات
     */

    if (
        number < total
    ) {

        setTimeout(
            search,
            0
        );

        return;
    }


    /*
     * انتهى هذا الطول
     */

    console.log(
        "FINISHED LENGTH:",
        length
    );


    length++;

    number = 0;

    mode = 0;


    /*
     * الطول التالي
     */

    if (
        length <= MAX_LENGTH
    ) {

        setTimeout(
            search,
            0
        );

        return;
    }


    /* =====================================
       النهاية
    ===================================== */

    console.log(
        "================================"
    );

    console.log(
        "FINISHED"
    );

    console.log(
        "PROPERTY:",
        PROPERTY
    );

    console.log(
        "TOTAL TESTED:",
        tested.toLocaleString()
    );

    console.log(
        "VALID VALUES:",
        found.size
    );

    console.log(
        [...found]
    );


    statusBox.textContent =

        "FINISHED" +

        " | TESTED: " +
        tested.toLocaleString() +

        " | FOUND: " +
        found.size;
}


/* =========================================
   البداية
========================================= */

console.log(
    "START DISPLAY SEARCH"
);

console.log(
    "LENGTH:",
    MIN_LENGTH,
    "→",
    MAX_LENGTH
);

console.log(
    "ONLY: a-z"
);

console.log(
    "DASH: 0 or 1"
);

search();

</script>

</body>
</html>
