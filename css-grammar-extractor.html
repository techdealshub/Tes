<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Grammar Extractor</title><style>body{font-family:Arial;margin:12px;background:#07101f;color:#fff}.box{background:#0d1729;padding:12px;margin:10px 0;border-radius:10px}button{padding:10px 14px;margin:3px;border:0;border-radius:7px;background:#2563eb;color:white}pre{white-space:pre-wrap;word-break:break-word}</style><body><h2>CSS Grammar Extractor</h2><div class="box"><input id="f" type="file" accept=".json"><br><button id="load">LOAD</button><button id="start" disabled>START</button><button id="save" disabled>EXPORT JSON</button></div><div class="box"><pre id="s">اختر all-css.json</pre></div><div class="box"><pre id="out"></pre></div><script>
"use strict";
const $=x=>document.getElementById(x);let DATA=null,RESULT=null;
const TYPE_RE=/<[a-zA-Z][a-zA-Z0-9-]*(?:\\s+[^>]+)?>/g,FUNC_RE=/([a-zA-Z_][a-zA-Z0-9_-]*)\\s*\\(/g;
const KEYS=["syntax","grammar","valuesyntax","value","values","keywords","allowedvalues","allowed","options","examples","initial","default","validvalues","possiblevalues","enum","tokens"];
const norm=x=>String(x??"").replace(/\\s+/g," ").trim();
const pname=x=>typeof x==="string"&&/^-?[A-Za-z][A-Za-z0-9_-]*$/.test(x)&&!x.startsWith("--");
function split(s,ch){let a=[],st=0,d=0,q=null;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c===q&&s[i-1]!=="\\")q=null;continue}if(c==="'"||c==='"'){q=c;continue}if("([{".includes(c))d++;else if(")]}".includes(c))d--;else if(!d&&c===ch){a.push(norm(s.slice(st,i)));st=i+1}}a.push(norm(s.slice(st)));return a.filter(Boolean)}
function props(root){let m=new Map(),seen=new WeakSet();function add(k,v){if(pname(k)&&!m.has(k))m.set(k,v)}function w(x){if(!x||typeof x!=="object"||seen.has(x))return;seen.add(x);if(Array.isArray(x)){for(let v of x){if(v&&typeof v==="object"){let n=norm(v.name)||norm(v.property)||norm(v.css)||norm(v.id);if(pname(n))add(n,v)}w(v)}return}for(let[k,v]of Object.entries(x)){if(pname(k)&&v&&typeof v==="object")add(k,v);if(["properties","cssProperties","propertyDefinitions","definitions","descriptors"].includes(k)){if(Array.isArray(v))for(let q of v||[]){let n=norm(q?.name)||norm(q?.property)||norm(q?.css)||norm(q?.id);if(pname(n))add(n,q)}else if(v&&typeof v==="object")for(let[n,q]of Object.entries(v))if(pname(n))add(n,q)}w(v)}}w(root);return m}
function syntax(d){let a=[],seen=new WeakSet();function w(x,k=""){if(x==null)return;if(typeof x==="string"){k=k.toLowerCase();if(["syntax","grammar","valuesyntax","syntaxdefinition"].includes(k))a.push(norm(x));return}if(typeof x!=="object"||seen.has(x))return;seen.add(x);if(Array.isArray(x)){x.forEach(v=>w(v,k));return}for(let[k2,v]of Object.entries(x))w(v,k2)}w(d);return[...new Set(a.filter(Boolean))]}
function explicit(d){let a=new Set(),seen=new WeakSet();function add(x){x=norm(x);if(!x||x.length>300||/^<[^>]+>$/.test(x))return;if(/^[A-Za-z_][A-Za-z0-9_-]*$/.test(x)||/^[-+]?(?:\d+(?:\.\d+)?|\.\d+)(?:[A-Za-z%]+)?$/.test(x)||/^[A-Za-z_][A-Za-z0-9_-]*\s*\(/.test(x)||/^#[0-9a-f]{3,8}$/i.test(x))a.add(x)}function w(x,k="",p=false){if(x==null)return;if(typeof x==="string"){if(p||KEYS.includes(k.toLowerCase()))for(let z of split(x,"|"))for(let q of split(z,","))add(q);return}if(typeof x==="number"){if(p||KEYS.includes(k.toLowerCase()))add(x);return}if(typeof x!=="object"||seen.has(x))return;seen.add(x);if(Array.isArray(x)){x.forEach(v=>w(v,k,p));return}for(let[k2,v]of Object.entries(x))w(v,k2,p||KEYS.includes(k2.toLowerCase()))}w(d);return a}
function allSources(root){let funcs=new Set(),types=new Set(),seen=new WeakSet();function w(x){if(x==null)return;if(typeof x==="string"){let m,t;FUNC_RE.lastIndex=0;while(m=FUNC_RE.exec(x))funcs.add(m[1].toLowerCase());for(t of x.match(TYPE_RE)||[])types.add(t.toLowerCase());return}if(typeof x!=="object"||seen.has(x))return;seen.add(x);if(Array.isArray(x)){x.forEach(w);return}for(let[k,v]of Object.entries(x)){for(let t of (k.match(TYPE_RE)||[]))types.add(t.toLowerCase());w(v)}}w(root);return{funcs,types}}
function defs(root){let types=new Map(),funcs=new Map(),seen=new WeakSet();function w(x){if(!x||typeof x!=="object"||seen.has(x))return;seen.add(x);if(Array.isArray(x)){x.forEach(w);return}let n=norm(x.name)||norm(x.id)||norm(x.type),s=norm(x.syntax)||norm(x.grammar)||norm(x.valueSyntax);if(n&&s){if(/^<[^>]+>$/.test(n))types.set(n.toLowerCase(),s);else if(/^[A-Za-z_][A-Za-z0-9_-]*$/.test(n)&&s.includes("("))funcs.set(n.toLowerCase(),s)}for(let[k,v]of Object.entries(x)){if(k==="types"&&v&&typeof v==="object")for(let[n,q]of Object.entries(v)){let z=typeof q==="string"?q:norm(q?.syntax)||norm(q?.grammar)||norm(q?.valueSyntax);if(z)types.set(("<"+n.replace(/^<|>$/g,"")+">").toLowerCase(),z)}if(k==="functions"&&v&&typeof v==="object")for(let[n,q]of Object.entries(v)){let z=typeof q==="string"?q:norm(q?.syntax)||norm(q?.grammar)||norm(q?.valueSyntax);if(z)funcs.set(n.toLowerCase(),z)}w(v)}}w(root);return{types,funcs}}
function resolve(s,T,F,d=0){if(d>8)return new Set();let ps=split(s,"|");if(ps.length>1){let r=new Set();for(let p of ps)for(let x of resolve(p,T,F,d+1))r.add(x);return r}let types=[...(s.match(TYPE_RE)||[])],r=new Set([norm(s)]);if(!types.length)return r;for(let t of types){let z=T.get(t.toLowerCase());if(!z)continue;let reps=resolve(z,T,F,d+1),n=new Set();for(let b of r)for(let q of reps){let x=b.replace(t,q);if(!x.includes("<"))n.add(x)}r=n}return new Set([...r].filter(x=>x&&!/[<>{}\[\]]/.test(x)))}
function nums(s){let r=new Set(),ts=new Set((s.match(TYPE_RE)||[]).map(x=>x.toLowerCase()));let u={"<length>":["px","pt","pc","in","cm","mm","Q","em","rem","ex","ch","vw","vh","vmin","vmax","vi","vb"],"<length-percentage>":["px","em","rem","vw","vh","vmin","vmax","vi","vb","%"],"<percentage>":["%"],"<angle>":["deg","rad","grad","turn"],"<time>":["ms","s"],"<frequency>":["Hz","kHz"],"<resolution>":["dpi","dpcm","dppx"],"<flex>":["fr"]};for(let t of ts){for(let x of u[t]||[]){for(let n=0;n<=10;n++)r.add(n+x);for(let n=1;n<=10;n++)r.add("-"+n+x)}if(t==="<number>"||t==="<integer>"){for(let n=0;n<=10;n++)r.add(""+n);for(let n=1;n<=10;n++)r.add("-"+n)}}return r}
$("load").onclick=async()=>{try{let f=$("f").files[0];if(!f)return;$("s").textContent="Loading...";DATA=JSON.parse(await f.text());let P=props(DATA),G=allSources(DATA),D=defs(DATA),out={propertyCount:P.size,functionNames:[...G.funcs].sort(),typeNames:[...G.types].sort(),properties:{}};for(let[p,d]of P){let sx=syntax(d),orig=explicit(d),fn=new Set();for(let s of sx){for(let n of s.match(FUNC_RE)||[]){n=n.replace(/\s*\($/,"").toLowerCase();let z=D.funcs.get(n);if(z)for(let v of resolve(z,D.types,D.funcs))fn.add(v)}for(let v of resolve(s,D.types,D.funcs))if(v.includes("("))fn.add(v)}out.properties[p]={syntax:sx,original:[...orig],numeric:[...nums(sx.join(" | "))],functions:[...fn]}}RESULT=out;$("s").textContent="LOADED ✓\nProperties: "+P.size+"\nFunction names found anywhere: "+G.funcs.size+"\nTypes: "+G.types.size;$("out").textContent=JSON.stringify(out.properties["align-content"]||{},null,2);$("start").disabled=false}catch(e){$("s").textContent="ERROR: "+e.message}};$("start").onclick=()=>{let tests=0,ok=0,success={};for(let[p,x]of Object.entries(RESULT.properties)){let c=new Set([...x.original,...x.numeric,...x.functions]);for(let v of c){tests++;let y=false;try{y=CSS.supports(p,v)}catch{}if(y){ok++;(success[p]??=[]).push(v)}}}RESULT.tests=tests;RESULT.supported=ok;RESULT.success=success;$("s").textContent="FINISHED ✓\nProperties: "+RESULT.propertyCount+"\nFunction names: "+RESULT.functionNames.length+"\nTests: "+tests+"\nTRUE: "+ok;$("save").disabled=false};$("save").onclick=()=>{let b=new Blob([JSON.stringify(RESULT,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="css-grammar-extracted.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script></body></html>
