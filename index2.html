<title>CSS Property Value Tester</title>

  "use strict";

/* =========================================
   GLOBAL DATA
========================================= */

let FUNCTIONS = [];

/* =========================================
   LOAD JSON
========================================= */

async function loadData(){

    const cssResponse =
        await fetch("all-css.json");

    CSS_DATA =
        await cssResponse.json();

    try{

        const fnResponse =
            await fetch("all-functions.json");

        FUNCTIONS =
            await fnResponse.json();

/* =========================================
   NORMALIZE FUNCTION
========================================= */

function normalizeFunction(x){

    let s = String(x).trim();

    if(!s.endsWith("()"))

}

/* =========================================
   DATA TYPE → VALUES
========================================= */

function typeValues(type){

    type = type.toLowerCase();

    if(type.includes("length-percentage"))
        return [
            ...NUMERIC_VALUES.length,
            ...NUMERIC_VALUES.percentage
        ];

    if(type.includes("percentage"))
        return NUMERIC_VALUES.percentage;

    if(type.includes("length"))
        return NUMERIC_VALUES.length;

    if(type.includes("angle"))
        return NUMERIC_VALUES.angle;

    if(type.includes("time"))
        return NUMERIC_VALUES.time;

    if(type.includes("resolution"))
        return NUMERIC_VALUES.resolution;

    if(type.includes("integer"))
        return NUMERIC_VALUES.integer;

    if(type.includes("number"))
        return NUMERIC_VALUES.number;

    if(type.includes("flex"))
        return NUMERIC_VALUES.flex;

    return [];
}


/* =========================================
   EXTRACT DATA TYPES
========================================= */

function extractTypes(syntax){

    const result = [];

    const re = /<([^>]+)>/g;

    let m;

    while((m = re.exec(syntax))){

        result.push(
            m[1]
                .split("#")[0]
                .split("?")[0]
                .trim()
        );

    }

    return [...new Set(result)];
}


/* =========================================
   EXTRACT FUNCTIONS FROM SYNTAX
========================================= */

function syntaxFunctions(syntax){

    const result = [];

    const re = /([a-zA-Z-]+)\(/g;

    let m;

    while((m = re.exec(syntax))){

        result.push(
            m[1] + "()"
        );

    }

    return [...new Set(result)];

}


/* =========================================
   GENERATE CANDIDATES
========================================= */

function generateCandidates(property){

    if(candidatesCache.has(property.name))
        return candidatesCache.get(property.name);

    const syntax =
        String(property.syntax || "");

    const values = new Set();

    /* keywords */

    for(const x of COMMON_KEYWORDS)
        values.add(x);

    /* data types */

    for(const type of extractTypes(syntax)){

        for(const value of typeValues(type))
            values.add(value);

    }

    /* functions explicitly in syntax */

    for(const fn of syntaxFunctions(syntax)){

        if(FUNCTION_VALUES[fn]){

            for(const value of FUNCTION_VALUES[fn])
                values.add(value);

        }

    }

    /* functions from all-functions.json */

    for(const fnRaw of FUNCTIONS){

        const fn = normalizeFunction(fnRaw);

        if(FUNCTION_VALUES[fn]){

            for(const value of FUNCTION_VALUES[fn])
                values.add(value);

        }

    }

    const result =
        [...values];

    candidatesCache.set(
        property.name,
        result
    );

    return result;
}


/* =========================================
   EXPOSE
========================================= */

window.loadData = loadData;
window.generateCandidates = generateCandidates;
window.CSS_DATA = () => CSS_DATA;
  /* =========================================
   TEST ENGINE
========================================= */

const target =
    document.getElementById("test-target");

const results =
    document.getElementById("results");

const status =
    document.getElementById("progress");

const start =
    document.getElementById("start");


/* =========================================
   SNAPSHOT
========================================= */

function snapshot(){

    const cs =
        getComputedStyle(target);

    const rect =
        target.getBoundingClientRect();

    return {

        left: rect.left,
        top: rect.top,
        width: rect.width,
        height: rect.height,

        transform: cs.transform,

        opacity: cs.opacity,

        color: cs.color,

        backgroundColor:
            cs.backgroundColor,

        display: cs.display,

        position: cs.position,

        visibility: cs.visibility,

        cssText: [
            cs.width,
            cs.height,
            cs.marginTop,
            cs.marginRight,
            cs.marginBottom,
            cs.marginLeft,
            cs.paddingTop,
            cs.paddingRight,
            cs.paddingBottom,
            cs.paddingLeft,
            cs.position,
            cs.display,
            cs.transform,
            cs.opacity,
            cs.color,
            cs.backgroundColor
        ].join("|")
    };
}


/* =========================================
   DIFFERENCE
========================================= */

function changed(a,b){

    const geometry =
        Math.abs(a.left - b.left) > 0.01 ||
        Math.abs(a.top - b.top) > 0.01 ||
        Math.abs(a.width - b.width) > 0.01 ||
        Math.abs(a.height - b.height) > 0.01;

    const visual =
        a.transform !== b.transform ||
        a.opacity !== b.opacity ||
        a.color !== b.color ||
        a.backgroundColor !== b.backgroundColor;

    const computed =
        a.cssText !== b.cssText;

    return {
        geometry,
        visual,
        computed,
        effect:
            geometry ||
            visual ||
            computed
    };
}


/* =========================================
   CSS SUPPORTS
========================================= */

function supports(property,value){

    try{

        return CSS.supports(
            property,
            value
        );

    }catch(e){

        return false;

    }
}


/* =========================================
   RESET PROPERTY
========================================= */

function reset(property){

    target.style.removeProperty(
        property
    );

}


/* =========================================
   TEST ONE VALUE
========================================= */

async function testValue(
    property,
    value
){

    reset(property);

    await new Promise(
        requestAnimationFrame
    );

    const before =
        snapshot();

    if(!supports(property,value)){

        return {
            supported:false,
            effect:false,
            geometry:false,
            visual:false,
            computed:false
        };

    }

    target.style.setProperty(
        property,
        value,
        "important"
    );

    await new Promise(
        requestAnimationFrame
    );

    const after =
        snapshot();

    const diff =
        changed(before,after);

    return {

        supported:true,

        effect:diff.effect,

        geometry:diff.geometry,

        visual:diff.visual,

        computed:diff.computed

    };

}


/* =========================================
   NUMERIC DETECTION
========================================= */

function numericValue(value){

    return /^-?\d*\.?\d+(px|%|em|rem|vw|vh|vmin|vmax|deg|rad|turn|s|ms|fr|ch|ex|cm|mm|in|pt|pc|Q|dppx|dpi|dpcm)$/
        .test(value.trim());

}


/* =========================================
   RANGE
========================================= */

function createRange(
    property,
    value
){

    const match =
        value.match(
            /^(-?\d*\.?\d+)(.*)$/
        );

    if(!match)
        return null;

    const number =
        Number(match[1]);

    const unit =
        match[2];

    if(!unit)
        return null;

    const input =
        document.createElement("input");

    input.type =
        "range";

    input.min =
        number - 100;

    input.max =
        number + 100;

    input.step =
        unit === "px" ||
        unit === "%" ||
        unit === "em" ||
        unit === "rem"
            ? 1
            : 0.1;

    input.value =
        number;

    input.title =
        property + ": " + value;

    input.addEventListener(
        "input",
        () => {

            const newValue =
                input.value + unit;

            target.style.setProperty(
                property,
                newValue,
                "important"
            );

        }
    );

    return input;
}


/* =========================================
   TEST PROPERTY
========================================= */

async function testProperty(
    property,
    index,
    total
){

    const box =
        document.createElement("div");

    box.className =
        "property";

    const title =
        document.createElement("div");

    title.className =
        "property-title";

    title.textContent =
        `${index + 1}. ${property.name}`;

    box.appendChild(title);

    const valuesBox =
        document.createElement("div");

    valuesBox.className =
        "values";

    box.appendChild(valuesBox);

    results.appendChild(box);

    const candidates =
        generateCandidates(property);

    let tested = 0;
    let working = 0;

    for(const value of candidates){

        const result =
            await testValue(
                property.name,
                value
            );

        tested++;

        if(result.effect)
            working++;

        /*
            لا نعرض القيم التي:
            - CSS.supports = false
            - ولا يوجد لها تأثير
        */

        if(
            !result.supported ||
            !result.effect
        ){

            reset(property);

            continue;

        }

        const row =
            document.createElement("div");

        row.className =
            "value green";

        const name =
            document.createElement("span");

        name.className =
            "value-name";

        name.textContent =
            `${value}`;

        row.appendChild(name);

        /* Range للقيم الرقمية */

        if(numericValue(value)){

            const range =
                createRange(
                    property.name,
                    value
                );

            if(range)
                row.appendChild(range);

        }

        /* نوع التأثير */

        const type =
            document.createElement("small");

        if(result.geometry){

            type.textContent =
                "GEOMETRY";

        }else if(result.visual){

            type.textContent =
                "VISUAL";

        }else{

            type.textContent =
                "COMPUTED";

        }

        row.appendChild(type);

        valuesBox.appendChild(row);

        reset(property);

        /*
            حتى لا يتجمد الهاتف
        */

        if(tested % 20 === 0){

            status.textContent =
                `${property.name} — ${tested}/${candidates.length}`;

            await new Promise(
                requestAnimationFrame
            );

        }

    }

    /*
        إذا لم نجد أي قيمة فعالة
        نحذف الخاصية من العرض
    */

    if(working === 0){

        box.remove();

    }

    reset(property);

}


/* =========================================
   START ALL
========================================= */

async function startTest(){

    start.disabled =
        true;

    results.innerHTML =
        "";

    const data =
        CSS_DATA();

    if(!data){

        status.textContent =
            "لم يتم تحميل all-css.json";

        return;

    }

    const properties =
        data.properties || [];

    let index = 0;

    for(const property of properties){

        status.textContent =
            `Testing ${index + 1}/${properties.length}: ${property.name}`;

        await testProperty(
            property,
            index,
            properties.length
        );

        index++;

        /*
            إراحة الهاتف
        */

        await new Promise(
            resolve =>
                setTimeout(resolve,0)
        );

    }

    status.textContent =
        `FINISHED — ${index} properties`;

    start.disabled =
        false;

}


/* =========================================
   START
========================================= */

start.addEventListener(
    "click",
    async () => {

        await loadData();

        await startTest();

    }
);
</script>
