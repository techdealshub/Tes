<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSS Values Builder</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#050816;color:#f8fafc;font-family:Arial,sans-serif}
.panel{background:#0d1729;border:1px solid #1e293b;border-radius:10px;padding:12px;margin-bottom:12px}
button,input{font:inherit}
button{border:0;border-radius:8px;padding:9px 12px;margin:3px;background:#2563eb;color:#fff}
button:disabled{opacity:.45}
input[type=file]{width:100%;margin-bottom:8px}
input[type=number]{width:90px}
#status,#current,#syntax{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.bar{height:8px;background:#111c31;border-radius:8px;overflow:hidden;margin-top:8px}
#bar{height:100%;width:0;background:#2563eb}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.stat{background:#111c31;border-radius:8px;padding:8px}
.stat b{display:block;font-size:18px}
#results{display:flex;flex-direction:column;gap:5px}
.row{border-radius:7px;padding:8px;border:1px solid #334155;word-break:break-word}
.original{background:#fff;color:#000;border-color:#cbd5e1}
.added{background:#111827;color:#f8fafc}
.small{font-size:12px;opacity:.75;margin-top:3px}
.legend span{display:inline-block;padding:5px 8px;border-radius:5px;margin:3px}
.legend .w{background:#fff;color:#000}
.legend .d{background:#111827;color:#fff}
.ok{color:#22c55e}.warn{color:#f59e0b}
</style>
</head>
<body>

<h2>CSS Values Builder — all-css.json</h2>

<div class="panel">
<input id="file" type="file" accept=".json,application/json">
<br>
<button id="load">تحميل JSON</button>
<button id="start" disabled>START</button>
<button id="stop" disabled>STOP</button>
<button id="export" disabled>تصدير JSON</button>
</div>

<div class="panel">
<b>توليد الأرقام:</b><br><br>
الحد:
<input id="max" type="number" min="1" max="1000" value="10">
<br><br>
الوحدات:
<div id="units"></div>
</div>

<div class="panel">
<div id="status">اختر all-css.json</div>
<div class="bar"><div id="bar"></div></div>
</div>

<div class="panel">
<b>Property:</b>
<div id="current">-</div>
<br>
<b>Syntax:</b>
<div id="syntax">-</div>
</div>

<div class="panel">
<div class="stats">
<div class="stat"><b id="pc">0</b>Properties</div>
<div class="stat"><b id="vc">0</b>Original values</div>
<div class="stat"><b id="ac">0</b>Added values</div>
<div class="stat"><b id="tc">0</b>CSS.supports tests</div>
<div class="stat"><b id="ok">0</b>TRUE</div>
<div class="stat"><b id="fn">0</b>Functions</div>
<div class="stat"><b id="num">0</b>Numeric</div>
</div>
<br>
<div class="legend">
<span class="w">أبيض = قيمة أصلية من JSON</span>
<span class="d">غامق = قيمة إضافية أثبتها CSS.supports</span>
</div>
</div>

<div id="results"></div>


<script>
"use strict";
const $=id=>document.getElementById(id);
const UNITS=["px","pt","pc","in","cm","mm","Q","em","rem","ex","ch","vw","vh","vmin","vmax","vi","vb","%","fr","deg","rad","grad","turn","ms","s","Hz","kHz","dpi","dpcm","dppx"];
$("units").innerHTML=UNITS.map(u=>`<label style="margin:3px"><input class="unit" type="checkbox" value="${u}" ${["px","em","rem","vw","vh","%"].includes(u)?"checked":""}>${u}</label>`).join(" ");

let data=null,props=[],defs={};
let originalPool=new Set(),functionNames=new Set();
let running=false,stopRequested=false,tests=0,trueCount=0,addedCount=0,output=[];

function norm(x){return String(x??"").replace(/\s+/g," ").trim()}
function validProp(x){return typeof x==="string"&&/^-?[A-Za-z][A-Za-z0-9-]*$/.test(x)&&!x.startsWith("--")}
function tick(){return new Promise(r=>setTimeout(r,0))}
function walk(x,fn,seen=new WeakSet()){
 if(!x||typeof x!=="object"||seen.has(x))return;
 seen.add(x);fn(x);
 if(Array.isArray(x)){for(const v of x)walk(v,fn,seen)}
 else for(const v of Object.values(x))walk(v,fn,seen);
}
function splitTop(s){
 const a=[];let st=0,d=0;
 for(let i=0;i<s.length;i++){
  const c=s[i];
  if("([{".includes(c))d++;
  else if(")]}".includes(c))d=Math.max(0,d-1);
  else if((c==="|"||c===","||c===";")&&d===0){
   const v=norm(s.slice(st,i));if(v)a.push(v);st=i+1;
  }
 }
 const v=norm(s.slice(st));if(v)a.push(v);return a;
}

/* Detect the common shapes used by all-css.json. */
function source(){
 if(Array.isArray(data))return data;
 if(!data||typeof data!=="object")return null;
 for(const k of ["properties","cssProperties","items","data"]){
  if(data[k]&&typeof data[k]==="object")return data[k];
 }
 return data;
}
function loadProperties(){
 props=[];defs={};const s=source();
 if(Array.isArray(s)){
  for(const x of s){
   if(typeof x==="string"){if(validProp(x)&&!defs[x]){defs[x]={name:x};props.push(x)}}
   else if(x&&typeof x==="object"){
    const n=norm(x.name||x.property||x.id||x.css);
    if(validProp(n)&&!defs[n]){defs[n]=x;props.push(n)}
   }
  }
 }else if(s&&typeof s==="object"){
  for(const [n,v] of Object.entries(s)){
   if(!validProp(n))continue;
   defs[n]=v&&typeof v==="object"?v:{value:v};props.push(n);
  }
 }
 props=[...new Set(props)].sort();
 $("pc").textContent=props.length;
 return props.length;
}
function syntax(p){
 const d=defs[p];if(!d)return "";
 return typeof d==="string"?norm(d):norm(d.syntax||d.valueSyntax||d.grammar||"");
}
const FIXED=new Set([
"auto","none","normal","initial","inherit","unset","revert","revert-layer",
"visible","hidden","collapse","show","hide","block","inline","inline-block",
"flex","grid","table","contents","start","end","center","left","right",
"top","bottom","stretch","baseline","first","last","safe","unsafe",
"space-between","space-around","space-evenly","flex-start","flex-end",
"row","column","row-reverse","column-reverse","wrap","nowrap","wrap-reverse",
"ltr","rtl","solid","dashed","dotted","double","groove","ridge","inset",
"outset","currentcolor","transparent","relative","absolute","fixed","sticky",
"static","border-box","content-box","min-content","max-content","fit-content",
"subgrid","horizontal-tb","vertical-rl","vertical-lr"
]);
function valuesIn(obj){
 const out=new Set();
 const VALUE_KEYS=new Set([
  "values","value","keywords","allowedValues","initial","default",
  "examples","options","name","keyword","ident","token"
 ]);
 const BAD_KEYS=new Set([
  "description","title","url","mdn_url","spec","status","notes",
  "compatibility","browser","support","source","syntax"
 ]);
 function addString(v){
  if(typeof v!=="string")return;
  for(const x of splitTop(v)){
   const z=norm(x);
   if(!z||z.length>500)continue;
   if(/^<[^>]+>$/.test(z))continue;
   if(/^https?:\/\//i.test(z))continue;
   out.add(z);
  }
 }
 function scan(node,parentKey=""){
  if(node==null)return;
  if(typeof node==="string"){
   if(VALUE_KEYS.has(parentKey))addString(node);
   return;
  }
  if(Array.isArray(node)){
   for(const item of node)scan(item,parentKey);
   return;
  }
  if(typeof node!=="object")return;
  for(const [k,v] of Object.entries(node)){
   if(BAD_KEYS.has(k))continue;
   if(VALUE_KEYS.has(k)){
    if(typeof v==="string")addString(v);
    else if(Array.isArray(v)||v&&typeof v==="object")scan(v,k);
   }else if(Array.isArray(v)){
    /* Arrays often contain value objects. */
    scan(v,k);
   }else if(v&&typeof v==="object"){
    scan(v,k);
   }
  }
 }
 scan(obj);
 return out;
}
function propertyValues(p){
 const out=valuesIn(defs[p]);
 const s=syntax(p).replace(/<[^>]+>/g," ").replace(/[A-Za-z-]+\([^)]*\)/g," ");
 for(const w of s.match(/(?<![A-Za-z0-9_-])[A-Za-z][A-Za-z0-9-]*(?![A-Za-z0-9_-])/g)||[]){
  if(w.length<=100)out.add(w);
 }
 ["initial","inherit","unset","revert","revert-layer"].forEach(x=>out.add(x));
 return out;
}
function collectOriginal(){
 originalPool=new Set();functionNames=new Set();
 /* Every property's complete value-bearing data contributes to the global pool. */
 for(const p of props){
  for(const v of propertyValues(p)){
   if(v.length<=500)originalPool.add(v);
  }
 }
 /* Also discover function names and fixed CSS words from the whole JSON,
    including strings inside arrays (the old collector skipped arrays). */
 function scan(node){
  if(node==null)return;
  if(typeof node==="string"){
   const s=norm(node);
   if(!s||s.length>500)return;
   for(const m of s.match(/[A-Za-z][A-Za-z0-9-]*\s*\(/g)||[])
    functionNames.add(m.replace(/\s*\($/,"").toLowerCase());
   if(FIXED.has(s))originalPool.add(s);
   return;
  }
  if(Array.isArray(node)){for(const x of node)scan(x);return;}
  if(typeof node==="object")for(const x of Object.values(node))scan(x);
 }
 scan(data);
 ["initial","inherit","unset","revert","revert-layer"].forEach(x=>originalPool.add(x));
 $("vc").textContent=originalPool.size;
}
function numericPool(){
 const out=new Set(),max=Math.min(100,Math.max(1,Number($("max").value)||10));
 const us=[...document.querySelectorAll(".unit:checked")].map(x=>x.value);
 for(let n=0;n<=max;n++)out.add(String(n));
 for(let n=1;n<=max;n++)out.add("-"+n);
 for(const n of ["0.1","0.25","0.5","0.75","1.5","2.5","-0.1","-0.25","-0.5","-1.5"])out.add(n);
 for(const u of us){
  for(let n=0;n<=max;n++)out.add(n+u);
  for(let n=1;n<=max;n++)out.add("-"+n+u);
 }
 return out;
}
const FT={
calc:"calc(1px + 1px)",min:"min(100px,50%)",max:"max(100px,50%)",
clamp:"clamp(10px,50%,300px)","fit-content":"fit-content(100px)",
"calc-size":"calc-size(auto,size)","anchor-size":"anchor-size(width)",
rgb:"rgb(255 0 0)",rgba:"rgba(255,0,0,.5)",hsl:"hsl(0 100% 50%)",
hsla:"hsla(0,100%,50%,.5)",hwb:"hwb(0 0% 0%)",lab:"lab(50% 0 0)",
lch:"lch(50% 0 0)",oklab:"oklab(50% 0 0)",oklch:"oklch(50% 0 0)",
color:"color(srgb 1 0 0)",url:"url(x)",var:"var(--x)",
env:"env(safe-area-inset-top)",attr:"attr(data-x)",
counter:"counter(item)",counters:"counters(item,'.')",
"linear-gradient":"linear-gradient(red,blue)","radial-gradient":"radial-gradient(red,blue)",
"conic-gradient":"conic-gradient(red,blue)",
"repeating-linear-gradient":"repeating-linear-gradient(red,blue)",
"repeating-radial-gradient":"repeating-radial-gradient(red,blue)",
"image-set":"image-set(url(x) 1x)","cross-fade":"cross-fade(url(x),url(y),50%)",
steps:"steps(2)","cubic-bezier":"cubic-bezier(0,0,1,1)",
linear:"linear(0,1)",path:"path('M 0 0 L 1 1')",
polygon:"polygon(0 0,100% 0,100% 100%)",circle:"circle(50%)",
ellipse:"ellipse(50% 50%)",inset:"inset(0)",
translate:"translate(1px)",translateX:"translateX(1px)",
translateY:"translateY(1px)",translateZ:"translateZ(1px)",
scale:"scale(1)",scaleX:"scaleX(1)",scaleY:"scaleY(1)",
rotate:"rotate(0deg)",rotateX:"rotateX(0deg)",rotateY:"rotateY(0deg)",
rotateZ:"rotateZ(0deg)",skew:"skew(0deg)",skewX:"skewX(0deg)",skewY:"skewY(0deg)",
matrix:"matrix(1,0,0,1,0,0)",perspective:"perspective(100px)",
blur:"blur(1px)",brightness:"brightness(1)",contrast:"contrast(1)",
grayscale:"grayscale(1)","hue-rotate":"hue-rotate(10deg)",
invert:"invert(1)",opacity:"opacity(.5)",saturate:"saturate(1)",
sepia:"sepia(1)","drop-shadow":"drop-shadow(1px 1px 1px black)"
};
function functionPool(){
 const out=new Set();
 for(const n of functionNames)if(FT[n])out.add(FT[n]);
 for(const v of Object.values(FT))out.add(v);
 return out;
}
function allCandidates(){
 const m=new Map();
 for(const v of originalPool)m.set(v,"original");
 for(const v of numericPool())if(!m.has(v))m.set(v,"numeric");
 for(const v of functionPool())if(!m.has(v))m.set(v,"function");
 return m;
}
function supports(p,v){tests++;try{return CSS.supports(p,v)}catch{return false}}
let shown=0;
function show(p,v,k){
 if(shown>=20000)return;shown++;
 const d=document.createElement("div");d.className="row "+(k==="original"?"original":"added");
 d.innerHTML=`<b>${p}</b> : ${String(v).replace(/</g,"&lt;").replace(/>/g,"&gt;")}<div class="small">${k==="original"?"ORIGINAL":"ADDED — CSS.supports TRUE"}</div>`;
 $("results").appendChild(d);
}
async function run(){
 if(running)return;
 if(!data){status("LOAD JSON أولًا.");return}
 if(!props.length){status("لم يتم العثور على 817 properties. راجع رسالة LOAD.");return}
 running=true;stopRequested=false;$("start").disabled=true;$("stop").disabled=false;$("export").disabled=true;
 tests=0;trueCount=0;addedCount=0;output=[];shown=0;$("results").innerHTML="";
 collectOriginal();
 const np=numericPool(),fp=functionPool(),map=allCandidates();
 $("nc").textContent=np.size;$("fc").textContent=fp.size;
 const total=props.length*map.size;let done=0;
 for(let i=0;i<props.length;i++){
  if(stopRequested)break;
  const p=props[i],s=syntax(p);$("current").textContent=`${i+1} / ${props.length} → ${p}`;$("syntax").textContent=s||"No syntax";
  const r={property:p,syntax:s,original:[],added:[]};
  for(const [v,k] of map){
   if(stopRequested)break;
   if(supports(p,v)){
    trueCount++;
    if(k==="original"){r.original.push(v);show(p,v,k)}
    else{r.added.push({value:v,type:k});addedCount++;show(p,v,k)}
   }
   done++;
   if(done%100===0){
    $("tc").textContent=tests;$("ok").textContent=trueCount;$("add").textContent=addedCount;
    $("bar").style.width=(done/total*100)+"%";
    status(`${stopRequested?"STOPPING":"RUNNING"}\n\nProperty: ${i+1}/${props.length}\n${p}\nTests: ${tests}\nTRUE: ${trueCount}\nAdded: ${addedCount}`);
    await tick();
   }
  }
  output.push(r);
 }
 $("bar").style.width="100%";$("tc").textContent=tests;$("ok").textContent=trueCount;$("add").textContent=addedCount;
 status(`${stopRequested?"STOPPED":"FINISHED ✓"}\n\nProperties: ${props.length}\nCandidates/property: ${map.size}\nTests: ${tests}\nTRUE: ${trueCount}\nAdded: ${addedCount}`);
 running=false;$("start").disabled=false;$("stop").disabled=true;$("export").disabled=output.length===0;
}
$("load").onclick=async()=>{
 const f=$("file").files[0];if(!f){status("اختر all-css.json.");return}
 try{
  data=JSON.parse(await f.text());const n=loadProperties();
  if(!n){const keys=data&&typeof data==="object"&&!Array.isArray(data)?Object.keys(data).slice(0,20).join(", "):"array";status(`JSON loaded لكن لم أجد properties.\nTop-level: ${keys}`);return}
  collectOriginal();$("nc").textContent=numericPool().size;$("fc").textContent=functionPool().size;$("start").disabled=false;
  status(`READY ✓\n\nProperties: ${props.length}\nOriginal pool: ${originalPool.size}\nNumeric pool: ${numericPool().size}\nFunction pool: ${functionPool().size}\n\nاضغط START.`);
 }catch(e){status("JSON ERROR:\n"+e.message)}
};
$("start").onclick=run;
$("stop").onclick=()=>{stopRequested=true;status("إيقاف...")};
$("export").onclick=()=>{
 const b=new Blob([JSON.stringify({generatedAt:new Date().toISOString(),properties:props.length,tests,trueCount,addedCount,results:output},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="css-values-complete.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
</script>
</body>
</html>
