/* =====================================================
   LOAD JSON
===================================================== */

async function loadJSON(){

  try{

    statusEl.textContent =
      "جاري البحث تلقائياً عن all-css.json...";

    /*
      يحاول تحميل all-css.json تلقائياً من نفس مجلد HTML.
      إذا لم يكن متاحاً، ننتقل إلى اختيار ملف JSON يدوياً.
    */
    const response =
      await fetch(
        "css-values-discovered.json",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP "+
        response.status+
        " — all-css.json غير موجود."
      );

    }


    DATA =
      await response.json();


    if(
      !DATA.properties ||
      typeof DATA.properties!=="object"
    ){

      throw new Error(
        "ملف JSON لا يحتوي على properties."
      );

    }


    PROPERTIES =
      DATA.properties;


    propertyNames =
      Object.keys(
        PROPERTIES
      );


    document.getElementById(
      "total"
    ).textContent =
      propertyNames.length;


    startBtn.disabled=false;


    statusEl.textContent =
      "تم تحميل "+
      propertyNames.length+
      " property.\n"+
      "اضغط START TEST لبدء المختبر.";


  }catch(error){

    console.error(error);


    statusEl.textContent =
      "فشل تحميل all-css.json تلقائياً:\n"+
      error.message+
      "\n\n"+
      "ضع all-css.json في نفس مجلد amine-menu.html " +
      "وشغّل الصفحة عبر localhost/Acode server.";

  }

}


/* =====================================================
   BASELINE RESET
===================================================== */

function restoreTarget(){

  /*
     حذف جميع inline styles
  */

  testTarget.removeAttribute(
    "style"
  );


  /*
     الحالة الأساسية
  */

  testTarget.style.width=
    "150px";

  testTarget.style.height=
    "150px";

  testTarget.style.position=
    "relative";

  testTarget.style.background=
    "#2563eb";

  testTarget.style.color=
    "white";

  testTarget.style.border=
    "3px solid #111827";

  testTarget.style.padding=
    "10px";

  testTarget.style.display=
    "block";

  testTarget.style.boxSizing=
    "border-box";


  /*
     تنظيف الأطفال
  */

  const children =
    testTarget.querySelectorAll(
      "*"
    );


  children.forEach(
    child=>{

      child.removeAttribute(
        "style"
      );

    }
  );


  /*
     إجبار layout
  */

  void testTarget.offsetWidth;

}

/* =====================================================

   REAL EFFECT TEST ENGINE
===================================================== */


/* =====================================================

const TEST_CONTEXTS = {

/* =====================================================
   PROPERTY DEPENDENCY
===================================================== */

function getTestContexts(property){

  const p =
    property
      .toLowerCase()
      .trim();


  const contexts=[];


  /* -----------------------------------------------------
     POSITION
  ----------------------------------------------------- */

  if(

    p==="top" ||
    p==="right" ||
    p==="bottom" ||
    p==="left" ||

    p==="inset" ||

    p.startsWith("inset-")

  ){

    contexts.push(
      "position"
    );

    contexts.push(
      "relative"
    );

  }


  /* -----------------------------------------------------
     POSITION PROPERTY
  ----------------------------------------------------- */

  else if(
    p==="position"
  ){

    contexts.push(
      "base"
    );

  }


  /* -----------------------------------------------------
     FLEX
  ----------------------------------------------------- */

  if(

    p==="flex" ||

    p.startsWith("flex-") ||

    p==="justify-content" ||

    p==="align-items" ||

    p==="align-content" ||

    p==="align-self" ||

    p==="place-content" ||

    p==="place-items" ||

    p==="place-self"

  ){

    contexts.push(
      "flex"
    );

  }


  /* -----------------------------------------------------
     GRID
  ----------------------------------------------------- */

  if(
    p.startsWith("grid-")
  ){

    contexts.push(
      "grid"
    );

  }


  /* -----------------------------------------------------
     GAP
  ----------------------------------------------------- */

  if(

    p==="gap" ||

    p==="row-gap" ||

    p==="column-gap"

  ){

    contexts.push(
      "flex"
    );

    contexts.push(
      "grid"
    );

  }


  /* -----------------------------------------------------
     TEXT
  ----------------------------------------------------- */

  if(

    p==="color" ||

    p.startsWith("font") ||

    p.startsWith("text-") ||

    p==="line-height" ||

    p==="letter-spacing" ||

    p==="word-spacing" ||

    p==="white-space" ||

    p==="word-break" ||

    p==="overflow-wrap" ||

    p==="hyphens"

  ){

    contexts.push(
      "text"
    );

  }


  /* -----------------------------------------------------
     COLUMNS
  ----------------------------------------------------- */

  if(

    p.startsWith("column-") ||

    p==="columns" ||

    p.startsWith("break-")

  ){

    contexts.push(
      "columns"
    );

  }


  /* -----------------------------------------------------
     OVERFLOW
  ----------------------------------------------------- */

  if(

    p==="overflow" ||

    p==="overflow-x" ||

    p==="overflow-y" ||

    p.startsWith("overscroll-") ||

    p.startsWith("scroll-")

  ){

    contexts.push(
      "overflow"
    );

    contexts.push(
      "scroll"
    );

  }


  /* -----------------------------------------------------
     TABLE
  ----------------------------------------------------- */

  if(

    p==="table-layout" ||

    p==="border-collapse" ||

    p==="border-spacing" ||

    p==="caption-side" ||

    p==="empty-cells"

  ){

    contexts.push(
      "table"
    );

  }


  /* -----------------------------------------------------
     TRANSFORM
  ----------------------------------------------------- */

  if(

    p==="transform" ||

    p.startsWith("transform-") ||

    p==="perspective"

  ){

    contexts.push(
      "transform"
    );

  }


  /* -----------------------------------------------------
     Z INDEX
  ----------------------------------------------------- */

  if(
    p==="z-index"
  ){

    contexts.push(
      "position"
    );

    contexts.push(
      "flex"
    );

    contexts.push(
      "grid"
    );

  }


  /* -----------------------------------------------------
     DISPLAY
  ----------------------------------------------------- */

  if(
    p==="display"
  ){

    contexts.push(
      "base"
    );

  }


  /* -----------------------------------------------------
     DEFAULT
  ----------------------------------------------------- */

  if(
    contexts.length===0
  ){

    contexts.push(
      "base"
    );

  }


  /*
     Remove duplicates
  */

  return [
    ...new Set(contexts)
  ];

}


/* =====================================================
   SNAPSHOT
===================================================== */

function captureSnapshot(){

  /*
     Force browser layout
  */

  void testTarget.offsetWidth;

  void testTarget.offsetHeight;


  const rect =
    testTarget.getBoundingClientRect();


  const style =
    getComputedStyle(
      testTarget
    );


  /*
     Main element
  */

  const main={

    x:rect.x,

    y:rect.y,

    width:rect.width,

    height:rect.height,

    top:rect.top,

    right:rect.right,

    bottom:rect.bottom,

    left:rect.left,

    scrollWidth:
      testTarget.scrollWidth,

    scrollHeight:
      testTarget.scrollHeight,

    clientWidth:
      testTarget.clientWidth,

    clientHeight:
      testTarget.clientHeight,

    display:
      style.display,

    position:
      style.position,

    widthCSS:
      style.width,

    heightCSS:
      style.height,

    margin:
      style.margin,

    padding:
      style.padding,

    border:
      style.border,

    color:
      style.color,

    background:
      style.background,

    opacity:
      style.opacity,

    visibility:
      style.visibility,

    overflow:
      style.overflow,

    overflowX:
      style.overflowX,

    overflowY:
      style.overflowY,

    transform:
      style.transform,

    transformOrigin:
      style.transformOrigin,

    fontSize:
      style.fontSize,

    lineHeight:
      style.lineHeight,

    letterSpacing:
      style.letterSpacing,

    wordSpacing:
      style.wordSpacing,

    whiteSpace:
      style.whiteSpace,

    textAlign:
      style.textAlign,

    flex:
      style.flex,

    flexDirection:
      style.flexDirection,

    flexWrap:
      style.flexWrap,

    justifyContent:
      style.justifyContent,

    alignItems:
      style.alignItems,

    alignContent:
      style.alignContent,

    alignSelf:
      style.alignSelf,

    gap:
      style.gap,

    rowGap:
      style.rowGap,

    columnGap:
      style.columnGap,

    gridTemplateColumns:
      style.gridTemplateColumns,

    gridTemplateRows:
      style.gridTemplateRows,

    gridColumn:
      style.gridColumn,

    gridRow:
      style.gridRow,

    gridArea:
      style.gridArea,

    zIndex:
      style.zIndex,

    columnCount:
      style.columnCount,

    columnWidth:
      style.columnWidth,

    columnGapCSS:
      style.columnGap

  };


  /*
     Children
  */

  const children =
    Array.from(
      testTarget.children
    );


  const childStates =
    children.map(
      child=>{

        const r =
          child.getBoundingClientRect();

        const s =
          getComputedStyle(
            child
          );


        return {

          x:r.x,

          y:r.y,

          width:r.width,

          height:r.height,

          display:s.display,

          position:s.position,

          margin:s.margin,

          padding:s.padding,

          transform:s.transform,

          opacity:s.opacity,

          color:s.color,

          background:s.background

        };

      }
    );


  return {

    main,

    children:
      childStates

  };

}


/* =====================================================
   SNAPSHOT DIFFERENCE
===================================================== */

function snapshotChanged(
  before,
  after
){

  /*
     Compare main element
  */

  const mainKeys =
    Object.keys(
      before.main
    );


  for(
    const key of mainKeys
  ){

    const a =
      before.main[key];

    const b =
      after.main[key];


    /*
       Geometry uses tolerance
    */

    if(
      typeof a==="number" &&
      typeof b==="number"
    ){

      if(
        Math.abs(a-b)>0.01
      ){

        return true;

      }

    }else{

      if(
        String(a)!==
        String(b)
      ){

        return true;

      }

    }

  }


  /*
     Compare children
  */

  if(
    before.children.length !==
    after.children.length
  ){

    return true;

  }


  for(
    let i=0;
    i<before.children.length;
    i++
  ){

    const a =
      before.children[i];

    const b =
      after.children[i];


    const keys =
      Object.keys(a);


    for(
      const key of keys
    ){

      if(
        String(a[key]) !==
        String(b[key])
      ){

        return true;

      }

    }

  }


  return false;

}


/* =====================================================
   GET COMPUTED VALUE
===================================================== */

function getComputedValue(
  property
){

  try{

    return getComputedStyle(
      testTarget
    )
      .getPropertyValue(
        property
      )
      .trim();

  }catch(error){

    return "";

  }

}


/* =====================================================
   APPLY PROPERTY
===================================================== */

function applyPropertyValue(
  property,
  value
){

  try{

    testTarget.style.setProperty(
      property,
      value
    );

    return true;

  }catch(error){

    return false;

  }

}


/* =====================================================
   REAL VALUE TEST
===================================================== */

async function testValueInContext(
  property,
  value,
  contextName
){

  /*
     Prepare context
  */

  const context =
    TEST_CONTEXTS[
      contextName
    ];


  if(!context){

    return {

      effect:false,

      unknown:true,

      reason:
        "Context not available"

    };

  }


  context();


  /*
     Baseline
  */

  void testTarget.offsetWidth;

  await nextFrame();


  const before =
    captureSnapshot();


  /*
     Apply value
  */

  const applied =
    applyPropertyValue(
      property,
      value
    );


  if(!applied){

    return {

      effect:false,

      unknown:true,

      reason:
        "Browser rejected value"

    };

  }


  /*
     Force style/layout
  */

  void testTarget.offsetWidth;

  void testTarget.offsetHeight;


  await nextFrame();


  void testTarget.offsetWidth;


  /*
     Computed value
  */

  const computed =
    getComputedValue(
      property
    );


  /*
     After
  */

  const after =
    captureSnapshot();


  /*
     Real difference
  */

  const changed =
    snapshotChanged(
      before,
      after
    );


  return {

    effect:
      changed,

    unknown:
      false,

    computed:
      computed,

    reason:
      changed

        ? "REAL EFFECT"

        : "NO EFFECT"

  };

}


/* =====================================================
   GET JSON VALUES
===================================================== */

function getValuesForProperty(
  property
){

  const item =
    PROPERTIES[
      property
    ];


  if(
    Array.isArray(item)
  ){

    return item;

  }


  if(
    item &&
    Array.isArray(item.values)
  ){

    return item.values;

  }


  if(
    item &&
    Array.isArray(item.candidates)
  ){

    return item.candidates;

  }


  if(
    item &&
    Array.isArray(item.staticValues)
  ){

    return item.staticValues;

  }


  return [];

}


/* =====================================================
   NORMALIZE VALUE
===================================================== */

function normalizeValue(
  value
){

  if(
    typeof value==="string"
  ){

    return value.trim();

  }


  if(
    typeof value==="number"
  ){

    return String(value);

  }


  if(
    value &&
    typeof value==="object"
  ){

    if(
      typeof value.value==="string"
    ){

      return value.value.trim();

    }

  }


  return "";

}


/* =====================================================
   PROPERTY RESULT OBJECT
===================================================== */

async function testPropertyEngine(
  property
){

  const values =
    getValuesForProperty(
      property
    );


  const contexts =
    getTestContexts(
      property
    );


  let propertyEffective=
    false;


  let testedValues=
    0;


  let effectiveValues=
    0;


  /*
     Avoid duplicate values
  */

  const seen =
    new Set();


  for(
    const rawValue of values
  ){

    if(stopped){

      break;

    }


    const value =
      normalizeValue(
        rawValue
      );


    if(
      !value ||
      seen.has(value)
    ){

      continue;

    }


    seen.add(value);


    testedValues++;

    totalTests++;


    currentProperty=
      property;

    currentValue=
      value;


    let valueEffective=
      false;


    /*
       Test dependency contexts
    */

    for(
      const contextName of contexts
    ){

      if(stopped){

        break;

      }


      currentContext=
        contextName;


      const result =
        await testValueInContext(
          property,
          value,
          contextName
        );


      /*
         The UI function will be
         supplied in PART 3.
      */

      if(
        typeof addTestResult ===
        "function"
      ){

        addTestResult(
          property,
          value,
          contextName,
          result
        );

      }


      if(result.effect){

        valueEffective=
          true;

        propertyEffective=
          true;

        break;

      }

    }


    if(valueEffective){

      effectiveValues++;

    }


    /*
       Update current property
    */

    if(
      typeof updatePropertyResult ===
      "function"
    ){

      updatePropertyResult(
        property,
        propertyEffective
      );

    }


    /*
       Allow browser to breathe
    */

    if(
      totalTests % 5 === 0
    ){

      await nextFrame();

    }

  }


  results[property]={

    effective:
      propertyEffective,

    valuesTested:
      testedValues,

    effectiveValues:
      effectiveValues,

    contexts:
      contexts

  };


  /*
     Property count is updated
     only once.
  */

  if(propertyEffective){

    effectiveProperties++;

  }else{

    ineffectiveProperties++;

  }


  if(
    typeof updatePropertyResult ===
    "function"
  ){

    updatePropertyResult(
      property,
      propertyEffective
    );

  }


  restoreTarget();

}


/* =====================================================
   UPDATE STATUS
===================================================== */

function updateEngineStatus(){

  progressEl.max =
    propertyNames.length || 1;


  progressEl.value =
    currentIndex;


  document.getElementById(
    "testedCount"
  ).textContent =
    currentIndex;


  document.getElementById(
    "greenCount"
  ).textContent =
    effectiveProperties;


  document.getElementById(
    "orangeCount"
  ).textContent =
    ineffectiveProperties;


  statusEl.textContent =
    "Property: "+
    currentIndex+
    " / "+
    propertyNames.length+
    "\n"+
    "Current: "+
    (
      currentProperty ||
      "-"
    )+
    "\n"+
    "Context: "+
    (
      currentContext ||
      "-"
    )+
    "\n"+
    "Tests: "+
    totalTests+
    "\n"+
    "TRUE: "+
    effectiveProperties+
    "\n"+
    "NO EFFECT: "+
    ineffectiveProperties;

  }
  /* =====================================================
   PART 3
   RESULTS + START / STOP / EXPORT
===================================================== */


/* =====================================================
   RESULT ELEMENT
===================================================== */

function getPropertyBox(property){

  return resultsEl.querySelector(
    '.property[data-property="' +
    CSS.escape(property) +
    '"]'
  );

}


/* =====================================================
   CREATE PROPERTY BOX
===================================================== */

function createPropertyBox(property){

  let box =
    getPropertyBox(property);


  if(box){

    return box;

  }


  box =
    document.createElement(
      "div"
    );


  box.className=
    "property orange";


  box.dataset.property=
    property;


  const button =
    document.createElement(
      "button"
    );


  button.className=
    "propertyButton";


  const name =
    document.createElement(
      "span"
    );


  name.textContent=
    property;


  const arrow =
    document.createElement(
      "span"
    );


  arrow.className=
    "arrow";


  arrow.textContent=
    "▶";


  button.appendChild(name);

  button.appendChild(arrow);


  const values =
    document.createElement(
      "div"
    );


  values.className=
    "propertyValues";


  button.onclick=()=>{

    const opened =
      values.style.display ===
      "block";


    values.style.display =
      opened
        ? "none"
        : "block";


    arrow.textContent =
      opened
        ? "▶"
        : "▼";

  };


  box.appendChild(button);

  box.appendChild(values);


  resultsEl.appendChild(box);


  return box;

}


/* =====================================================
   ADD VALUE RESULT
===================================================== */

function addTestResult(
  property,
  value,
  context,
  result
){

  const box =
    createPropertyBox(
      property
    );


  const values =
    box.querySelector(
      ".propertyValues"
    );


  /*
     Avoid duplicate value/context
  */

  const key =
    value +
    "||" +
    context;


  const old =
    values.querySelector(
      '[data-test-key="' +
      CSS.escape(key) +
      '"]'
    );


  if(old){

    return;

  }


  const item =
    document.createElement(
      "div"
    );


  item.className =
    result.effect
      ? "value effect"
      : (
          result.unknown
            ? "value unknown"
            : "value noEffect"
        );


  item.dataset.testKey=
    key;


  /*
     Main text
  */

  const title =
    document.createElement(
      "div"
    );


  title.textContent =
    value;


  item.appendChild(
    title
  );


  /*
     Context
  */

  const contextText =
    document.createElement(
      "div"
    );


  contextText.className=
    "reason";


  contextText.textContent =
    "Context: " +
    context;


  item.appendChild(
    contextText
  );


  /*
     Reason
  */

  const reason =
    document.createElement(
      "div"
    );


  reason.className=
    "reason";


  reason.textContent =
    result.reason ||
    "";


  item.appendChild(
    reason
  );


  /*
     Computed value
  */

  if(
    result.computed
  ){

    const computed =
      document.createElement(
        "div"
      );


    computed.className=
      "reason";


    computed.textContent =
      "Computed: " +
      result.computed;


    item.appendChild(
      computed
    );

  }


  values.appendChild(
    item
  );

}


/* =====================================================
   UPDATE PROPERTY RESULT
===================================================== */

function updatePropertyResult(
  property,
  effective
){

  const box =
    createPropertyBox(
      property
    );


  if(effective){

    box.classList.remove(
      "orange"
    );


    box.classList.add(
      "green"
    );

  }else{

    box.classList.remove(
      "green"
    );


    box.classList.add(
      "orange"
    );

  }


  updateEngineStatus();

}


/* =====================================================
   START ENGINE
===================================================== */

async function runTests(){

  if(!DATA){

    statusEl.textContent =
      "JSON لم يتم تحميله بعد.";

    return;

  }


  if(running){

    return;

  }


  running=true;

  stopped=false;


  startBtn.disabled=true;

  stopBtn.disabled=false;


  resetBtn.disabled=true;


  /*
     Continue from currentIndex
  */

  while(
    currentIndex <
    propertyNames.length
  ){

    if(stopped){

      break;

    }


    const property =
      propertyNames[
        currentIndex
      ];


    currentProperty=
      property;


    /*
       Make sure result box
       exists immediately.
    */

    createPropertyBox(
      property
    );


    updateEngineStatus();


    try{

      await testPropertyEngine(
        property
      );

    }catch(error){

      console.error(
        property,
        error
      );


      /*
         Unknown result instead
         of stopping whole laboratory.
      */

      results[property]={

        effective:false,

        error:
          error.message,

        valuesTested:0,

        effectiveValues:0

      };


      updatePropertyResult(
        property,
        false
      );

    }


    /*
       Property completed
    */

    currentIndex++;


    updateEngineStatus();


    /*
       Give UI time to update.
    */

    await nextFrame();

  }


  running=false;

  stopBtn.disabled=true;

  resetBtn.disabled=false;


  if(
    currentIndex >=
    propertyNames.length
  ){

    stopped=false;


    statusEl.textContent =
      "اكتمل الاختبار.\n"+
      "Properties: "+
      propertyNames.length+
      "\n"+
      "Tests: "+
      totalTests+
      "\n"+
      "Effective: "+
      effectiveProperties+
      "\n"+
      "No effect: "+
      ineffectiveProperties;


  }else{

    statusEl.textContent =
      "تم إيقاف الاختبار.\n"+
      "يمكن الضغط على START TEST "+
      "للمتابعة من Property "+
      currentIndex+".";

  }

}


/* =====================================================
   STOP
===================================================== */

stopBtn.onclick=()=>{

  if(!running){

    return;

  }


  stopped=true;


  stopBtn.disabled=true;


  statusEl.textContent =
    "جارٍ إيقاف الاختبار بعد انتهاء الاختبار الحالي...";

};


/* =====================================================
   START
===================================================== */

startBtn.onclick=()=>{

  if(!DATA){

    return;

  }


  if(running){

    return;

  }


  runTests();

};


/* =====================================================
   RESET
===================================================== */

resetBtn.onclick=()=>{

  if(running){

    return;

  }


  resetLab();

};


/* =====================================================
   SEARCH
===================================================== */

searchInput.oninput=()=>{

  const q =
    searchInput.value
      .trim()
      .toLowerCase();


  const boxes =
    resultsEl.querySelectorAll(
      ".property"
    );


  boxes.forEach(
    box=>{

      const property =
        (
          box.dataset.property ||
          ""
        ).toLowerCase();


      box.classList.toggle(
        "hidden",

        q &&
        !property.includes(q)

      );

    }
  );

};


/* =====================================================
   EXPORT
===================================================== */

function buildExportData(){

  const output={};


  /*
     Keep only properties that
     actually exist in results.
  */

  for(
    const property of propertyNames
  ){

    if(
      !results[property]
    ){

      continue;

    }


    const box =
      getPropertyBox(
        property
      );


    const values=[];


    if(box){

      const items =
        box.querySelectorAll(
          ".value"
        );


      items.forEach(
        item=>{

          const title =
            item.children[0]
              ? item.children[0]
                  .textContent
              : "";


          const reasonElements =
            item.querySelectorAll(
              ".reason"
            );


          let context="";

          let reason="";

          let computed="";


          reasonElements.forEach(
            element=>{

              const text =
                element.textContent;


              if(
                text.startsWith(
                  "Context:"
                )
              ){

                context =
                  text.replace(
                    "Context:",
                    ""
                  ).trim();

              }


              else if(
                text.startsWith(
                  "Computed:"
                )
              ){

                computed =
                  text.replace(
                    "Computed:",
                    ""
                  ).trim();

              }


              else if(
                !reason &&
                text
              ){

                reason=
                  text;

              }

            }
          );


          values.push({

            value:
              title,

            context:
              context,

            effect:
              item.classList.contains(
                "effect"
              ),

            unknown:
              item.classList.contains(
                "unknown"
              ),

            computed:
              computed,

            reason:
              reason

          });

        }
      );

    }


    output[property]={

      effective:
        !!results[property].effective,

      valuesTested:
        results[property]
          .valuesTested || 0,

      effectiveValues:
        results[property]
          .effectiveValues || 0,

      contexts:
        results[property]
          .contexts || [],

      values:
        values

    };

  }


  return {

    laboratory:
      "CSS Real Effect Laboratory",

    version:
      "1.0",

    date:
      new Date().toISOString(),

    propertyCount:
      propertyNames.length,

    testedProperties:
      currentIndex,

    totalTests:
      totalTests,

    effectiveProperties:
      effectiveProperties,

    ineffectiveProperties:
      ineffectiveProperties,

    properties:
      output

  };

}


/* =====================================================
   EXPORT BUTTON
===================================================== */

/*
   Create EXPORT button without
   changing the existing HTML.
*/

const exportBtn =
  document.createElement(
    "button"
  );


exportBtn.textContent=
  "EXPORT";


exportBtn.style.background=
  "#2563eb";


exportBtn.style.color=
  "white";


exportBtn.id=
  "exportBtn";


/*
   Put it next to RESET
*/

resetBtn.parentNode.insertBefore(
  exportBtn,
  resetBtn.nextSibling
);


exportBtn.onclick=()=>{

  const data =
    buildExportData();


  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href=url;

  a.download=
    "css-values-discovered-results.json";


  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );

};


/* =====================================================
   INITIAL UI
===================================================== */

updateEngineStatus();
</script>
