<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Titre de la page</title>
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
.parent{
    display:grid;

    grid-template-columns: 1fr 1fr;
    

    
}       
 
        .preview-panel{
    position:relative;
}

.parent div{
    background:red;
}
/* زر البرق */

.preview-flash{

    position:absolute;

    left:-18px;
    top:50%;

    transform:translateY(-50%);

    width:38px;
    height:38px;

    border:0;

    border-radius:50%;

    background:#111b35;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:1000;

    box-shadow:
        0 5px 20px rgba(0,0,0,.45);

    transition:.25s;
}


.preview-flash:hover{

    transform:
        translateY(-50%)
        scale(1.1);

    background:#f59e0b;

    color:#000;

}


/* القائمة العائمة */

.floating-tools{

    position:absolute;

    left:8px;

    top:50%;

    transform:
        translateY(-50%)
        translateX(-70px);

    width:50px;

    height:50%;

    min-height:180px;

    max-height:400px;

    padding:8px 5px;

    background:rgba(8,15,32,.96);

    border:1px solid #263653;

    border-radius:16px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:space-evenly;

    opacity:0;

    visibility:hidden;

    pointer-events:none;

    z-index:999;

    box-shadow:
        0 15px 45px rgba(0,0,0,.55),
        0 0 25px rgba(59,130,246,.12);

    backdrop-filter:blur(12px);

    transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s;
}


/* ظهور القائمة */

.floating-tools.show{

    opacity:1;

    visibility:visible;

    pointer-events:auto;

    transform:
        translateY(-50%)
        translateX(0);

}


/* أزرار القائمة */

.floating-tools button{

    width:36px;
    height:36px;

    flex-shrink:0;

    border:0;

    border-radius:10px;

    background:#111b35;

    color:#94a3b8;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    font-size:17px;

    transition:
        .2s;

}


.floating-tools button:hover{

    background:#3b82f6;

    color:white;

    transform:scale(1.1);

}


.floating-tools button:active{

    transform:scale(.92);

}
    </style>
</head>
<body> 
  
<!-- زر Flash -->

<button type="button" class="preview-flash">
    <i class="fa-solid fa-bolt"></i>
</button>


<!-- القائمة العائمة -->

<div class="floating-tools">

    <button type="button" title="Cloudflare">
        <i class="fa-solid fa-cloud"></i>
    </button>

    <button type="button" title="HTML">
        <i class="fa-brands fa-html5"></i>
    </button>

    <button type="button" title="CSS">
        <i class="fa-brands fa-css3-alt"></i>
    </button>

    <button type="button" title="JavaScript">
        <i class="fa-brands fa-js"></i>
    </button>

    <button type="button" title="Image">
        <i class="fa-solid fa-image"></i>
    </button>

    <button type="button" title="Settings">
        <i class="fa-solid fa-gear"></i>
    </button>

</div>


<script>

const flashButton =
    document.querySelector(".preview-flash");

const floatingTools =
    document.querySelector(".floating-tools");


flashButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        floatingTools.classList.toggle("show");

    }
);

</script>

</body>
</html>
