<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Budget Phones | TechDealsHub</title>

<meta
    name="description"
    content="Discover the best budget smartphones with great performance, battery life, cameras and value for money."
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>


<style>

/* =========================================================
   ROOT
========================================================= */

:root{

    --bg:#f6f8fb;

    --white:#ffffff;

    --dark:#0f172a;

    --text:#334155;

    --muted:#64748b;

    --light:#94a3b8;

    --border:#e7ebf0;

    --primary:#2563eb;

    --primary-light:#eff6ff;

    --green:#16a34a;

    --red:#ef4444;

    --yellow:#f59e0b;

    --shadow:
        0 10px 35px rgba(15,23,42,.07);

    --shadow-hover:
        0 20px 45px rgba(15,23,42,.12);

}


/* =========================================================
   RESET
========================================================= */

*{

    box-sizing:border-box;

    margin:0;

    padding:0;

    font-family:
        Inter,
        Arial,
        sans-serif;

}


html{

    scroll-behavior:smooth;

}


body{

    background:var(--bg);

    color:var(--text);

    line-height:1.5;

}


button,
input,
select{

    font-family:inherit;

}


button{

    border:0;

}


a{

    color:inherit;

    text-decoration:none;

}


/* =========================================================
   CONTAINER
========================================================= */

.container{

    width:min(
        1200px,
        calc(100% - 32px)
    );

    margin:auto;

}


/* =========================================================
   HEADER
========================================================= */

.site-header{

    position:sticky;

    top:0;

    z-index:1000;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:
        blur(14px);

    border-bottom:
        1px solid var(--border);

}


.header-inner{

    height:66px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:25px;

}


/* =========================================================
   LOGO
========================================================= */

.logo{

    display:flex;

    align-items:center;

    gap:8px;

    color:var(--dark);

    font-size:18px;

    font-weight:900;

    letter-spacing:-.05em;

    white-space:nowrap;

}


.logo-icon{

    width:34px;

    height:34px;

    display:grid;

    place-items:center;

    border-radius:10px;

    background:var(--primary);

    color:white;

    font-size:14px;

}


.logo > span:not(.logo-icon){

    color:var(--primary);

}


/* =========================================================
   NAVIGATION
========================================================= */

.main-nav{

    display:flex;

    align-items:center;

    gap:5px;

}


.main-nav a{

    padding:
        8px
        11px;

    border-radius:8px;

    color:var(--muted);

    font-size:11px;

    font-weight:800;

    transition:.2s ease;

}


.main-nav a:hover{

    background:#f8fafc;

    color:var(--primary);

}


.main-nav a.active{

    background:var(--primary-light);

    color:var(--primary);

}


/* =========================================================
   HEADER ACTIONS
========================================================= */

.header-actions{

    display:flex;

    align-items:center;

    gap:7px;

}


.header-action{

    width:35px;

    height:35px;

    display:grid;

    place-items:center;

    border:
        1px solid var(--border);

    border-radius:9px;

    background:white;

    color:var(--muted);

    cursor:pointer;

    transition:.2s ease;

}


.header-action:hover{

    border-color:#bfdbfe;

    color:var(--primary);

    background:var(--primary-light);

}


/* =========================================================
   MENU BUTTON
========================================================= */

.menu-btn{

    display:none;

}


/* =========================================================
   HERO
========================================================= */

.hero-section{

    padding:
        45px
        0
        28px;

}


.hero{

    position:relative;

    overflow:hidden;

    min-height:300px;

    display:flex;

    align-items:center;

    padding:
        45px
        50px;

    border:
        1px solid var(--border);

    border-radius:25px;

    background:

        radial-gradient(
            circle at 85% 15%,
            rgba(37,99,235,.12),
            transparent 30%
        ),

        radial-gradient(
            circle at 70% 100%,
            rgba(59,130,246,.08),
            transparent 32%
        ),

        white;

    box-shadow:var(--shadow);

}


.hero-content{

    position:relative;

    z-index:2;

    max-width:680px;

}


.hero-label{

    display:inline-flex;

    align-items:center;

    gap:7px;

    margin-bottom:12px;

    color:var(--primary);

    font-size:10px;

    font-weight:900;

    letter-spacing:.1em;

    text-transform:uppercase;

}


.hero-label i{

    font-size:11px;

}


.hero h1{

    color:var(--dark);

    font-size:
        clamp(
            34px,
            5vw,
            58px
        );

    line-height:1.03;

    letter-spacing:-.055em;

}


.hero h1 span{

    color:var(--primary);

}


.hero p{

    max-width:610px;

    margin-top:15px;

    color:var(--muted);

    font-size:13px;

    line-height:1.8;

}


.hero-stats{

    display:flex;

    flex-wrap:wrap;

    gap:9px;

    margin-top:23px;

}


.hero-stat{

    display:flex;

    align-items:center;

    gap:8px;

    padding:
        8px
        12px;

    border:
        1px solid var(--border);

    border-radius:9px;

    background:
        rgba(255,255,255,.8);

}


.hero-stat i{

    color:var(--primary);

    font-size:11px;

}


.hero-stat strong{

    color:var(--dark);

    font-size:10px;

}


.hero-stat span{

    color:var(--muted);

    font-size:9px;

}


/* =========================================================
   HERO DECORATION
========================================================= */

.hero-decoration{

    position:absolute;

    right:35px;

    top:50%;

    width:230px;

    height:230px;

    transform:
        translateY(-50%);

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #dbeafe
        );

    opacity:.9;

}


.hero-decoration::before{

    content:"";

    position:absolute;

    width:95px;

    height:180px;

    left:68px;

    top:25px;

    border:
        5px solid
        #bfdbfe;

    border-radius:22px;

    transform:
        rotate(12deg);

}


.hero-decoration::after{

    content:"";

    position:absolute;

    width:43px;

    height:5px;

    left:94px;

    top:43px;

    border-radius:10px;

    background:#bfdbfe;

    transform:
        rotate(12deg);

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar-section{

    padding:
        8px
        0
        20px;

}


.toolbar{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:
        13px;

    border:
        1px solid var(--border);

    border-radius:16px;

    background:white;

    box-shadow:
        0 5px 20px rgba(15,23,42,.035);

}


.search-box{

    position:relative;

    width:
        min(
            350px,
            100%
        );

}


.search-box i{

    position:absolute;

    left:13px;

    top:50%;

    transform:
        translateY(-50%);

    color:#94a3b8;

    font-size:11px;

}


.search-box input{

    width:100%;

    height:38px;

    padding:
        0
        13px
        0
        35px;

    outline:none;

    border:
        1px solid var(--border);

    border-radius:9px;

    background:#f8fafc;

    color:var(--dark);

    font-size:10px;

    font-weight:600;

}


.search-box input:focus{

    border-color:#93c5fd;

    background:white;

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.07);

}


.toolbar-right{

    display:flex;

    align-items:center;

    gap:8px;

}


.sort-select{

    height:38px;

    padding:
        0
        28px
        0
        11px;

    border:
        1px solid var(--border);

    border-radius:9px;

    background:white;

    color:var(--text);

    outline:none;

    font-size:10px;

    font-weight:800;

}


.view-switch{

    display:flex;

    gap:4px;

    padding:3px;

    border-radius:9px;

    background:#f1f5f9;

}


.view-btn{

    width:32px;

    height:32px;

    display:grid;

    place-items:center;

    border-radius:7px;

    background:transparent;

    color:#94a3b8;

    cursor:pointer;

}


.view-btn.active{

    background:white;

    color:var(--primary);

    box-shadow:
        0 2px 7px rgba(15,23,42,.08);

}


/* =========================================================
   FILTERS
========================================================= */

.filters-section{

    padding:
        0
        0
        25px;

}


.filters{

    display:flex;

    align-items:center;

    gap:7px;

    flex-wrap:wrap;

}


.brand-filter{

    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:
        8px
        13px;

    border:
        1px solid var(--border);

    border-radius:999px;

    background:white;

    color:var(--muted);

    cursor:pointer;

    font-size:9px;

    font-weight:900;

    transition:.2s ease;

}


.brand-filter:hover{

    border-color:#bfdbfe;

    color:var(--primary);

}


.brand-filter.active{

    border-color:var(--primary);

    background:var(--primary);

    color:white;

}


.brand-filter i{

    font-size:9px;

}


/* =========================================================
   RESULTS HEADER
========================================================= */

.results-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:14px;

}


.results-title{

    color:var(--dark);

    font-size:20px;

    font-weight:900;

    letter-spacing:-.035em;

}


.results-count{

    color:var(--muted);

    font-size:10px;

    font-weight:700;

}


/* =========================================================
   PHONE GRID
========================================================= */

.phones-section{

    padding:
        0
        0
        60px;

}


.phone-grid{

    display:grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );

    gap:20px;

}


/* =========================================================
   PHONE CARD
========================================================= */

.phone-card{

    position:relative;

    overflow:hidden;

    border:
        1px solid var(--border);

    border-radius:18px;

    background:white;

    box-shadow:var(--shadow);

    transition:
        transform .22s ease,
        box-shadow .22s ease,
        border-color .22s ease;

}


.phone-card:hover{

    transform:
        translateY(-6px);

    border-color:#bfdbfe;

    box-shadow:var(--shadow-hover);

}


/* =========================================================
   IMAGE
========================================================= */

.phone-image{

    position:relative;

    height:245px;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #f8fafc,
            #eef2f7
        );

}


.phone-image img{

    width:100%;

    height:100%;

    object-fit:cover;

    transition:
        transform .35s ease;

}


.phone-card:hover
.phone-image img{

    transform:
        scale(1.035);

}


/* =========================================================
   BADGE
========================================================= */

.badge{

    position:absolute;

    z-index:3;

    top:13px;

    left:13px;

    display:inline-flex;

    align-items:center;

    gap:5px;

    padding:
        6px
        10px;

    border-radius:999px;

    background:var(--primary);

    color:white;

    font-size:8px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:.05em;

}


.badge.value{

    background:#16a34a;

}


.badge.popular{

    background:#f59e0b;

}


/* =========================================================
   CARD ACTIONS
========================================================= */

.card-actions{

    position:absolute;

    z-index:4;

    top:13px;

    right:13px;

    display:flex;

    gap:5px;

}


.card-action{

    width:31px;

    height:31px;

    display:grid;

    place-items:center;

    border:
        1px solid rgba(255,255,255,.7);

    border-radius:8px;

    background:
        rgba(255,255,255,.92);

    color:#64748b;

    cursor:pointer;

    backdrop-filter:blur(5px);

    transition:.2s ease;

}


.card-action:hover{

    color:var(--primary);

    background:white;

}


.card-action.favorite-btn.active{

    color:var(--red);

}


.favorite-pop{

    animation:
        favoritePop .3s ease;

}


@keyframes favoritePop{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.25);
    }

    100%{
        transform:scale(1);
    }

}


/* =========================================================
   CARD CONTENT
========================================================= */

.phone-content{

    padding:19px;

}


.phone-brand{

    margin-bottom:5px;

    color:var(--primary);

    font-size:8px;

    font-weight:900;

    letter-spacing:.08em;

    text-transform:uppercase;

}


.phone-name{

    color:var(--dark);

    font-size:19px;

    line-height:1.2;

    font-weight:900;

    letter-spacing:-.035em;

}


.phone-description{

    min-height:38px;

    margin-top:7px;

    color:var(--muted);

    font-size:10px;

    line-height:1.65;

}


/* =========================================================
   RATING
========================================================= */

.card-rating{

    display:flex;

    align-items:center;

    gap:6px;

    margin-top:11px;

}


.stars{

    color:#f59e0b;

    font-size:10px;

    letter-spacing:1px;

}


.rating-number{

    color:var(--dark);

    font-size:10px;

    font-weight:900;

}


.rating-count{

    color:#94a3b8;

    font-size:9px;

}


/* =========================================================
   PRICE
========================================================= */

.price-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-top:14px;

    padding-top:13px;

    border-top:
        1px solid #f0f2f5;

}


.price{

    color:var(--primary);

    font-size:21px;

    font-weight:900;

    letter-spacing:-.04em;

}


.price-label{

    color:#94a3b8;

    font-size:8px;

    font-weight:700;

}


/* =========================================================
   SPECS
========================================================= */

.specs{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:7px;

    margin-top:13px;

}


.spec{

    padding:
        9px;

    border-radius:9px;

    background:#f8fafc;

}


.spec-label{

    display:block;

    color:#94a3b8;

    font-size:7px;

    font-weight:700;

    text-transform:uppercase;

}


.spec-value{

    display:block;

    margin-top:2px;

    color:#334155;

    font-size:9px;

    font-weight:900;

}


/* =========================================================
   CARD FOOTER
========================================================= */

.card-footer{

    display:flex;

    align-items:center;

    gap:7px;

    margin-top:14px;

}


.details-btn{

    flex:1;

    min-height:37px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    border-radius:9px;

    background:var(--primary);

    color:white;

    font-size:9px;

    font-weight:900;

    transition:.2s ease;

}


.details-btn:hover{

    background:#1d4ed8;

}


.details-btn i{

    font-size:9px;

}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state{

    display:none;

    padding:
        60px
        20px;

    text-align:center;

    border:
        1px solid var(--border);

    border-radius:18px;

    background:white;

}


.empty-state.show{

    display:block;

}


.empty-icon{

    width:55px;

    height:55px;

    display:grid;

    place-items:center;

    margin:0 auto 14px;

    border-radius:15px;

    background:var(--primary-light);

    color:var(--primary);

    font-size:20px;

}


.empty-state h3{

    color:var(--dark);

    font-size:18px;

}


.empty-state p{

    margin-top:5px;

    color:var(--muted);

    font-size:10px;

}


/* =========================================================
   LIST MODE
========================================================= */

.phone-grid.list-mode{

    grid-template-columns:1fr;

}


.phone-grid.list-mode
.phone-card{

    display:grid;

    grid-template-columns:260px 1fr;

}


.phone-grid.list-mode
.phone-image{

    height:100%;

    min-height:250px;

}


.phone-grid.list-mode
.phone-content{

    padding:24px;

}


.phone-grid.list-mode
.phone-description{

    max-width:700px;

}


.phone-grid.list-mode
.specs{

    grid-template-columns:
        repeat(4,1fr);

}


.phone-grid.list-mode
.card-footer{

    max-width:500px;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){

    .main-nav{

        display:none;

    }


    .menu-btn{

        display:grid;

    }


    .phone-grid{

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );

    }


    .hero-decoration{

        right:-45px;

        opacity:.45;

    }

}


@media(max-width:700px){

    .container{

        width:
            calc(100% - 22px);

    }


    .header-inner{

        height:60px;

    }


    .hero-section{

        padding-top:20px;

    }


    .hero{

        min-height:auto;

        padding:30px 24px;

    }


    .hero-decoration{

        display:none;

    }


    .hero h1{

        font-size:38px;

    }


    .toolbar{

        align-items:stretch;

        flex-direction:column;

    }


    .search-box{

        width:100%;

    }


    .toolbar-right{

        justify-content:space-between;

    }


    .phone-grid{

        grid-template-columns:1fr;

    }


    .phone-grid.list-mode
    .phone-card{

        display:block;

    }


    .phone-grid.list-mode
    .phone-image{

        height:245px;

        min-height:0;

    }


    .phone-grid.list-mode
    .specs{

        grid-template-columns:
            repeat(2,1fr);

    }

}


@media(max-width:450px){

    .hero{

        border-radius:18px;

        padding:25px 19px;

    }


    .hero h1{

        font-size:33px;

    }


    .hero p{

        font-size:11px;

    }


    .hero-stats{

        display:grid;

        grid-template-columns:
            1fr 1fr;

    }


    .results-header{

        align-items:flex-end;

    }


    .results-title{

        font-size:18px;

    }


    .phone-image{

        height:230px;

    }


    .phone-content{

        padding:16px;

    }

}

</style>

</head>


<body>


<!-- ======================
