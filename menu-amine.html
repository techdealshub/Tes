<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>CSS Real Effect Tester</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 20px;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
}


/* =================================================
   MANUAL TEST
================================================= */

#manualTest {

    padding: 12px;

    margin-bottom: 15px;

    background: #1c1c1c;

    border-radius: 7px;
}


#manualProperty,
#manualValue {

    width: 100%;

    padding: 11px;

    margin-bottom: 8px;

    background: #222;

    color: white;

    border: 1px solid #444;

    border-radius: 5px;

    font-size: 16px;

    direction: ltr;

    text-align: left;
}


#manualButton {

    padding: 10px 18px;

    background: #333;

    color: white;

    border: 0;

    border-radius: 5px;

    cursor: pointer;
}


#manualResult {

    margin-top: 10px;

    padding: 10px;

    background: #080808;

    border-radius: 5px;

    direction: ltr;

    text-align: left;
}


#manualResult.green {
    color: #00ff66;
}

#manualResult.blue {
    color: #3399ff;
}

#manualResult.white {
    color: #ffffff;
}

#manualResult.red {
    color: #ff3333;
}


/* =================================================
   SEARCH
================================================= */

#search {

    width: 100%;

    padding: 12px;

    margin-bottom: 10px;

    background: #222;

    color: white;

    border: 1px solid #444;

    border-radius: 6px;

    font-size: 16px;
}


/* =================================================
   INFO
================================================= */

#info {

    margin: 10px 0;

    padding: 10px;

    background: #1c1c1c;

    border-radius: 6px;
}


/* =================================================
   TEST AREA
================================================= */

#testArea {

    display: grid;

    z-index: 900;

    background: #111;

    padding: 12px 15px;

    border-bottom: 1px solid #333;
}


/* =================================================
   TEST DIV
================================================= */

#testDiv {
    
  
   display: grid;
    width: 150px;

    height: 200px;

    padding: 10px;

    background: #444;

    color: white;

    border: 2px solid #888;
}


/* =================================================
   CHILDREN
================================================= */

.test-item {
   
     display: flex;
    width: 45px;

    height: 40px;

    margin: 3px;

    padding: 0;

    background: #666;

    border: 1px solid #aaa;

    text-align: center;

    line-height: 40px;
}


/* =================================================
   GRANDCHILD
================================================= */

.test-grandchild {
   
    
    width: 18px;

    height: 18px;

    margin: 2px;

    background: #999;

    border: 1px solid white;

    font-size: 9px;

    line-height: 18px;

}


/* =================================================
   TEST CODE
================================================= */

#testCode {

    margin-top: 8px;

    padding: 8px;

    background: #080808;

    border-radius: 5px;

    color: #aaa;

    font-family: monospace;

    direction: ltr;

    text-align: left;

    overflow-wrap: anywhere;
}
  /* =================================================
   PROPERTIES
================================================= */

#properties {

    display: flex;

    gap: 5px;

    margin-top: 15px;

    max-height: 350px;

    overflow-y: auto;
}


.property {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    padding: 10px;

    background: #1c1c1c;

    border-radius: 5px;

    cursor: pointer;

    direction: ltr;

    text-align: left;
}


.property:hover {

    background: #292929;
}


/* =================================================
   PROPERTY COLORS
================================================= */

.property.green {

    background: #063d20;

    color: #00ff66;
}


.property.blue {

    background: #07345c;

    color: #3399ff;
}


.property.white {

    background: #ddd;

    color: #111;
}


.property.red {

    background: #4a0808;

    color: #ff3333;
}


.propertyName {

    font-family: monospace;

    font-weight: bold;
}


.propertyResult {

    display: flex;

    align-items: center;

    gap: 7px;
}


.boolean {

    font-family: monospace;

    font-weight: bold;
}


.boolean.true {

    color: #00ff66;
}


.boolean.false {

    color: #ff3333;
}


.target {

    font-size: 11px;

    color: #aaa;
}


/* =================================================
   VALUES
================================================= */

#values {

    margin-top: 15px;

    max-height: 500px;

    overflow-y: auto;
}


.value {

    display: flex;

    justify-content: space-between;

    padding: 9px 10px;

    margin-bottom: 5px;

    background: #1c1c1c;

    border-radius: 5px;

    cursor: pointer;

    direction: ltr;

    text-align: left;
}


.value:hover {

    background: #292929;
}


.value.green {

    background: #063d20;

    color: #00ff66;
}


.value.blue {

    background: #07345c;

    color: #3399ff;
}


.value.white {

    background: #ddd;

    color: #111;
}


.value.red {

    background: #4a0808;

    color: #ff3333;
}


/* =================================================
   PROGRESS
================================================= */

#progressBox {

    display: none;

    margin-top: 10px;

    padding: 10px;

    background: #1c1c1c;

    border-radius: 6px;
}


#progressBar {

    width: 100%;

    height: 12px;

    margin-top: 7px;

    border-radius: 10px;

}


#progressFill {

    width: 0%;

}


#progressText {

    font-family: monospace;

    text-align: left;
}


/* =================================================
   BUTTONS
================================================= */

#controls {

    display: flex;

    gap: 7px;

    margin-top: 10px;
}


.controlButton {

}


#startButton {

#stopButton {

/* =================================================
   STATS
================================================= */

#stats {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,

        );

    gap: 5px;

    margin-top: 10px;
}


.stat {

    padding: 8px;

    border-radius: 5px;

}

}


.statLabel {

    font-size: 11px;

    color: #aaa;
}


.stat.green .statNumber {
    color: #00ff66;
}


.stat.blue .statNumber {
    color: #3399ff;
}


.stat.white .statNumber {
    color: white;
}


.stat.red .statNumber {
    color: #ff3333;
}


/* =================================================
   JSON
================================================= */

#jsonResult {

    width: 100%;

    min-height: 250px;

    margin-top: 15px;

    padding: 10px;

    background: #080808;

    color: #aaa;

    border: 1px solid #333;

    border-radius: 5px;

    font-family: monospace;

    direction: ltr;

    text-align: left;
}

<h2>CSS Real Effect Tester</h2>

<input

>

    </button>

    </button>

    <div class="stat">

        </span>

        </span>

    <div class="stat white">

        <span
            id="grandchildCount"
            class="statNumber"
        >
            0
        </span>

        </span>

    </div>


    <div class="stat red">

        <span
            id="falseCount"
            class="statNumber"
        >
            0
        </span>

        </span>

    </div>

</div>


<div id="testArea">

    <div id="testDiv">

        <div class="test-item">

            1

            <div class="test-grandchild">
                G
            </div>

        </div>


        <div class="test-item">

            2

            <div class="test-grandchild">
                G
            </div>

        </div>


        <div class="test-item">

            3

            <div class="test-grandchild">
                G
            </div>

        </div>

    </div>


    <div id="testCode">
        اختر Property ثم Value
    </div>

</div>


<div id="properties"></div>


<div id="values"></div>


<h3>
    Automatic Results JSON
</h3>


<textarea
    id="jsonResult"
    readonly
    placeholder="ستظهر النتائج هنا..."
></textarea>
<script>

let propertyData = {};

let testedResults = {};

let scanning = false;

let stopScanning = false;


const propertyBox =
    document.getElementById(
        "properties"
    );


const valuesBox =
    document.getElementById(
        "values"
    );


const info =
    document.getElementById(
        "info"
    );


const testDiv =
    document.getElementById(
        "testDiv"
    );


const testCode =
    document.getElementById(
        "testCode"
    );


const progressBox =
    document.getElementById(
        "progressBox"
    );


const progressFill =
    document.getElementById(
        "progressFill"
    );


const progressText =
    document.getElementById(
        "progressText"
    );


const jsonResult =
    document.getElementById(
        "jsonResult"
    );


/* =================================================
   LOAD JSON
================================================= */

fetch(
    "./css-values-discovered.json"
)

.then(response => {

    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }

    return response.json();

})

.then(data => {

    propertyData =
        data.properties || data;


    info.innerHTML =
        "✅ JSON Loaded<br>" +
        "Properties: " +
        Object.keys(
            propertyData
        ).length;


    showProperties();


    setTimeout(
        startAutomaticScan,
        500
    );

})

.catch(error => {

    info.innerHTML =
        "❌ JSON Error: " +
        error.message;

});


/* =================================================
   GET VALUES
================================================= */

function getValues(property) {

    const data =
        propertyData[property];


    if (!data) {

        return [];

    }


    if (Array.isArray(data)) {

        return data;

    }


    if (
        Array.isArray(
            data.values
        )
    ) {

        return data.values;

    }


    if (
        Array.isArray(
            data.value
        )
    ) {

        return data.value;

    }


    return [];

}


/* =================================================
   NORMALIZE VALUE
================================================= */

function normalizeValue(value) {

    if (
        value &&
        typeof value === "object"
    ) {

        if (
            typeof value.value ===
            "string"
        ) {

            return value.value;

        }


        if (
            typeof value.name ===
            "string"
        ) {

            return value.name;

        }


        return JSON.stringify(
            value
        );

    }


    return String(value);

}


/* =================================================
   SHOW PROPERTIES
================================================= */

function showProperties(
    search = ""
) {

    propertyBox.innerHTML = "";


    const query =
        search
        .toLowerCase()
        .trim();


    Object.keys(propertyData)

    .filter(property =>

        property
        .toLowerCase()
        .includes(query)

    )

    .forEach(property => {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "property";


        element.dataset.property =
            property;


        const name =
            document.createElement(
                "span"
            );


        name.className =
            "propertyName";


        name.textContent =
            property;


        const resultBox =
            document.createElement(
                "div"
            );


        resultBox.className =
            "propertyResult";


        const result =
            testedResults[property];


        if (result) {

            setPropertyColor(
                element,
                result.target
            );


            const bool =
                document.createElement(
                    "span"
                );


            bool.className =
                "boolean " +
                (
                    result.true
                    ? "true"
                    : "false"
                );


            bool.textContent =
                result.true
                ? "true"
                : "false";


            resultBox.appendChild(
                bool
            );


            if (
                result.target
            ) {

                const target =
                    document.createElement(
                        "span"
                    );


                target.className =
                    "target";


                target.textContent =
                    result.target;


                resultBox.appendChild(
                    target
                );

            }

        }


        element.appendChild(
            name
        );


        element.appendChild(
            resultBox
        );


        element.onclick = () => {

            showValues(
                property
            );

        };


        propertyBox.appendChild(
            element
        );

    });

}


/* =================================================
   COLOR
================================================= */

function setPropertyColor(
    element,
    target
) {

    element.classList.remove(
        "green",
        "blue",
        "white",
        "red"
    );


    if (
        target === "parent"
    ) {

        element.classList.add(
            "green"
        );

    }

    else if (
        target === "child"
    ) {

        element.classList.add(
            "blue"
        );

    }

    else if (
        target === "grandchild"
    ) {

        element.classList.add(
            "white"
        );

    }

    else {

        element.classList.add(
            "red"
        );

    }

}


/* =================================================
   KEY
================================================= */

function makeKey(
    property,
    value
) {

    return (
        property +
        "::" +
        value
    );

}


/* =================================================
   CAPTURE
================================================= */

function captureState(
    element
) {

    const style =
        getComputedStyle(
            element
        );


    const rect =
        element.getBoundingClientRect();


    const state = {

        css: {},

        rect: {

            x: rect.x,

            y: rect.y,

            top: rect.top,

            right: rect.right,

            bottom: rect.bottom,

            left: rect.left,

            width: rect.width,

            height: rect.height

        },

        children: []

    };


    for (
        let i = 0;
        i < style.length;
        i++
    ) {

        const name =
            style[i];


        state.css[name] =
            style.getPropertyValue(
                name
            );

    }


    for (
        let i = 0;
        i < element.children.length;
        i++
    ) {

        state.children.push(
            captureState(
                element.children[i]
            )
        );

    }


    return state;

}


/* =================================================
   NODE CHANGED
================================================= */

function nodeChanged(
    before,
    after
) {

    const EPSILON =
        0.01;


    const rectKeys = [

        "x",
        "y",
        "top",
        "right",
        "bottom",
        "left",
        "width",
        "height"

    ];


    for (
        const key of rectKeys
    ) {

        if (
            Math.abs(
                before.rect[key] -
                after.rect[key]
            ) > EPSILON
        ) {

            return true;

        }

    }


    const keys =
        new Set([
            ...Object.keys(
                before.css
            ),

            ...Object.keys(
                after.css
            )
        ]);


    for (
        const key of keys
    ) {

        if (
            before.css[key] !==
            after.css[key]
        ) {

            return true;

        }

    }


    return false;

}


/* =================================================
   DETECT TARGET
================================================= */

function detectTarget(
    before,
    after
) {

    if (
        nodeChanged(
            before,
            after
        )
    ) {

        return "parent";

    }


    for (
        let i = 0;
        i < before.children.length;
        i++
    ) {

        const beforeChild =
            before.children[i];


        const afterChild =
            after.children[i];


        if (!afterChild) {

            continue;

        }


        if (
            nodeChanged(
                beforeChild,
                afterChild
            )
        ) {

            return "child";

        }


        for (
            let j = 0;
            j < beforeChild.children.length;
            j++
        ) {

            const beforeGrand =
                beforeChild.children[j];


            const afterGrand =
                afterChild.children[j];


            if (!afterGrand) {

                continue;

            }


            if (
                nodeChanged(
                    beforeGrand,
                    afterGrand
                )
            ) {

                return "grandchild";

            }

        }

    }


    return null;

}


/* =================================================
   RESTORE
================================================= */

function restoreStyle(
    oldStyle
) {

    if (
        oldStyle === null
    ) {

        testDiv.removeAttribute(
            "style"
        );

    }

    else {

        testDiv.setAttribute(
            "style",
            oldStyle
        );

    }

}


/* =================================================
   TEST CSS
================================================= */
function testCSS(property, value) {

    let supported = false;

    try {

        supported = CSS.supports(
            property,
            value
        );

    } catch (error) {

        supported = false;

    }

    if (!supported) {

        return {
            true: false,
            target: null
        };

    }


    /*
    =========================================
    العناصر التي سنختبر عليها
    =========================================
    */

    const child =
        testDiv.children[0];

    const grandchild =
        child
        ? child.children[0]
        : null;


    /*
    =========================================
    اختبار Parent
    =========================================
    */

    const parentResult =
        testOneElement(
            testDiv,
            property,
            value
        );


    if (parentResult) {

        return {
            true: true,
            target: "parent"
        };

    }


    /*
    =========================================
    اختبار Child
    =========================================
    */

    if (child) {

        const childResult =
            testOneElement(
                child,
                property,
                value
            );


        if (childResult) {

            return {
                true: true,
                target: "child"
            };

        }

    }


    /*
    =========================================
    اختبار Grandchild
    =========================================
    */

    if (grandchild) {

        const grandResult =
            testOneElement(
                grandchild,
                property,
                value
            );


        if (grandResult) {

            return {
                true: true,
                target: "grandchild"
            };

        }

    }


    return {
        true: false,
        target: null
    };

}
  function testOneElement(
    element,
    property,
    value
) {

    /*
    =========================================
    حفظ CSS الأصلي
    =========================================
    */

    const oldStyle =
        element.getAttribute(
            "style"
        );


    /*
    =========================================
    الحالة قبل
    =========================================
    */

    const before =
        captureLayout(
            testDiv
        );


    /*
    =========================================
    تطبيق الخاصية على العنصر المطلوب
    =========================================
    */

    try {

        element.style.setProperty(
            property,
            value
        );

    } catch (error) {

        restoreElementStyle(
            element,
            oldStyle
        );

        return false;

    }


    /*
    =========================================
    إجبار Layout
    =========================================
    */

    void testDiv.offsetWidth;

    void testDiv.offsetHeight;


    /*
    =========================================
    الحالة بعد
    =========================================
    */

    const after =
        captureLayout(
            testDiv
        );


    /*
    =========================================
    هل حدث تأثير حقيقي؟
    =========================================
    */

    const changed =
        layoutChanged(
            before,
            after
        );


    /*
    =========================================
    إعادة CSS
    =========================================
    */

    restoreElementStyle(
        element,
        oldStyle
    );


    return changed;

  }
  function captureLayout(element) {

    const rect =
        element.getBoundingClientRect();


    const state = {

        rect: {

            x: rect.x,

            y: rect.y,

            top: rect.top,

            right: rect.right,

            bottom: rect.bottom,

            left: rect.left,

            width: rect.width,

            height: rect.height

        },

        children: []

    };


    for (
        let i = 0;
        i < element.children.length;
        i++
    ) {

        state.children.push(
            captureLayout(
                element.children[i]
            )
        );

    }


    return state;

  }
  function layoutChanged(
    before,
    after
) {

    const EPSILON = 0.01;


    function changedRect(
        a,
        b
    ) {

        const keys = [

            "x",
            "y",
            "top",
            "right",
            "bottom",
            "left",
            "width",
            "height"

        ];


        for (
            const key of keys
        ) {

            if (
                Math.abs(
                    a[key] -
                    b[key]
                ) > EPSILON
            ) {

                return true;

            }

        }


        return false;

    }


    /*
    =========================================
    العنصر نفسه
    =========================================
    */

    if (
        changedRect(
            before.rect,
            after.rect
        )
    ) {

        return true;

    }


    /*
    =========================================
    الأبناء
    =========================================
    */

    if (
        before.children.length !==
        after.children.length
    ) {

        return true;

    }


    for (
        let i = 0;
        i < before.children.length;
        i++
    ) {

        if (
            layoutChanged(
                before.children[i],
                after.children[i]
            )
        ) {

            return true;

        }

    }


    return false;

  }
  function restoreElementStyle(
    element,
    oldStyle
) {

    if (
        oldStyle === null
    ) {

        element.removeAttribute(
            "style"
        );

    } else {

        element.setAttribute(
            "style",
            oldStyle
        );

    }


    void testDiv.offsetWidth;

  }
  /* =================================================
   AUTOMATIC SCAN
================================================= */

async function startAutomaticScan() {

    if (scanning) {

        return;

    }


    scanning = true;

    stopScanning = false;


    progressBox.style.display =
        "block";


    const properties =
        Object.keys(
            propertyData
        );


    const total =
        properties.length;


    let parentCount = 0;

    let childCount = 0;

    let grandchildCount = 0;

    let falseCount = 0;


    for (
        let i = 0;
        i < total;
        i++
    ) {

        if (stopScanning) {

            break;

        }


        const property =
            properties[i];


        const values =
            getValues(
                property
            );


        let result = {

            true: false,

            target: null

        };


        for (
            let v = 0;
            v < values.length;
            v++
        ) {

            const value =
                normalizeValue(
                    values[v]
                );


            if (!value) {

                continue;

            }


            const test =
                testCSS(
                    property,
                    value
                );


            testedResults[
                makeKey(
                    property,
                    value
                )
            ] = test;


            /*
            ================================
            Parent = highest priority
            ================================
            */

            if (
                test.true &&
                test.target ===
                "parent"
            ) {

                result = {

                    true: true,

                    target: "parent"

                };

                break;

            }


            /*
            ================================
            Child
            ================================
            */

            if (
                test.true &&
                test.target ===
                "child"
            ) {

                if (
                    result.target !==
                    "parent"
                ) {

                    result = {

                        true: true,

                        target: "child"

                    };

                }

            }


            /*
            ================================
            Grandchild
            ================================
            */

            if (
                test.true &&
                test.target ===
                "grandchild"
            ) {

                if (
                    !result.true
                ) {

                    result = {

                        true: true,

                        target:
                            "grandchild"

                    };

                }

            }

        }


        testedResults[property] =
            result;


        /*
        ================================
        Statistics
        ================================
        */

        if (result.true) {

            if (
                result.target ===
                "parent"
            ) {

                parentCount++;

            }

            else if (
                result.target ===
                "child"
            ) {

                childCount++;

            }

            else if (
                result.target ===
                "grandchild"
            ) {

                grandchildCount++;

            }

        }

        else {

            falseCount++;

        }


        updateProperty(
            property
        );


        const current =
            i + 1;


        const percent =
            (
                current /
                total
            ) * 100;


        progressFill.style.width =
            percent + "%";


        progressText.textContent =

            current +
            " / " +
            total +
            " — " +
            percent.toFixed(1) +
            "%";


        document.getElementById(
            "totalCount"
        ).textContent =
            current +
            " / " +
            total;


        document.getElementById(
            "trueCount"
        ).textContent =
            parentCount;


        document.getElementById(
            "childCount"
        ).textContent =
            childCount;


        document.getElementById(
            "grandchildCount"
        ).textContent =
            grandchildCount;


        document.getElementById(
            "falseCount"
        ).textContent =
            falseCount;


        /*
        إعطاء المتصفح فرصة للرسم
        */

        await new Promise(
            resolve =>
                requestAnimationFrame(
                    resolve
                )
        );

    }


    scanning = false;


    if (stopScanning) {

        progressText.textContent =
            "⏹ تم إيقاف الفحص";

    }

    else {

        progressText.textContent =
            "✅ اكتمل فحص " +
            total +
            " Property";

    }


    generateJSON();

}


/* =================================================
   UPDATE PROPERTY
================================================= */

function updateProperty(
    property
) {

    const element =
        document.querySelector(
            '[data-property="' +
            CSS.escape(property) +
            '"]'
        );


    if (!element) {

        return;

    }


    const result =
        testedResults[property];


    setPropertyColor(
        element,
        result.target
    );


    const resultBox =
        element.querySelector(
            ".propertyResult"
        );


    if (!resultBox) {

        return;

    }


    resultBox.innerHTML = "";


    const bool =
        document.createElement(
            "span"
        );


    bool.className =
        "boolean " +
        (
            result.true
            ? "true"
            : "false"
        );


    bool.textContent =
        result.true
        ? "true"
        : "false";


    resultBox.appendChild(
        bool
    );


    if (result.target) {

        const target =
            document.createElement(
                "span"
            );


        target.className =
            "target";


        target.textContent =
            result.target;


        resultBox.appendChild(
            target
        );

    }

}


/* =================================================
   GENERATE JSON
================================================= */

function generateJSON() {

    const output = {};


    Object.keys(
        propertyData
    )
    .forEach(property => {

        const result =
            testedResults[property];


        if (!result) {

            return;

        }


        output[property] = {

            true:
                result.true,

            target:
                result.target

        };

    });


    jsonResult.value =
        JSON.stringify(
            {
                properties:
                    output
            },
            null,
            4
        );

}

document

    }

document
.getElementById("stopButton")

    }
);


/* =================================================
   MANUAL TEST
================================================= */

document
.getElementById("manualButton")
.addEventListener(
    "click",
    () => {

        const property =
            document
            .getElementById(
                "manualProperty"
            )
            .value
            .trim();


        const value =
            document
            .getElementById(
                "manualValue"
            )
            .value
            .trim();


        const result =
            testCSS(
                property,
                value
            );


        const box =
            document.getElementById(
                "manualResult"
            );


        box.classList.remove(
            "green",
            "blue",
            "white",
            "red"
        );


        if (
            result.target ===
            "parent"
        ) {

            box.classList.add(
                "green"
            );

        }

        else if (
            result.target ===
            "child"
        ) {

            box.classList.add(
                "blue"
            );

        }

        else if (
            result.target ===
            "grandchild"
        ) {

            box.classList.add(
                "white"
            );

        }

        else {

            box.classList.add(
                "red"
            );

        }


        box.textContent =

            result.true

            ? (
                "true — " +
                result.target
            )

            : "false — لا يوجد تأثير";

    }
);
